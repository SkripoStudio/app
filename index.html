:root{
  --ivory:#F4F0E6; --paper:#FBF9F4; --graphite:#2A2A2C; --ink2:#58564F; --muted:#8B877D;
  --line:#DDD6C8; --line2:#EAE5D9; --danger:#8E3B36; --ok:#54705A; --r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--graphite);
  font:400 15px/1.5 Raleway,'Segoe UI',system-ui,sans-serif;
  font-feature-settings:"lnum" 1,"tnum" 1;font-variant-numeric:lining-nums tabular-nums}
button,input,select,textarea{font:inherit;color:inherit;font-feature-settings:inherit}
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
#side{background:var(--paper);border-right:1px solid var(--line);padding:30px 18px 22px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:0 8px 26px}
.brand .wm{font-family:Georgia,"Times New Roman",serif;font-size:38px;line-height:1;white-space:nowrap;letter-spacing:.01em}
.brand .sub{font-weight:300;letter-spacing:.34em;text-transform:uppercase;font-size:10.5px;color:var(--muted);margin-top:10px}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:14.5px}
nav a:hover{background:var(--line2)}
nav a.on{background:var(--graphite);color:var(--ivory)}
.sidefoot{margin-top:auto;padding:0 8px;font-size:12px;color:var(--muted);font-weight:300}
main{padding:38px 46px 80px;max-width:1260px;width:100%;min-width:0}
#list{overflow-x:auto}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px;flex-wrap:wrap}
h1{font-weight:300;font-size:32px;letter-spacing:.015em;margin:0;line-height:1.15}
h2{font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
h3{font-weight:600;font-size:15px;margin:0}
.lead{color:var(--ink2);font-weight:300;margin:6px 0 0;max-width:640px}
.btn{background:var(--graphite);color:var(--ivory);border:1px solid var(--graphite);border-radius:8px;padding:9px 18px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:#000}
.btn.ghost{background:transparent;color:var(--graphite);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--graphite);background:transparent}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--danger);border-color:transparent;padding-left:0}
.btn.danger:hover{background:transparent;text-decoration:underline}
.linkbtn{background:none;border:0;padding:0;color:var(--graphite);text-decoration:underline;cursor:pointer;font-size:13px}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--graphite)}
input:disabled,select:disabled,textarea:disabled{background:var(--line2);color:var(--ink2)}
textarea{min-height:70px;resize:vertical}
.toolbar input[type=search]{max-width:320px}
.toolbar select{max-width:210px;width:auto}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--ink2)}
.chk input{width:16px;height:16px;accent-color:var(--graphite)}
label.f{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
label.f>*:not(.nolabel){margin-top:5px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--graphite)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.g-a{grid-template-columns:2fr 1fr 1fr}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.mcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.mcard:hover{border-color:var(--graphite)}
.mcard .ph{aspect-ratio:4/3;background:var(--line2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:Georgia,"Times New Roman",serif;font-size:44px;overflow:hidden}
.mcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mc-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.mc-cat{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mc-sup{font-size:13px;color:var(--ink2);font-weight:300;min-height:20px}
.mc-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;font-size:13.5px}
.mc-row b{font-weight:600}
.mc-b .chk{margin-top:8px;font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.tag.dark{background:var(--graphite);border-color:var(--graphite);color:var(--ivory)}
.tag.bad{border-color:var(--danger);color:var(--danger)}
.tag.good{border-color:var(--ok);color:var(--ok)}
.bad-t{color:var(--danger)} .good-t{color:var(--ok)} .muted{color:var(--muted)}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t .r{text-align:right}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:rgba(0,0,0,.025)}
table.mini td,table.mini th{padding:7px 8px}
table.mini td input,table.mini td select{padding:7px 9px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-size:28px;font-weight:300;margin-top:6px;line-height:1.1}
.stat .s{font-size:12.5px;color:var(--ink2);font-weight:300;margin-top:4px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:42px 20px;text-align:center;color:var(--ink2);font-weight:300}
.empty .btn{margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.row-between{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.sum{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2);font-size:14.5px}
.sum.total{font-weight:600;border-bottom:0;border-top:1px solid var(--graphite);margin-top:4px;padding-top:10px;font-size:16px}
.sum span:first-child{color:var(--ink2)}
.sum.total span:first-child{color:var(--graphite)}
.note{font-size:13px;color:var(--ink2);font-weight:300}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 16px;cursor:pointer;font-size:14px;color:var(--ink2);font-weight:500}
.seg button.on{background:var(--graphite);color:var(--ivory)}
.banner{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--graphite);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(42,42,44,.42);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:50}
.modal{background:var(--ivory);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:92vh}
.modal.wide{max-width:980px}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:20px;font-weight:300;letter-spacing:.02em;text-transform:none;color:var(--graphite)}
.modal .x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}
.mbody{padding:20px 24px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.modal footer{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.modal footer .r{display:flex;gap:10px;margin-left:auto}
.sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 -4px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumb{position:relative;width:92px;height:92px;border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;background:rgba(42,42,44,.75);color:#fff;border:0;border-radius:50%;width:20px;height:20px;line-height:18px;cursor:pointer;font-size:13px;padding:0}
.addph{width:92px;height:92px;border:1px dashed var(--muted);border-radius:8px;background:transparent;cursor:pointer;color:var(--ink2);font-size:13px}
.lines .ln{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--paper);display:flex;flex-direction:column;gap:10px}
.ln-top{display:grid;grid-template-columns:3fr 80px 120px 34px;gap:10px;align-items:end}
details summary{cursor:pointer;font-size:13px;color:var(--ink2)}
.lightbox{position:fixed;inset:0;background:rgba(20,20,22,.88);display:flex;align-items:center;justify-content:center;z-index:100;cursor:zoom-out;padding:20px}
.lightbox img{max-width:96vw;max-height:94vh;border-radius:6px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--graphite);color:var(--ivory);padding:10px 20px;border-radius:30px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200}
#toast.on{opacity:1}
/* estimate document */
.doc{background:#fff;border:1px solid var(--line);border-radius:6px;padding:44px 52px;max-width:860px}
.doc .dh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--graphite);padding-bottom:18px;margin-bottom:22px;gap:20px}
.doc .wm{font-family:Georgia,"Times New Roman",serif;font-size:42px;line-height:1;white-space:nowrap}
.doc .dt{text-align:right;font-size:13.5px;color:var(--ink2)}
.doc .dt b{display:block;font-size:17px;color:var(--graphite);font-weight:600;letter-spacing:.04em;margin-bottom:2px}
.doc .blk{margin-bottom:26px}
.doc .blk h3{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px}
.doc .blk h3 span{font-weight:400;color:var(--ink2)}
.doc table.t td,.doc table.t th{padding:7px 8px}
.doc .totals{margin-left:auto;max-width:380px;margin-top:18px}
.doc .foot{margin-top:30px;font-size:13px;color:var(--ink2);font-weight:300}
.est-ctl{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.est-ctl .f{min-width:200px}
@media(max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:static;height:auto;flex-direction:row;align-items:center;gap:14px;padding:14px 16px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0}.brand .wm{font-size:30px}.brand .sub{display:none}
  nav{flex-direction:row}nav a{white-space:nowrap}
  .sidefoot{display:none}
  main{padding:22px 16px 70px}
  .g2,.g3,.g4,.g-a,.two{grid-template-columns:1fr}
  .ln-top{grid-template-columns:1fr 70px 100px 34px}
  .doc{padding:24px 18px}
  table.t.stack{display:block;overflow-x:auto}
}
@media print{
  body{background:#fff}
  #side,.no-print,#toast{display:none!important}
  #app{display:block}
  main{padding:0;max-width:none}
  .doc{border:0;padding:0;max-width:none}
  @page{margin:16mm}
}
/* ---- stage 1 additions ---- */
.brand-logo{display:block;width:100%;max-width:190px;height:auto}
.doc .doc-logo{height:58px;width:auto;display:block}
.tag.arch{border-style:dashed;color:var(--muted)}
.mcard.archived{opacity:.7}
.prow{display:flex;gap:12px;align-items:center}
.pthumb{width:44px;height:44px;border-radius:6px;object-fit:cover;border:1px solid var(--line);flex:none}
@media(max-width:900px){.brand-logo{max-width:130px}}
/* ---- stage 4: reports ---- */
.rbar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;min-width:60px}
.rbar span{display:block;height:100%;background:var(--graphite);border-radius:4px}
.rbar span.bad{background:var(--danger)}.rbar span.good{background:var(--ok)}
.stat.click{cursor:pointer}.stat.click:hover{border-color:var(--graphite)}
.stats+h2,.stats+.two{margin-top:26px}
/* ---- notebook navigation ---- */
.sidefoot{display:flex;flex-direction:column;gap:6px}
.sidefoot .footlink{color:var(--ink2);text-decoration:none;font-size:12.5px;font-weight:500;padding:6px 0;border-top:1px solid var(--line2);margin-top:4px}
.sidefoot .footlink:hover,.sidefoot .footlink.on{color:var(--graphite);text-decoration:underline}
.seg.tabs{margin:-6px 0 18px}.seg.tabs a{padding:8px 18px;text-decoration:none;color:var(--ink2);font-weight:500;font-size:14px}
.seg.tabs a.on{background:var(--graphite);color:var(--ivory)}
/* ---- visual polish ---- */
/* one text size for every field: card forms (inside label.f, which is 12px caps) and table rows alike */
label.f input,label.f select,label.f textarea,table.mini td input,table.mini td select,.toolbar input,.toolbar select{font-size:14.5px}
/* date fields as tall as the neighbouring inputs/selects */
input[type=date]{min-height:40px}
/* collapsible «Работа над заказом» */
details.block{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:0 18px}
details.block>summary{padding:14px 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:600}
details.block[open]{padding-bottom:16px}
/* amounts never wrap onto two lines */
.sum>span:last-child{white-space:nowrap;padding-left:12px}

/* =====================================================================
   «Ателье» — white design layer (2026-11-13). Overrides the linen theme above;
   layout: one top bar (logo · centred menu · settings), white surfaces, serif titles,
   hairline tables, text-only statuses, rounded cards (14px) and controls (8px).
   ===================================================================== */
:root{
  --ivory:#ffffff; --paper:#ffffff; --graphite:#111111; --ink2:#3a3a3a; --muted:#8a8a8a;
  --line:#e8e8e8; --line2:#f1f1f1; --line-field:#cfcfcf; --tile:#f5f5f3;
  --danger:#9b2c2c; --ok:#2f5d3a; --warn:#8a5a1f; --r:14px; --rs:8px; --gutter:24px;
}
body{background:#fff}
#app{display:block;min-height:100vh}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:#fff;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:32px;padding:14px 48px;border-bottom:1px solid var(--graphite)}
.topbar .brand{padding:0;display:block;justify-self:start}
.topbar .brand-logo{height:54px;width:auto;max-width:none;display:block}
#nav{display:flex;flex-direction:row;gap:36px}
#nav a{display:block;padding:10px 0;border-radius:0;border-top:1px solid transparent;border-bottom:1px solid transparent;background:none;color:var(--muted);font-weight:400;font-size:12.5px;letter-spacing:.2em;text-transform:lowercase;line-height:1}
#nav a:hover{background:none;color:var(--graphite)}
#nav a.on{background:none;color:var(--graphite);border-bottom-color:var(--graphite)}
.topright{justify-self:end;display:flex;align-items:center;gap:24px}
.toplink{font-size:12.5px;letter-spacing:.2em;color:var(--muted);text-decoration:none;line-height:1;padding:10px 0;border-top:1px solid transparent;border-bottom:1px solid transparent}
.toplink:hover,.toplink.on{color:var(--graphite)}.toplink.on{border-bottom-color:var(--graphite)}
main{max-width:1440px;width:100%;margin:0 auto;padding:48px 48px 40px}
.appfoot{max-width:1440px;margin:0 auto;padding:8px 48px 32px;display:flex;gap:18px;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.appfoot .bad-t{color:var(--danger)}
/* type */
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:44px;line-height:1.05;letter-spacing:-.01em}
.head{align-items:flex-end;margin-bottom:28px;gap:24px}
.lead{color:var(--muted);font-weight:400;font-size:14px;max-width:720px;margin:12px 0 0}
h2{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:lowercase;color:var(--muted);margin:40px 0 14px}
h3{font-weight:500}
.sec{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:lowercase;color:var(--muted);margin:10px 0 -2px}
label.f{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:lowercase}
.note{font-weight:400;color:var(--muted)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 18px;border-radius:var(--rs);background:var(--graphite);border:1px solid var(--graphite);color:#fff;font-weight:400;font-size:13px;letter-spacing:.06em;line-height:1}
.btn:hover{background:#2b2b2b}
.btn.ghost{background:#fff;color:var(--graphite);border-color:var(--graphite)}
.btn.ghost:hover{background:var(--graphite);color:#fff;border-color:var(--graphite)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.btn.danger{height:auto;padding:0;background:transparent;border-color:transparent;color:var(--danger)}
.btn.danger:hover{background:transparent;color:var(--danger)}
.linkbtn{color:var(--graphite)}
/* tabs (view switches, materials tabs, estimate, production) as underlined text */
.seg{display:inline-flex;gap:28px;border:0;border-radius:0;overflow:visible}
.seg button,.seg a{background:none!important;border:0;border-bottom:1px solid transparent;border-radius:0;padding:0 0 10px;color:var(--muted);font-weight:400;font-size:13px;letter-spacing:.08em;line-height:1.2}
.seg button.on,.seg a.on{color:var(--graphite)!important;border-bottom-color:var(--graphite)}
.seg.tabs{margin:0 0 24px;border-bottom:1px solid var(--line);display:flex}
.seg.tabs a{margin-bottom:-1px}
/* toolbar: one hairline row under filters */
.toolbar{gap:24px;align-items:flex-end;margin-bottom:32px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.toolbar .seg{margin-bottom:-13px}
.toolbar input[type=search]{max-width:300px}
/* fields: underline */
input[type=text],input[type=search],input[type=date],input[type=number],select{background:transparent;border:0;border-bottom:1px solid var(--line-field);border-radius:0;padding:8px 0;min-height:40px}
input[type=text]:focus,input[type=search]:focus,input[type=date]:focus,input[type=number]:focus,select:focus{border-color:var(--graphite)}
textarea{background:#fff;border:1px solid var(--line-field);border-radius:var(--rs);padding:10px 12px}
textarea:focus{border-color:var(--graphite)}
input:disabled,select:disabled,textarea:disabled{background:transparent;color:var(--muted);border-bottom-style:dashed}
table.mini td input,table.mini td select{padding:6px 0;min-height:34px}
.chk input{accent-color:var(--graphite)}
/* tables: hairlines, fixed gutter, first-line alignment */
table.t th{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:lowercase;color:var(--muted);padding:0 var(--gutter) 12px 0;border-bottom:1px solid var(--graphite)}
table.t td{padding:16px var(--gutter) 16px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
table.t th:last-child,table.t td:last-child{padding-right:0}
table.t tr.click:hover td{background:#fafafa}
table.mini th{padding:0 12px 8px 0;border-bottom:1px solid var(--line)}
table.mini td{padding:8px 12px 8px 0;vertical-align:middle;border-bottom:1px solid var(--line2)}
table.t td .tag{display:inline-block;line-height:calc(15px * 1.45);vertical-align:top}
.pthumb{width:44px;height:44px;border-radius:var(--rs);border:0;box-shadow:inset 0 0 0 1px var(--line)}
/* statuses: text only */
.tag{border:0;border-radius:0;padding:0;background:none;font-weight:400;font-size:11px;letter-spacing:.16em;text-transform:lowercase;color:var(--ink2)}
.tag.good{color:var(--ok)}.tag.bad{color:var(--danger)}.tag.dark{background:none;color:var(--graphite)}.tag.arch{border:0;color:var(--muted)}
/* catalog cards: photo 3:4, rounded */
.cards{grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:40px 24px}
.mcard{background:transparent;border:0;border-radius:0;overflow:visible}
.mcard:hover{border:0}
.mcard .ph{aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--tile);font-family:Georgia,serif;font-style:italic;font-size:56px;color:#c8c8c4}
.mcard .ph img{transition:transform .4s ease}
.mcard:hover .ph img{transform:scale(1.03)}
.mc-b{padding:14px 0 0;gap:2px}
.mc-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px}
.mc-sup{font-weight:400;font-size:12.5px;color:var(--muted);min-height:0}
.mc-b .tag{margin-top:8px;align-self:flex-start}
/* panels, stats, banners, blocks */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px 32px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.stat .k{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:lowercase}
.stat .v{font-family:Georgia,"Times New Roman",serif;font-weight:400}
.banner{background:#fff;border:1px solid var(--line);border-left:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
.empty{border:1px dashed var(--line-field);border-radius:var(--r);color:var(--muted)}
.lines .ln{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
details.block{background:#fff;border:1px solid var(--line);border-radius:var(--r)}
details.block>summary{font-weight:400;letter-spacing:.16em;text-transform:lowercase;color:var(--muted)}
.sum{border-bottom:1px solid var(--line2)}
.sum.total{border-top:1px solid var(--graphite);font-weight:500}
.thumb,.addph{border-radius:var(--rs)}
/* modal */
.overlay{background:rgba(17,17,17,.32)}
.modal{background:#fff;border-radius:16px;box-shadow:0 24px 64px rgba(0,0,0,.18)}
.modal header{padding:20px 28px;border-bottom:1px solid var(--line)}
.modal header h2{font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--graphite);margin:0}
.mbody{padding:24px 28px;gap:18px}
.modal footer{padding:16px 28px;border-top:1px solid var(--line)}
#toast{background:var(--graphite);color:#fff;border-radius:var(--rs)}
.rbar span{background:var(--graphite)}
.doc{border-radius:var(--r)}
/* print + small screens */
@media print{.topbar,.appfoot{display:none!important}}
@media(max-width:1000px){
  .topbar{grid-template-columns:1fr auto;padding:12px 16px;gap:12px}
  #nav{grid-column:1 / -1;order:3;overflow-x:auto;gap:22px}
  .topbar .brand-logo{height:40px}
  main{padding:28px 16px 32px}.appfoot{padding:8px 16px 24px}
  h1{font-size:34px}
}
.tag.warn{color:var(--warn)}
table.mats .chk{align-items:flex-start;gap:8px;margin:0}
table.mats .chk input{margin-top:3px}
tr.archived td{opacity:.65}
/* toolbar: tabs, search, selects and checkboxes stand on the one shared rule (no double underline) */
.toolbar{padding-bottom:0;align-items:flex-end}
.toolbar .seg{margin-bottom:-1px}
.toolbar .seg button,.seg.tabs a{padding:0 0 12px}
.toolbar input[type=search],.toolbar input[type=date],.toolbar select{border-bottom:0;padding:0 0 12px;min-height:0;line-height:1.2}
.toolbar .chk{padding-bottom:12px;line-height:1.2}
.toolbar label.f{padding-bottom:12px}
.seg.tabs a{font-size:13px;letter-spacing:.08em;font-weight:400;color:var(--muted);background:none}
.seg.tabs a.on{background:none;color:var(--graphite)}
.appfoot span:empty{display:none}

/* =====================================================================
   «Ателье» · compact scale (2026-11-13): everything ~20 % smaller —
   type, headings, spacing, header, controls, windows, catalog cards.
   ===================================================================== */
body{font-size:13.5px;line-height:1.5}
/* header */
.topbar{padding:10px 32px;gap:24px}
.topbar .brand-logo{height:40px}
#nav{gap:26px}
#nav a,.toplink{font-size:11.5px;letter-spacing:.18em;padding:8px 0}
/* page frame */
main{max-width:1280px;padding:30px 32px 28px}
.appfoot{max-width:1280px;padding:4px 32px 24px;font-size:10.5px}
h1{font-size:30px}
.head{margin-bottom:20px;gap:18px}
.lead{font-size:12.5px;margin-top:8px;max-width:640px}
h2{font-size:11px;margin:28px 0 10px}
h3{font-size:14px}
.sec,label.f{font-size:11px}
.note{font-size:12px}
/* controls */
.btn{height:34px;padding:0 14px;font-size:12.5px}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
input[type=text],input[type=search],input[type=date],input[type=number],select{min-height:34px;padding:6px 0;font-size:13.5px}
table.mini td input,table.mini td select{min-height:30px;padding:4px 0}
textarea{min-height:56px;padding:8px 10px;font-size:13.5px}
.seg{gap:22px}
.seg button,.seg a{font-size:12.5px}
.toolbar{margin-bottom:22px;gap:18px}
.toolbar .seg button,.seg.tabs a{padding-bottom:10px}
.toolbar input[type=search],.toolbar input[type=date],.toolbar select{padding-bottom:10px}
.toolbar .chk,.toolbar label.f{padding-bottom:10px}
.toolbar input[type=search]{max-width:260px}
.seg.tabs{margin-bottom:18px}
.chk{font-size:13px}
/* tables */
table.t th{font-size:11px;padding:0 18px 9px 0}
table.t td{padding:11px 18px 11px 0;line-height:1.4}
table.t th:last-child,table.t td:last-child{padding-right:0}
table.t td .tag{line-height:calc(13.5px * 1.4)}
table.mini th{padding:0 10px 6px 0}
table.mini td{padding:6px 10px 6px 0}
.pthumb{width:34px;height:34px;border-radius:6px}
.tag{font-size:10.5px}
/* catalog cards: smaller photos, fixed card width instead of stretching */
.cards{grid-template-columns:repeat(auto-fill,minmax(150px,176px));justify-content:start;gap:28px 18px}
.mcard .ph{border-radius:12px;font-size:40px}

.panel{padding:20px 22px;border-radius:12px}
.stats{gap:12px}
.stat{padding:14px 16px;border-radius:12px}
.stat .v{font-size:22px}
.stat .s{font-size:11.5px}

/* windows */

.modal header h2{font-size:20px}

@media(max-width:1000px){

@media(max-width:1000px){.topbar{padding-left:16px;padding-right:16px}}

/* phone fixes (2026-11-13): purchase form and money rows no longer push modals wider than the screen */

  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
  const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
  const fmt=(n,d=2)=>(isFinite(n)?n:0).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
  const uah=n=>fmt(n,Math.abs(n)>=1000?0:2)+' ₴';
  const usd=n=>'$'+fmt(n,Math.abs(n)>=1000?0:2);
  const qf=n=>String(Math.round(n*1000)/1000).replace('.',',');
  const r2=n=>Math.round(n*100)/100;
  const r3=n=>Math.round(n*1000)/1000;
  const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
  const nowISO=()=>new Date().toISOString();
  const fdate=s=>s?String(s).slice(0,10).split('-').reverse().join('.'):'';
  const clone=o=>JSON.parse(JSON.stringify(o));
  function setPath(o,path,val){const p=path.split('.');let c=o;for(let i=0;i<p.length-1;i++){if(c[p[i]]==null)c[p[i]]={};c=c[p[i]]}c[p[p.length-1]]=val}
  /* name key for matching products across apps: "Zip Wallet" == "ZipWallet" */
  const nameKey=s=>String(s||'').toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'');
  return {$,$$,esc,uid,num,fmt,uah,usd,qf,r2,r3,today,nowISO,fdate,clone,setPath,nameKey};
})();
</script>
<script>
/* ======== js/domain/schema.js ======== */
/* Skripo Studio · domain/schema.js — data model v2: constants, seeds, empty state.
 *
 * Money rules (owner decision 2026-11-11):
 *   - base currency UAH: material prices are converted to UAH, labor, overhead, all costs in UAH;
 *   - retail prices and order amounts in USD;
 *   - each order freezes its exchange rate (order.rateSnap); history is never recalculated.
 * Labor: one base hourly rate (settings.hourRate, UAH) × norm minutes of each operation in product.route.
 * Archive: materials / products / operations have `archived`; used records are never deleted physically.
 * Cost layers: live norm (computed) → order.plan (snapshot at write-off) → order.fact (stage 3, from jobs).
 */
'use strict';
var SK = window.SK = window.SK || {};

SK.schema = (function(){
  const VERSION = 2;

  const CATS=['Кожа','Замша','Нить','Подкладка','Фурнитура','Клей и химия','Упаковка','Другое'];
  const UNITS=['дм²','м','шт','г','мл','лист'];
  const PSTAT=['В наличии','Под заказ','В разработке'];
  const PCATS=['Кошельки','Сумки','Рюкзаки','Аксессуары','Обувь','Другое'];
  const OSTAT=['Новый','В работе','Готов','Отправлен','Закрыт','Отменён'];
  const ACTIVE=['Новый','В работе','Готов','Отправлен'];
  const WRITE_STATES=['В работе','Готов','Отправлен','Закрыт'];
  const CHANNELS=['Instagram','WhatsApp','Telegram','Viber','Телефон','Другое'];
  /* stock ledger move types; qty sign: + incoming, − outgoing */
  const MOVE_TYPES={opening:'Начальный остаток',purchase:'Закупка',issue:'Списание в заказ',ret:'Возврат на склад',adjust:'Корректировка'};

  /* Full cost (owner decision 2026-11-12). Direct costs = BOM grouped by material category + labor.
     Optional extra expense items: group 'per-item' (packaging, box, tag, delivery…) or 'brand' (ads, photo, content,
     model development, site…); method 'fixed' (per item) | 'batch' (amount / planned qty) | 'percent' (of the agreed price). */
  const DIRECT_GROUPS={materials:'Материалы',hardware:'Фурнитура',consumables:'Расходные материалы'};
  const CAT_DIRECT={'Кожа':'materials','Замша':'materials','Подкладка':'materials','Другое':'materials','Фурнитура':'hardware',
    'Нить':'consumables','Клей и химия':'consumables','Упаковка':'consumables'};
  const directGroupOf=cat=>CAT_DIRECT[cat]||'materials';   // custom categories count as materials
  const COST_GROUPS={'per-item':'Дополнительные на изделие',brand:'Распределяемые расходы бренда'};
  const COST_METHODS={fixed:'Фиксированно на изделие',batch:'На партию (делится на плановое количество)',percent:'% от цены продажи'};

  /* Operation dictionary seed — preliminary norms (minutes), NOT final standards.
     Real norms are set per product in product.route[].min. */
  const OPERATIONS_SEED=[
    ['prep',    'Подготовка и разметка',        10, 20],
    ['cut',     'Раскрой кожи',                 10, 20],
    ['skive',   'Спуск кожи',                    5, 15],
    ['parts',   'Подготовка деталей',           10, 20],
    ['weave',   'Плетение',                     30,120],
    ['glue',    'Склейка и сборка',             15, 40],
    ['stitch',  'Прошивка',                     20, 60],
    ['edge',    'Обработка уреза',              15, 40],
    ['hardware','Установка фурнитуры',           5, 15],
    ['finish',  'Финальная отделка',            10, 20],
    ['qc',      'Контроль качества и упаковка',  5, 10]
  ];
  /* Holds labor time migrated from Sklad v1 (one "hours" number per product, no breakdown). */
  const LEGACY_OP={id:'op-legacy',code:'legacy',name:'Работа без разбивки (перенесено)',normMin:null,preliminary:false,legacy:true,archived:false};

  function seedOperations(){
    return OPERATIONS_SEED.map(([code,name,a,b],i)=>({id:'op-'+code,code,name,normMin:[a,b],preliminary:true,legacy:false,order:i+1,archived:false}))
      .concat([Object.assign({order:99},LEGACY_OP)]);
  }

  function defaultSettings(){
    return {rate:41.5,hourRate:0,overhead:0,margin:60,lastBackup:null,orderSeq:0,jobSeq:0};
  }
  function emptyCalc(){ return {pid:'',qty:'1',comp:[],hours:'',other:[],margin:'',price:''}; }

  function emptyState(){
    return {v:VERSION,
      settings:defaultSettings(),
      materials:[], stockMoves:[], operations:seedOperations(), products:[], orders:[], jobs:[], costItems:[],
      calc:emptyCalc(), migrations:[]};
  }

  /* Record shapes (for reference; normalize() in migrate.js enforces them):
   * material  {id,name,cat,unit,price,cur:'UAH'|'USD',supplier,source,note,stock,minStock,inStock,
   *            photoIds:[],purchases:[{id,date,qty,total,cur,rate}],archived}
   * stockMove {id,at,date,mid,type,qty,unitCostUAH,ref:{orderId}|null,note}
   * operation {id,code,name,normMin:[min,max]|null,preliminary,legacy,order,archived}
   * product   {id,name,size,status,category,color,construction,hardware,materialNote,
   *            priceUSD,images:[assets path],photoIds:[],
   *            bom:[{mid,qty}],route:[{opId,min}],other:[{name,uah}],costItemsOff:[costItem ids],notes,archived,origin:{sklad,catalog}}
   * costItem  {id,name,group:'per-item'|'brand',method:'fixed'|'batch'|'percent',amount,cur:'UAH'|'USD',batchQty,
   *            scope:'all'|[product ids],archived}   — optional extra expenses, each counted once per item
   * order     {id,no,date,client,contact,channel,deadline,status,notes,
   *            lines:[{id,pid,qty,priceUSD,note,subs:{mid:mid}}],paidUSD,
   *            rateSnap:{rate,at,frozen,restored},
   *            written:{mid:qty}|null,
   *            plan:{at,rate,matUAH,laborUAH,otherUAH,overheadUAH,totalUAH,hourRate,overheadPct,lines:[…],restored}|null,
   *            fact:{at,rate,matUAH,laborUAH,otherUAH,overheadUAH,totalUAH,minutes,qtyDone,jobs:[…],version,reason?}|null,
   *            factHistory:[…superseded facts with reason]}
   * job       see domain/production.js (stage 3): route copy, plan at creation, actual snapshot + actualHistory
   */
  return {VERSION,DIRECT_GROUPS,CAT_DIRECT,directGroupOf,COST_GROUPS,COST_METHODS,CATS,UNITS,PSTAT,PCATS,OSTAT,ACTIVE,WRITE_STATES,CHANNELS,MOVE_TYPES,LEGACY_OP,
          seedOperations,defaultSettings,emptyCalc,emptyState};
})();
</script>
<script>
/* ======== js/domain/costing.js ======== */
/* Skripo Studio · domain/costing.js — all cost / price / margin math. Pure: reads SK.S only.
 * Cost formula (unchanged from Sklad v1, labor now from operations):
 *   materials = Σ bom.qty × material price in UAH (USD × settings.rate)
 *   labor     = Σ route.min / 60 × settings.hourRate
 *   other     = Σ other.uah
 *   overhead  = (materials + labor) × settings.overhead %
 */
'use strict';
var SK = window.SK = window.SK || {};

SK.costing = (function(){
  const {num,r3}=SK.util;
  const S=()=>SK.S;
  const matById=id=>S().materials.find(m=>m.id===id);
  const prodById=id=>S().products.find(p=>p.id===id);
  const opById=id=>S().operations.find(o=>o.id===id);

  /* accounting unit cost in UAH: weighted average from the stock ledger; until a material has costed moves —
     its list/last purchase price (USD converted at the current rate) */
  const listUAH=m=>m?(m.cur==='USD'?num(m.price)*num(S().settings.rate):num(m.price)):0;
  const matUAH=m=>m?(m.avgCostUAH!=null&&isFinite(m.avgCostUAH)?num(m.avgCostUAH):listUAH(m)):0;
  const isLow=m=>!m.inStock||(num(m.minStock)>0&&num(m.stock)<=num(m.minStock));

  /* labor time */
  const routeMinutes=route=>(route||[]).reduce((a,s)=>a+num(s.min),0);
  const routeHours=route=>routeMinutes(route)/60;
  /* the Sklad UI edits one "hours" number: it maps onto a single legacy route step */
  const routeFromHours=h=>num(h)?[{opId:SK.schema.LEGACY_OP.id,min:r3(num(h)*60)}]:[];
  const hoursEditable=route=>(route||[]).length===0||((route||[]).length===1&&route[0].opId===SK.schema.LEGACY_OP.id);

  function costOf(bom,o){
    o=o||{};const subs=o.subs||{},qty=o.qty==null?1:o.qty,st=S().settings;
    const rows=(bom||[]).filter(c=>c.mid).map(c=>{
      const mid=subs[c.mid]||c.mid,m=matById(mid),q=num(c.qty)*qty,p=matUAH(m);
      return {mid,orig:c.mid,name:m?m.name:'(материал удалён)',unit:m?m.unit:'',qty:q,price:p,sum:q*p,subbed:mid!==c.mid,missing:!m,archived:!!(m&&m.archived)};
    });
    const mat=rows.reduce((a,r)=>a+r.sum,0);
    const hours=routeHours(o.route)*qty,labor=hours*num(st.hourRate);
    const ops=(o.route||[]).map(s=>{const op=opById(s.opId);const h=num(s.min)/60*qty;return {opId:s.opId,name:op?op.name:'(операция)',hours:h,sum:h*num(st.hourRate)}});
    const oth=(o.other||[]).filter(x=>x.name||num(x.uah)).map(x=>({name:x.name||'Прочее',sum:num(x.uah)*qty}));
    const otherSum=oth.reduce((a,x)=>a+x.sum,0);
    const overhead=(mat+labor)*num(st.overhead)/100;
    return {rows,mat,hours,labor,ops,oth,otherSum,overhead,total:mat+labor+otherSum+overhead,qty};
  }
  const prodCost=(p,qty=1,subs)=>costOf(p.bom,{route:p.route,other:p.other,subs,qty});

  /* ---- orders: money in USD at the order's frozen rate, cost in UAH ---- */
  const orderRate=o=>o&&o.rateSnap&&num(o.rateSnap.rate)?num(o.rateSnap.rate):num(S().settings.rate);
  const orderLineCost=l=>{const p=prodById(l.pid);return p?prodCost(p,num(l.qty)||1,l.subs):costOf([])};
  const orderTotal=o=>o.lines.reduce((a,l)=>a+num(l.priceUSD)*(num(l.qty)||1),0);
  const orderCostLive=o=>o.lines.reduce((a,l)=>a+orderLineCost(l).total,0);
  /* fact (stage 3) beats plan snapshot beats live norm */
  const orderCost=o=>o.fact&&o.fact.totalUAH!=null?o.fact.totalUAH:o.plan&&o.plan.totalUAH!=null?o.plan.totalUAH:orderCostLive(o);
  const orderRevenueUAH=o=>orderTotal(o)*orderRate(o);
  const orderProfitUAH=o=>orderRevenueUAH(o)-orderCost(o);

  const margin=(priceUAH,cost)=>priceUAH>0?(priceUAH-cost)/priceUAH:null;

  /* materials needed for an order (after substitutions), by material id */
  function consumption(o){
    const m=new Map();
    o.lines.forEach(l=>orderLineCost(l).rows.forEach(r=>{if(!r.missing)m.set(r.mid,(m.get(r.mid)||0)+r.qty)}));
    return m;
  }

  /* recommended price for a target margin, rounded up to $5 */
  function recommendedUSD(costUAH,marginPct,rate){
    const tm=num(marginPct)/100;rate=num(rate);
    if(!(tm<1)||!rate||!costUAH)return {exactUAH:0,exactUSD:0,round5:0};
    const exactUAH=costUAH/(1-tm),exactUSD=exactUAH/rate;
    return {exactUAH,exactUSD,round5:Math.ceil(exactUSD/5)*5};
  }

  return {matById,prodById,opById,matUAH,listUAH,isLow,routeMinutes,routeHours,routeFromHours,hoursEditable,
          costOf,prodCost,orderRate,orderLineCost,orderTotal,orderCostLive,orderCost,orderRevenueUAH,orderProfitUAH,
          margin,consumption,recommendedUSD};
})();
</script>
<script>
/* ======== js/domain/fullcost.js ======== */
/* Skripo Studio · domain/fullcost.js — full product cost on top of the unchanged production cost (owner decision 2026-11-12).
 *
 *   A. direct      = BOM grouped by material category (materials · hardware · consumables) + labor     ┐ production cost
 *   workshop overhead % of (materials + labor)  — unchanged                                             │ = costing.costOf().total
 *   individual     = product.other[] (fixed per item) — unchanged                                       ┘ (all old numbers stay)
 *   B. per-item    = individual + optional expense items of group 'per-item'
 *   C. brand       = optional expense items of group 'brand'
 *   full = production + Σ expense items        (each item counted once per unit; product can switch an item off)
 *
 * Item methods: fixed → amount per item; batch → amount / planned batchQty; percent → % of the agreed unit price.
 * USD amounts are converted at the given rate (orders: the order's frozen rate). Pure: reads SK.S only.
 */
'use strict';
var SK = window.SK = window.SK || {};

SK.fullcost = (function(){
  const {num}=SK.util;
  const S=()=>SK.S;
  const C=()=>SK.costing,SC=()=>SK.schema;
  const items=()=>S().costItems||[];

  const applies=(it,pid)=>!it.archived&&(it.scope==='all'||!it.scope||(Array.isArray(it.scope)&&pid&&it.scope.includes(pid)));
  function applicable(pid,off){off=off||[];return items().filter(it=>applies(it,pid)&&!off.includes(it.id))}

  /* per-unit UAH of one item; percent needs the agreed unit price (UAH) */
  function unitUAH(it,priceUAH,rate){
    const amt=num(it.amount)*(it.cur==='USD'?num(rate):1);
    if(it.method==='batch')return num(it.batchQty)>0?amt/num(it.batchQty):0;
    if(it.method==='percent')return num(priceUAH)*num(it.amount)/100;
    return amt;
  }

  /* base = costing.costOf(...) result for `qty` units (unchanged production cost) */
  function full(base,o){
    o=o||{};const qty=base.qty||1,rate=o.rate==null?num(S().settings.rate):num(o.rate);
    const direct={materials:0,hardware:0,consumables:0,labor:base.labor};
    base.rows.forEach(r=>{const m=C().matById(r.mid);direct[SC().directGroupOf(m?m.cat:'')]+=r.sum});
    direct.total=direct.materials+direct.hardware+direct.consumables+direct.labor;
    const list=applicable(o.pid,o.off).map(it=>{
      const u=unitUAH(it,o.priceUAH,rate);
      return {id:it.id,name:it.name,group:it.group==='brand'?'brand':'per-item',method:it.method||'fixed',amount:num(it.amount),cur:it.cur==='USD'?'USD':'UAH',
              batchQty:it.method==='batch'?num(it.batchQty):null,pct:it.method==='percent'?num(it.amount):null,unitUAH:u,sumUAH:u*qty};
    });
    const sum=g=>list.filter(x=>x.group===g).reduce((a,x)=>a+x.sumUAH,0);
    const perItemItems=sum('per-item'),brand=sum('brand'),extras=perItemItems+brand;
    return {qty,rate,direct,overhead:base.overhead,individual:base.otherSum,production:base.total,
      items:list,perItemItemsUAH:perItemItems,perItemUAH:base.otherSum+perItemItems,brandUAH:brand,extrasUAH:extras,full:base.total+extras,
      percentTotal:list.filter(x=>x.method==='percent').reduce((a,x)=>a+x.pct,0),
      needsPrice:list.some(x=>x.method==='percent')&&!num(o.priceUAH),
      warnings:warnings(base,list)};
  }

  /* double-counting hints: packaging both in the BOM and as an expense item; a batch item without planned qty */
  function warnings(base,list){
    const w=[];
    const packInBom=base.rows.some(r=>{const m=C().matById(r.mid);return m&&m.cat==='Упаковка'});
    const packItem=list.find(x=>/упаков|короб|бирк/i.test(x.name));
    if(packInBom&&packItem)w.push(`Упаковка есть и в составе изделия, и в статье «${packItem.name}» — проверьте, не учтена ли она дважды.`);
    list.filter(x=>x.method==='batch'&&!(x.batchQty>0)).forEach(x=>w.push(`У статьи «${x.name}» не задано плановое количество — она не учитывается.`));
    return w;
  }

  /* product at its catalog price (or a given unit price) */
  function forProduct(p,o){
    o=o||{};const qty=o.qty||1,rate=num(S().settings.rate);
    const base=C().prodCost(p,qty,o.subs);
    const priceUAH=o.priceUAH!=null?o.priceUAH:num(p.priceUSD)*rate;
    return full(base,{pid:p.id,off:p.costItemsOff,priceUAH,rate});
  }

  /* price for a target margin when some items are % of the price:  price = fixed part / (1 − margin − Σ%) */
  function recommended(fc,marginPct,rate){
    const m=num(marginPct)/100,p=fc.percentTotal/100,qty=fc.qty||1;
    const fixed=(fc.production+fc.items.filter(x=>x.method!=='percent').reduce((a,x)=>a+x.sumUAH,0))/qty;
    const k=1-m-p;rate=num(rate);
    if(!(k>0)||!rate||!fixed)return {exactUAH:0,exactUSD:0,round5:0,invalid:!(k>0)};
    const exactUAH=fixed/k,exactUSD=exactUAH/rate;
    return {exactUAH,exactUSD,round5:Math.ceil(exactUSD/5)*5,invalid:false};
  }

  /* ---------- orders ---------- */
  function lineLive(o,l){
    const p=C().prodById(l.pid),rate=C().orderRate(o),qty=num(l.qty)||1;
    const base=C().orderLineCost(l);
    return full(base,{pid:l.pid,off:p?p.costItemsOff:[],priceUAH:num(l.priceUSD)*rate,rate});   // % of the agreed line price
  }
  /* snapshot part written at material write-off (added to order.plan; old plans simply lack it) */
  function planExtras(o){
    const lines=o.lines.map(l=>{const f=lineLive(o,l);return {lineId:l.id,pid:l.pid,qty:num(l.qty)||1,items:f.items,perItemItemsUAH:f.perItemItemsUAH,brandUAH:f.brandUAH,extrasUAH:f.extrasUAH}});
    const agg=new Map();
    lines.forEach(L=>L.items.forEach(x=>{const a=agg.get(x.id)||Object.assign({},x,{unitUAH:null,sumUAH:0});a.sumUAH+=x.sumUAH;agg.set(x.id,a)}));
    const s=k=>lines.reduce((a,L)=>a+L[k],0);
    return {lines,items:[...agg.values()],perItemItemsUAH:s('perItemItemsUAH'),brandUAH:s('brandUAH'),extrasUAH:s('extrasUAH')};
  }
  /* expense items of an order: fixed snapshot › not recorded (snapshot made before this feature) › live estimate */
  function orderExtras(o){
    if(o.plan&&o.plan.extras)return Object.assign({source:'snapshot'},o.plan.extras);
    if(o.plan)return {source:'not-recorded',items:[],perItemItemsUAH:0,brandUAH:0,extrasUAH:0};
    return Object.assign({source:'estimate'},planExtras(o));
  }
  /* full cost = production cost as today (fact › plan › live) + expense items */
  const orderFull=o=>{const e=orderExtras(o);return {production:C().orderCost(o),extras:e,full:C().orderCost(o)+e.extrasUAH}};

  /* ---------- expense item list ---------- */
  const usedInSnapshots=id=>S().orders.filter(o=>o.plan&&o.plan.extras&&(o.plan.extras.items||[]).some(x=>x.id===id));
  /* validate + store a draft; returns error text or null */
  function saveItem(d){
    const name=String(d.name||'').trim();if(!name)return 'Укажите название';
    const method=['fixed','batch','percent'].includes(d.method)?d.method:'fixed';
    const amount=num(d.amount);if(!(amount>0))return method==='percent'?'Укажите процент больше нуля':'Укажите сумму больше нуля';
    if(method==='percent'&&amount>=100)return 'Процент должен быть меньше 100';
    if(method==='batch'&&!(num(d.batchQty)>0))return 'Укажите плановое количество изделий в партии';
    const scope=d.scopeAll!==false?'all':(d.scopePids||[]);
    if(scope!=='all'&&!scope.length)return 'Выберите хотя бы одно изделие или «Все изделия»';
    let it=items().find(x=>x.id===d.id);
    if(!it){it={id:'ci-'+SK.util.uid(),archived:false};(S().costItems=S().costItems||[]).push(it)}
    Object.assign(it,{name,group:d.group==='brand'?'brand':'per-item',method,amount,cur:method==='percent'?'UAH':(d.cur==='USD'?'USD':'UAH'),
      batchQty:method==='batch'?num(d.batchQty):null,scope});
    return null;
  }
  function removeItem(id){
    if(usedInSnapshots(id).length)throw new Error('Статья зафиксирована в заказах — удалить нельзя, только архив');
    S().costItems=items().filter(x=>x.id!==id);
    S().products.forEach(p=>{if(p.costItemsOff)p.costItemsOff=p.costItemsOff.filter(x=>x!==id)});
  }

  return {items,usedInSnapshots,saveItem,removeItem,applicable,unitUAH,full,forProduct,recommended,lineLive,planExtras,orderExtras,orderFull};
})();
</script>
<script>
/* ======== js/domain/inventory.js ======== */
/* Skripo Studio · domain/inventory.js — stock ledger, valuation, usage checks, archive rules.
 * Ledger invariant (from migration on): Σ stockMoves.qty for a material == material.stock.
 * Moves are history: they are appended, never edited or deleted.
 * Valuation — weighted moving average in UAH (material.avgCostUAH, replayed from the ledger):
 *   incoming with cost (opening, purchase, return): avg = (q₀·avg + q·unit) / (q₀ + q); if q₀ ≤ 0 → avg = unit
 *   outgoing (issue, adjust −): avg unchanged, the move stores the avg it left at (snapshot)
 *   adjust +: avg unchanged (if stock was ≤ 0, it takes the move's unit cost)
 * A return comes back at the unit cost of the issue it reverses. USD purchases are valued at their own rate.
 */
'use strict';
var SK = window.SK = window.SK || {};

SK.inventory = (function(){
  const {uid,num,r3,today,nowISO}=SK.util;
  const S=()=>SK.S;
  const C=()=>SK.costing;

  function record(mv){
    const m={id:uid(),at:nowISO(),date:mv.date||today(),mid:mv.mid,type:mv.type,qty:r3(num(mv.qty)),
             unitCostUAH:mv.unitCostUAH==null?null:Math.round(num(mv.unitCostUAH)*10000)/10000,ref:mv.ref||null,note:mv.note||''};
    if(!m.qty)return null;
    S().stockMoves.push(m);revalue(m.mid);return m;
  }

  /* pure replay of one material's moves (array order = chronological) → {qty, avg, value} */
  function valuateMoves(moves){
    let q=0,avg=null;
    (moves||[]).forEach(x=>{
      const d=num(x.qty),u=x.unitCostUAH==null?null:num(x.unitCostUAH);
      const costed=d>0&&u!=null&&(x.type==='opening'||x.type==='purchase'||x.type==='ret');
      if(costed)avg=(q<=0||avg==null)?u:(q*avg+d*u)/(q+d);
      else if(d>0&&x.type==='adjust'&&(q<=0||avg==null)&&u!=null)avg=u;
      q=r3(q+d);
    });
    return {qty:q,avg:avg==null?null:Math.round(avg*10000)/10000,value:avg==null?0:Math.max(q,0)*avg};
  }
  const valuate=mid=>valuateMoves(S().stockMoves.filter(x=>x.mid===mid));
  /* refresh the cached average on the material */
  function revalue(mid){const m=S().materials.find(x=>x.id===mid);if(!m)return null;const v=valuate(mid);m.avgCostUAH=v.avg;return v}
  /* unit cost of the latest issue of this material into this order (for returns) */
  function issueUnitCost(orderId,mid){
    const mv=S().stockMoves.filter(x=>x.mid===mid&&x.type==='issue'&&x.ref&&x.ref.orderId===orderId).pop();
    return mv?mv.unitCostUAH:null;
  }
  /* total stock value at average cost (positive stock only) */
  const stockValue=()=>S().materials.reduce((a,m)=>a+(m.avgCostUAH==null?0:Math.max(num(m.stock),0)*num(m.avgCostUAH)),0);
  /* materials whose ledger balance drifted from the stock field (should never happen) */
  const ledgerMismatches=()=>S().materials.filter(m=>Math.abs(balance(m.id)-r3(num(m.stock)))>1e-6);
  const balance=mid=>r3(S().stockMoves.filter(x=>x.mid===mid).reduce((a,x)=>a+num(x.qty),0));
  const movesOf=mid=>S().stockMoves.filter(x=>x.mid===mid);

  /* unit cost in UAH of a purchase, at the rate stored with it (or current) */
  const purchaseUnitUAH=p=>{const q=num(p.qty);if(!q)return 0;const u=num(p.total)/q;return p.cur==='USD'?u*num(p.rate||S().settings.rate):u};

  /* Called after a material form is saved. prev = stored version (null if new). Writes ledger moves so that
     Σ moves keeps matching material.stock: applied purchases → 'purchase', the rest of the change → 'adjust'/'opening'. */
  function afterMaterialSave(prev,next){
    const prevIds=new Set((prev&&prev.purchases||[]).map(p=>p.id));
    const fresh=(next.purchases||[]).filter(p=>!prevIds.has(p.id)&&p.applied);
    let purch=0;
    fresh.forEach(p=>{purch+=num(p.qty);record({mid:next.id,type:'purchase',qty:p.qty,unitCostUAH:purchaseUnitUAH(p),date:p.date,ref:{purchaseId:p.id}})});
    const delta=r3(num(next.stock)-(prev?num(prev.stock):0));
    const rest=r3(delta-purch);
    if(rest)record({mid:next.id,type:prev?'adjust':'opening',qty:rest,unitCostUAH:C().matUAH(next),note:prev?'изменение остатка вручную':''});
  }

  /* ---- usage: who references a record (archived ones included — history counts) ---- */
  function materialUsage(mid){
    const st=S();
    const products=st.products.filter(p=>(p.bom||[]).some(c=>c.mid===mid));
    const orders=st.orders.filter(o=>o.lines.some(l=>Object.values(l.subs||{}).includes(mid))||(o.written&&o.written[mid]!=null));
    const moves=st.stockMoves.filter(x=>x.mid===mid&&x.type!=='opening');
    return {products,orders,moves,used:products.length+orders.length+moves.length>0};
  }
  function productUsage(pid){
    const orders=S().orders.filter(o=>o.lines.some(l=>l.pid===pid));
    return {orders,used:orders.length>0};
  }
  function operationUsage(opId){
    const products=S().products.filter(p=>(p.route||[]).some(s=>s.opId===opId));
    return {products,used:products.length>0};
  }
  /* an order is historical once it left "Новый", wrote off stock or got a cost snapshot */
  const orderIsHistorical=o=>o.status!=='Новый'||!!o.written||!!o.plan||!!o.fact||(S().jobs||[]).some(j=>j.orderId===o.id);

  function canDelete(kind,id){
    if(kind==='material'){const u=materialUsage(id);return {ok:!u.used,usage:u}}
    if(kind==='product'){const u=productUsage(id);return {ok:!u.used,usage:u}}
    if(kind==='operation'){const u=operationUsage(id);return {ok:!u.used,usage:u}}
    if(kind==='order'){const o=S().orders.find(x=>x.id===id);return {ok:!!o&&!orderIsHistorical(o)}}
    return {ok:false};
  }
  const listOf=kind=>({material:S().materials,product:S().products,operation:S().operations})[kind];
  function setArchived(kind,id,flag){
    const r=listOf(kind).find(x=>x.id===id);if(!r)return false;
    r.archived=!!flag;r.archivedAt=flag?nowISO():null;return true;
  }
  /* physical delete only when nothing references the record */
  function remove(kind,id){
    if(!canDelete(kind,id).ok)throw new Error('Запись используется в истории: удаление запрещено, только архив');
    if(kind==='material'){S().materials=S().materials.filter(m=>m.id!==id);S().stockMoves=S().stockMoves.filter(x=>x.mid!==id)}
    else if(kind==='product')S().products=S().products.filter(p=>p.id!==id);
    else if(kind==='operation')S().operations=S().operations.filter(o=>o.id!==id);
    else if(kind==='order')S().orders=S().orders.filter(o=>o.id!==id);
    return true;
  }
  /* records offered for NEW selections: not archived (the currently selected one is kept by the caller) */
  const active=list=>list.filter(x=>!x.archived);

  return {record,valuateMoves,valuate,revalue,issueUnitCost,stockValue,ledgerMismatches,balance,movesOf,purchaseUnitUAH,afterMaterialSave,materialUsage,productUsage,operationUsage,
          orderIsHistorical,canDelete,setArchived,remove,active};
})();
</script>
<script>
/* ======== js/domain/orders.js ======== */
/* Skripo Studio · domain/orders.js — order lifecycle rules and financial snapshots.
 * Exchange rate: while an order is "Новый" and nothing is written off, its rate follows settings.rate
 * (price still being agreed). The moment it moves on (or materials are written off) the rate is frozen
 * for good: revenue and profit of that order are always computed at rateSnap.rate.
 * Plan cost: snapshot taken at material write-off (norm cost at that moment, with breakdown).
 * Fact cost: reserved (null) — filled by production jobs in stage 3.
 */
'use strict';
var SK = window.SK = window.SK || {};

SK.orders = (function(){
  const {num,nowISO}=SK.util;
  const S=()=>SK.S;
  const C=()=>SK.costing, I=()=>SK.inventory;

  function freezeRate(o){
    const cur=num(S().settings.rate);
    if(!o.rateSnap)o.rateSnap={rate:cur,at:nowISO(),frozen:false,restored:false};
    if(o.rateSnap.frozen)return o.rateSnap;
    if(o.status==='Новый'&&!o.written){o.rateSnap.rate=cur;o.rateSnap.at=nowISO()}
    else o.rateSnap.frozen=true;
    return o.rateSnap;
  }

  /* ---- change history (notebook stage): only real changes of significant fields; no effect on money logic ---- */
  const HIST_FIELDS=[['client','Клиент'],['phone','Телефон'],['channel','Мессенджер'],['contact','Ник / ссылка'],['contactOther','Другие контакты'],
    ['status','Статус'],['date','Дата заказа'],['deadline','Срок готовности'],['doneDate','Факт. готовность'],['paidUSD','Предоплата, $']];
  const linesText=o=>(o.lines||[]).filter(l=>l.pid).map(l=>{const p=C().prodById(l.pid);
    return `${p?p.name:'?'} ×${num(l.qty)||1} $${num(l.priceUSD)}${[l.color,l.material,l.params].filter(Boolean).length?' ('+[l.color,l.material,l.params].filter(Boolean).join(', ')+')':''}`}).join('; ');
  const norm=v=>v==null?'':String(v).trim();
  function diff(prev,next){
    const ch=[];
    HIST_FIELDS.forEach(([k,label])=>{const a=norm(prev[k]),b=norm(next[k]);if(a!==b&&!(k==='paidUSD'&&num(a)===num(b)))ch.push({field:k,label,from:a,to:b})});
    const la=linesText(prev),lb=linesText(next);if(la!==lb)ch.push({field:'lines',label:'Изделия',from:la,to:lb});
    return ch;
  }
  function logHistory(o,entry){o.history=(o.history||[]).concat([Object.assign({at:nowISO()},entry)])}

  /* number, rate, clean empty lines — called on every save of an order */
  function commit(o){
    const i0=S().orders.findIndex(x=>x.id===o.id),prev=i0>=0?S().orders[i0]:null;
    if(!o.no){S().settings.orderSeq++;o.no='SS-'+String(S().settings.orderSeq).padStart(3,'0')}
    o.lines=o.lines.filter(l=>l.pid);
    if(o.status==='Готов'&&!o.doneDate)o.doneDate=SK.util.today();   // actual completion date, editable afterwards
    freezeRate(o);
    if(!prev)logHistory(o,{event:'Заказ создан'});
    else if(prev!==o){const ch=diff(prev,o);if(ch.length)logHistory(o,{changes:ch})}
    const i=S().orders.findIndex(x=>x.id===o.id);if(i>=0)S().orders[i]=o;else S().orders.push(o);
    return o;
  }
  /* status change on the stored order itself (e.g. from a production job): logged explicitly */
  function setStatus(o,status){
    if(o.status===status)return commit(o);
    const from=o.status;o.status=status;
    const hadDone=o.doneDate;commit(o);
    const changes=[{field:'status',label:'Статус',from,to:status}];
    if(!hadDone&&o.doneDate)changes.push({field:'doneDate',label:'Факт. готовность',from:'',to:o.doneDate});
    logHistory(o,{changes});return o;
  }

  function planSnapshot(o){
    const st=S().settings;let mat=0,labor=0,other=0,over=0;
    const lines=o.lines.map(l=>{const c=C().orderLineCost(l);mat+=c.mat;labor+=c.labor;other+=c.otherSum;over+=c.overhead;
      /* route as it was at write-off: later edits of the product do not rewrite history */
      const cons={};c.rows.forEach(r=>{if(!r.missing)cons[r.mid]=(cons[r.mid]||0)+r.qty});   // per-material norm use (stage 3 allocation)
      const p=C().prodById(l.pid),route=(p&&p.route||[]).map(s=>{const op=C().opById(s.opId);return {opId:s.opId,name:op?op.name:'',min:num(s.min)}});
      return {lineId:l.id,pid:l.pid,name:p?p.name:'',qty:num(l.qty)||1,priceUSD:num(l.priceUSD),matUAH:c.mat,laborUAH:c.labor,otherUAH:c.otherSum,overheadUAH:c.overhead,totalUAH:c.total,hours:c.hours,route,cons}});
    return {at:nowISO(),rate:C().orderRate(o),hourRate:num(st.hourRate),overheadPct:num(st.overhead),
            matUAH:mat,laborUAH:labor,otherUAH:other,overheadUAH:over,totalUAH:mat+labor+other+over,lines,restored:false,
            /* optional expense items fixed at the same moment (2026-11-12): amounts, batch qty, % of the agreed price */
            extras:SK.fullcost?SK.fullcost.planExtras(o):null};
  }

  /* materials leave the stock → ledger 'issue' moves + plan cost snapshot; rate gets frozen */
  function writeOff(o){
    const cons=C().consumption(o);o.written={};
    cons.forEach((q,mid)=>{const m=C().matById(mid);if(!m)return;
      m.stock=SK.util.r3(num(m.stock)-q);if(m.stock<=0)m.inStock=false;o.written[mid]=q;
      I().record({mid,type:'issue',qty:-q,unitCostUAH:C().matUAH(m),ref:{orderId:o.id,no:o.no}});
    });
    o.plan=planSnapshot(o);
    logHistory(o,{event:'Материалы списаны со склада, плановая себестоимость зафиксирована'});
    o.rateSnap=o.rateSnap||{rate:num(S().settings.rate),at:nowISO(),frozen:false,restored:false};
    o.rateSnap.frozen=true;
  }
  /* materials come back → ledger 'ret' moves; the voided plan is kept in planHistory */
  function unWriteOff(o){
    if(SK.production&&SK.production.hasFixedActual(o))throw new Error('По заказу зафиксирована фактическая себестоимость: вернуть материалы нельзя (только через корректировку задания)');
    Object.entries(o.written||{}).forEach(([mid,q])=>{const m=C().matById(mid);if(!m)return;
      m.stock=SK.util.r3(num(m.stock)+q);if(m.stock>0)m.inStock=true;
      const u=I().issueUnitCost(o.id,mid);   // comes back at the cost it left with
      I().record({mid,type:'ret',qty:q,unitCostUAH:u!=null?u:C().matUAH(m),ref:{orderId:o.id,no:o.no}});
    });
    if(o.plan)o.planHistory=(o.planHistory||[]).concat([Object.assign({},o.plan,{voidedAt:nowISO()})]);
    o.written=null;o.plan=null;
    logHistory(o,{event:'Материалы возвращены на склад'});
  }

  return {freezeRate,commit,setStatus,diff,logHistory,planSnapshot,writeOff,unWriteOff};
})();
</script>
<script>
/* ======== js/domain/technology.js ======== */
/* Skripo Studio · domain/technology.js — operation dictionary and product routes. Pure: reads/writes SK.S only.
 * Dictionary norm (op.normMin = [min,max], minutes) is a reference range, not a standard.
 * The working norm lives in each product: product.route = [{opId, min}] (order of steps = array order).
 * Labor cost of a step = min / 60 × settings.hourRate (one base rate, owner decision 2026-11-11).
 */
'use strict';
var SK = window.SK = window.SK || {};

SK.technology = (function(){
  const {uid,num,r3,nowISO}=SK.util;
  const S=()=>SK.S;

  const ordered=list=>(list||S().operations).slice().sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name,'ru'));
  /* offered for new route steps: active, not the migration-only legacy op; the current one stays visible */
  const selectable=selId=>ordered().filter(o=>(!o.archived&&!o.legacy)||o.id===selId);
  const usage=id=>S().products.filter(p=>(p.route||[]).some(s=>s.opId===id));

  /* default working norm when an operation is added to a route: middle of the range, rounded to 5 min */
  function defaultMin(op){
    if(!op||!op.normMin)return '';
    const [a,b]=op.normMin.map(num);return String(Math.max(5,Math.round((a+b)/2/5)*5));
  }
  const outOfRange=(op,min)=>!!(op&&op.normMin&&String(min).trim()!==''&&(num(min)<num(op.normMin[0])||num(min)>num(op.normMin[1])));

  /* validate + store an operation draft; returns error text or null */
  function save(d){
    const name=String(d.name||'').trim();if(!name)return 'Укажите название';
    const a=String(d.minA==null?'':d.minA).trim(),b=String(d.minB==null?'':d.minB).trim();
    let normMin=null;
    if(a!==''||b!==''){
      if(a===''||b==='')return 'Укажите норматив полностью: от и до, или оставьте оба поля пустыми';
      const x=num(a),y=num(b);
      if(x<0||y<0)return 'Норматив не может быть отрицательным';
      if(x>y)return 'Минимум норматива больше максимума';
      normMin=[r3(x),r3(y)];
    }
    if(S().operations.some(o=>o.id!==d.id&&o.name.trim().toLowerCase()===name.toLowerCase()))return 'Операция с таким названием уже есть';
    let op=S().operations.find(o=>o.id===d.id);
    if(!op){
      const maxOrder=S().operations.filter(o=>!o.legacy).reduce((m,o)=>Math.max(m,o.order||0),0);
      op={id:d.id||'op-'+uid(),code:'custom',legacy:false,archived:false,order:maxOrder+1,createdAt:nowISO()};
      S().operations.push(op);
    }
    op.name=name;op.normMin=normMin;op.preliminary=!!d.preliminary;op.updatedAt=nowISO();
    return null;
  }

  /* swap with the neighbour among regular (non-legacy) operations */
  function move(id,dir){
    const list=ordered().filter(o=>!o.legacy);
    list.forEach((o,i)=>{o.order=i+1});
    const i=list.findIndex(o=>o.id===id),j=i+(dir<0?-1:1);
    if(i<0||j<0||j>=list.length)return false;
    const t=list[i].order;list[i].order=list[j].order;list[j].order=t;return true;
  }

  /* route editing helpers (operate on a route array, e.g. a product draft) */
  function addStep(route,opId){const op=S().operations.find(o=>o.id===opId);route.push({opId:opId||'',min:op?defaultMin(op):''});return route}
  function moveStep(route,i,dir){const j=i+(dir<0?-1:1);if(j<0||j>=route.length)return false;[route[i],route[j]]=[route[j],route[i]];return true}
  /* clean before saving: drop empty steps, numeric minutes */
  const cleanRoute=route=>(route||[]).filter(s=>s.opId).map(s=>({opId:s.opId,min:r3(num(s.min))}));

  function routeSummary(route){
    const rate=num(S().settings.hourRate);
    const steps=(route||[]).filter(s=>s.opId).map(s=>{const op=S().operations.find(o=>o.id===s.opId);const m=num(s.min);
      return {opId:s.opId,name:op?op.name:'(операция удалена)',min:m,sum:m/60*rate,out:outOfRange(op,s.min),archived:!!(op&&op.archived),legacy:!!(op&&op.legacy)}});
    const min=steps.reduce((a,s)=>a+s.min,0);
    return {steps,min,hours:min/60,labor:min/60*rate,rate};
  }

  return {ordered,selectable,usage,defaultMin,outOfRange,save,move,addStep,moveStep,cleanRoute,routeSummary};
})();
</script>
<script>
/* ======== js/domain/production.js ======== */
/* Skripo Studio · domain/production.js — production jobs and actual cost (stage 3). Pure: reads/writes SK.S only.
 *
 * job {id,no,orderId,lineId,pid,name,qty,primary,status:'queued'|'in_work'|'done'|'cancelled',
 *      createdAt,startedAt,doneAt,cancelledAt,cancelReason,deadline,
 *      steps:[{opId,name,planMinUnit,planMin,factMin,done,doneAt}],   ← route copied at creation
 *      plan:{matUAH,laborUAH,otherUAH,overheadUAH,totalUAH,minutes,hourRate,overheadPct,at},  ← norm at creation
 *      actual:null|snapshot, actualHistory:[{…snapshot, supersededAt, reason}]}
 *
 * Materials (owner decision 2026-11-11):
 *   - the order-level write-off is allocated to jobs PER MATERIAL, proportional to each line's norm consumption × qty
 *     (consumption from order.plan.lines[].cons, i.e. as of write-off). Only the line's primary job takes the share,
 *     so a replacement job after a cancellation does not double-count it;
 *   - extra consumption, scrap and returns are ledger moves with ref.jobId → they belong to that job only;
 *     a return reduces that job's qty and cost (it comes back at the job's own unit cost).
 * Labor = Σ fact minutes / 60 × base hourly rate at fixation. Other = product norm (done jobs only). Overhead % at fixation.
 * job.actual and order.fact are immutable once fixed; only correct() changes them, keeping the previous version + reason.
 */
'use strict';
var SK = window.SK = window.SK || {};

SK.production = (function(){
  const {uid,num,r3,nowISO,today}=SK.util;
  const S=()=>SK.S;
  const C=()=>SK.costing, I=()=>SK.inventory;
  const STATUS={queued:'В очереди',in_work:'В работе',done:'Готово',cancelled:'Отменено'};
  const OVER=1.2;   // fact ≥ plan × 1.2 → highlighted

  const jobs=()=>S().jobs||(S().jobs=[]);
  const jobById=id=>jobs().find(j=>j.id===id);
  const jobsOf=orderId=>jobs().filter(j=>j.orderId===orderId);
  const orderOf=j=>S().orders.find(o=>o.id===j.orderId);
  const jobMoves=j=>S().stockMoves.filter(x=>x.ref&&x.ref.jobId===j.id);
  const hasFacts=j=>j.steps.some(s=>num(s.factMin)>0)||jobMoves(j).length>0;
  const isUntouched=j=>j.status==='queued'&&!hasFacts(j);

  /* ---------- creation ---------- */
  function createJobs(o){
    const made=[];
    o.lines.filter(l=>l.pid).forEach(l=>{
      const forLine=jobs().filter(j=>j.orderId===o.id&&j.lineId===l.id);
      if(forLine.some(j=>j.status!=='cancelled'))return;            // an active job already exists
      const p=C().prodById(l.pid),qty=num(l.qty)||1,c=C().orderLineCost(l),st=S().settings;
      S().settings.jobSeq=(num(S().settings.jobSeq)||0)+1;
      const steps=(p&&p.route||[]).map(s=>{const op=C().opById(s.opId);const u=num(s.min);
        return {opId:s.opId,name:op?op.name:'(операция)',planMinUnit:u,planMin:r3(u*qty),factMin:'',done:false,doneAt:null}});
      const j={id:uid(),no:'PZ-'+String(S().settings.jobSeq).padStart(3,'0'),orderId:o.id,lineId:l.id,pid:l.pid,name:p?p.name:'(изделие)',qty,
        primary:forLine.length===0,status:'queued',createdAt:nowISO(),startedAt:null,doneAt:null,cancelledAt:null,cancelReason:'',deadline:o.deadline||'',
        steps,plan:{at:nowISO(),matUAH:c.mat,laborUAH:c.labor,otherUAH:c.otherSum,overheadUAH:c.overhead,totalUAH:c.total,minutes:r3(c.hours*60),hourRate:num(st.hourRate),overheadPct:num(st.overhead)},
        actual:null,actualHistory:[]};
      jobs().push(j);made.push(j);
    });
    return made;
  }
  const linesWithoutJob=o=>o.lines.filter(l=>l.pid&&!jobs().some(j=>j.orderId===o.id&&j.lineId===l.id&&j.status!=='cancelled'));

  /* ---------- lifecycle ---------- */
  function start(j){if(j.status!=='queued')throw new Error('Задание уже не в очереди');j.status='in_work';j.startedAt=nowISO()}
  /* edit fact minutes / done flags while in work */
  function saveSteps(j,steps){
    if(j.status!=='in_work')throw new Error('Факт вносится только по заданию в работе');
    applySteps(j,steps);
  }
  function applySteps(j,steps){
    (steps||[]).forEach((s,i)=>{const t=j.steps[i];if(!t)return;
      const v=String(s.factMin==null?'':s.factMin).trim();
      if(v!==''&&num(v)<0)throw new Error('Время не может быть отрицательным');
      t.factMin=v===''?'':r3(num(v));
      if(!!s.done!==!!t.done){t.done=!!s.done;t.doneAt=t.done?nowISO():null}
    });
  }
  const overPlan=s=>String(s.factMin)!==''&&num(s.planMin)>0&&num(s.factMin)>=num(s.planMin)*OVER;

  /* ---------- materials ---------- */
  /* norm consumption per line at write-off (plan snapshot), fallback: live */
  function lineCons(o){
    const out={};
    o.lines.forEach(l=>{
      const pl=o.plan&&o.plan.lines&&o.plan.lines.find(x=>x.lineId===l.id);
      if(pl&&pl.cons)out[l.id]=Object.assign({},pl.cons);
      else{const m={};C().orderLineCost(l).rows.forEach(r=>{if(!r.missing)m[r.mid]=(m[r.mid]||0)+r.qty});out[l.id]=m}
    });
    return out;
  }
  function materialsOf(j){
    const o=orderOf(j),rows=new Map();
    const row=mid=>{if(!rows.has(mid)){const m=C().matById(mid);rows.set(mid,{mid,name:m?m.name:'(материал удалён)',unit:m?m.unit:'',allocQty:0,allocCost:0,extraQty:0,extraCost:0,retQty:0,retCost:0})}return rows.get(mid)};
    if(o&&j.primary){
      const cons=lineCons(o),mine=cons[j.lineId]||{};
      Object.keys(mine).forEach(mid=>{
        const total=Object.values(cons).reduce((a,c)=>a+num(c[mid]),0);if(!total)return;
        const share=num(mine[mid])/total;
        const mv=S().stockMoves.filter(x=>x.mid===mid&&x.ref&&x.ref.orderId===o.id&&!x.ref.jobId);
        const q=-mv.reduce((a,x)=>a+num(x.qty),0),c=-mv.reduce((a,x)=>a+num(x.qty)*num(x.unitCostUAH),0);
        if(!q&&!c)return;
        const r=row(mid);r.allocQty+=q*share;r.allocCost+=c*share;
      });
    }
    jobMoves(j).forEach(x=>{const r=row(x.mid),q=num(x.qty),c=q*num(x.unitCostUAH);
      if(q<0){r.extraQty+=-q;r.extraCost+=-c}else{r.retQty+=q;r.retCost+=c}});
    return [...rows.values()].map(r=>Object.assign(r,{qty:r3(r.allocQty+r.extraQty-r.retQty),cost:r.allocCost+r.extraCost-r.retCost}));
  }
  /* average unit cost of what this job consumed (returns come back at it) */
  function jobUnitCost(j,mid){const r=materialsOf(j).find(x=>x.mid===mid);const q=r?r.allocQty+r.extraQty:0;return q>0?(r.allocCost+r.extraCost)/q:null}

  /* extra consumption ('over' перерасход | 'scrap' брак) or return ('ret') → ledger move with ref.jobId */
  function materialMove(j,{mid,qty,kind,note},opts){
    opts=opts||{};
    if(j.status!=='in_work'&&!opts.correction)throw new Error('Материалы по заданию — только когда оно в работе (или через корректировку)');
    const m=C().matById(mid);if(!m)throw new Error('Выберите материал');
    const q=num(qty);if(!(q>0))throw new Error('Укажите количество больше нуля');
    const ref={orderId:j.orderId,jobId:j.id,no:j.no,kind};
    const reason={over:'перерасход',scrap:'брак',ret:'возврат'}[kind]||kind;
    if(kind==='ret'){
      const r=materialsOf(j).find(x=>x.mid===mid);
      if(!r||q>r.qty+1e-9)throw new Error(`Вернуть можно не больше израсходованного заданием: ${r?SK.util.qf(r.qty):0} ${m.unit}`);
      const u=jobUnitCost(j,mid);
      m.stock=r3(num(m.stock)+q);if(m.stock>0)m.inStock=true;
      return I().record({mid,type:'ret',qty:q,unitCostUAH:u!=null?u:C().matUAH(m),ref,note:[reason,j.no,note].filter(Boolean).join(' · ')});
    }
    const u=C().matUAH(m);
    m.stock=r3(num(m.stock)-q);if(m.stock<=0)m.inStock=false;
    return I().record({mid,type:'issue',qty:-q,unitCostUAH:u,ref,note:[reason,j.no,note].filter(Boolean).join(' · ')});
  }

  /* ---------- actual cost ---------- */
  function computeActual(j,status){
    const st=S().settings,hourRate=num(st.hourRate),pct=num(st.overhead);
    const materials=materialsOf(j).map(r=>({mid:r.mid,name:r.name,unit:r.unit,qty:r.qty,costUAH:r.cost,allocQty:r3(r.allocQty),extraQty:r3(r.extraQty),retQty:r3(r.retQty)}));
    const mat=materials.reduce((a,r)=>a+r.costUAH,0);
    const steps=j.steps.map(s=>({opId:s.opId,name:s.name,planMin:num(s.planMin),factMin:num(s.factMin)}));
    const minutes=steps.reduce((a,s)=>a+s.factMin,0),labor=minutes/60*hourRate;
    const other=status==='done'?num(j.plan&&j.plan.otherUAH):0;
    const overhead=(mat+labor)*pct/100;
    return {at:nowISO(),status,hourRate,overheadPct:pct,minutes:r3(minutes),matUAH:mat,laborUAH:labor,otherUAH:other,overheadUAH:overhead,
            totalUAH:mat+labor+other+overhead,qtyDone:status==='done'?j.qty:0,materials,steps,version:1};
  }
  function canFinish(j){
    if(j.status!=='in_work')return {ok:false,reason:'Завершить можно только задание в работе'};
    const o=orderOf(j);
    if(o&&!o.written&&C().consumption(o).size>0)return {ok:false,reason:'Сначала спишите материалы по заказу: без этого фактический расход задания не посчитать',needWrite:true};
    return {ok:true};
  }
  function finish(j){
    const c=canFinish(j);if(!c.ok)throw new Error(c.reason);
    j.steps.forEach(s=>{if(String(s.factMin)==='')s.factMin=num(s.planMin);if(!s.done){s.done=true;s.doneAt=nowISO()}});
    j.status='done';j.doneAt=nowISO();j.actual=computeActual(j,'done');
    return fixOrder(orderOf(j));
  }
  /* untouched → cancelled with no consequences; with facts → incurred cost is fixed */
  function cancel(j,reason){
    if(j.status==='done'||j.status==='cancelled')throw new Error('Задание уже закрыто');
    if(isUntouched(j)){j.status='cancelled';j.cancelledAt=nowISO();j.cancelReason=reason||'';j.actual=null;return {costly:false}}
    if(!String(reason||'').trim())throw new Error('Укажите причину отмены: по заданию уже есть затраты');
    j.status='cancelled';j.cancelledAt=nowISO();j.cancelReason=reason.trim();j.actual=computeActual(j,'cancelled');
    fixOrder(orderOf(j));
    return {costly:true};
  }
  function remove(j){
    if(!isUntouched(j))throw new Error('Удалить можно только задание в очереди без затрат');
    S().jobs=jobs().filter(x=>x.id!==j.id);
  }

  /* ---------- order fact ---------- */
  function orderComplete(o){
    const js=jobsOf(o.id);if(!js.length)return false;
    if(js.some(j=>j.status==='queued'||j.status==='in_work'))return false;
    return o.lines.filter(l=>l.pid).every(l=>js.some(j=>j.lineId===l.id&&j.status==='done'))&&js.some(j=>j.status==='done');
  }
  function buildFact(o){
    const js=jobsOf(o.id).filter(j=>j.actual);
    const sum=k=>js.reduce((a,j)=>a+num(j.actual[k]),0);
    return {at:nowISO(),rate:C().orderRate(o),matUAH:sum('matUAH'),laborUAH:sum('laborUAH'),otherUAH:sum('otherUAH'),overheadUAH:sum('overheadUAH'),
      totalUAH:sum('totalUAH'),minutes:r3(sum('minutes')),qtyDone:sum('qtyDone'),
      jobs:js.map(j=>({jobId:j.id,no:j.no,status:j.actual.status,totalUAH:j.actual.totalUAH,version:j.actual.version})),version:1};
  }
  function fixOrder(o){
    if(!o||o.fact||!orderComplete(o))return false;
    o.fact=buildFact(o);return true;
  }
  const hasFixedActual=o=>!!o.fact||jobsOf(o.id).some(j=>j.actual);

  /* ---------- correction (the only way to change fixed facts) ---------- */
  function correct(j,{steps,move,reason}){
    if(!j.actual)throw new Error('Корректировать можно только зафиксированную себестоимость');
    const why=String(reason||'').trim();if(!why)throw new Error('Укажите причину корректировки');
    if(steps)applySteps(j,steps);
    if(move&&move.mid&&num(move.qty))materialMove(j,move,{correction:true});
    const prev=j.actual,next=computeActual(j,prev.status);
    next.version=(prev.version||1)+1;next.reason=why;
    j.actualHistory=(j.actualHistory||[]).concat([Object.assign({},prev,{supersededAt:nowISO(),reason:why})]);
    j.actual=next;
    const o=orderOf(j);
    if(o&&o.fact){
      const nf=buildFact(o);nf.version=(o.fact.version||1)+1;nf.reason=`корректировка ${j.no}: ${why}`;
      o.factHistory=(o.factHistory||[]).concat([Object.assign({},o.fact,{supersededAt:nowISO(),reason:nf.reason})]);
      o.fact=nf;
    }else fixOrder(o);
    return next;
  }

  /* ---------- plan vs fact for an order ---------- */
  function compare(o){
    let n={mat:0,labor:0,other:0,overhead:0,total:0,minutes:0};
    o.lines.forEach(l=>{const c=C().orderLineCost(l);n.mat+=c.mat;n.labor+=c.labor;n.other+=c.otherSum;n.overhead+=c.overhead;n.total+=c.total;n.minutes+=c.hours*60});
    const p=o.plan?{mat:o.plan.matUAH,labor:o.plan.laborUAH,other:o.plan.otherUAH,overhead:o.plan.overheadUAH,total:o.plan.totalUAH}:null;
    const f=o.fact?{mat:o.fact.matUAH,labor:o.fact.laborUAH,other:o.fact.otherUAH,overhead:o.fact.overheadUAH,total:o.fact.totalUAH,minutes:o.fact.minutes,qtyDone:o.fact.qtyDone}:null;
    const rev=C().orderRevenueUAH(o);
    const mg=c=>c&&c.total!=null&&rev>0?(rev-c.total)/rev:null;
    return {norm:n,plan:p,fact:f,revenueUAH:rev,margin:{norm:mg(n),plan:mg(p),fact:mg(f)}};
  }
  const progress=j=>({done:j.steps.filter(s=>s.done).length,total:j.steps.length,
    planMin:j.steps.reduce((a,s)=>a+num(s.planMin),0),factMin:j.steps.reduce((a,s)=>a+num(s.factMin),0)});

  return {STATUS,OVER,jobs,jobById,jobsOf,orderOf,jobMoves,hasFacts,isUntouched,createJobs,linesWithoutJob,start,saveSteps,overPlan,
          lineCons,materialsOf,jobUnitCost,materialMove,computeActual,canFinish,finish,cancel,remove,orderComplete,fixOrder,hasFixedActual,
          correct,compare,progress};
})();
</script>
<script>
/* ======== js/domain/analytics.js ======== */
/* Skripo Studio · domain/analytics.js — reports as computed views (stage 4). READ-ONLY: never writes SK.S.
 *
 * Sources: revenue = order lines × frozen order rate; cost layers kept apart: fact (job.actual / order.fact) ·
 * plan (order.plan, job.plan) · norm (live costing). Materials from the stock ledger and purchase history.
 * Period attribution: orders → order date; economics → order.fact.at; production → job doneAt / cancelledAt;
 * materials → move / purchase date.
 * Cancellations (owner decision): cancelled orders and cancelled jobs never count in revenue, output or
 * finished-goods profit. Their incurred costs go to «Отмены и потери», each cost counted once:
 *   - cancelled ORDER: all its job actuals (done + cancelled) + order-level written-off materials not allocated to a job;
 *   - cancelled JOB in an order that is not cancelled: its own actual.
 * Finished-goods fact cost of an order = Σ actuals of its DONE jobs (order.fact minus cancelled jobs).
 */
'use strict';
var SK = window.SK = window.SK || {};

SK.analytics = (function(){
  const {num,r3,today}=SK.util;
  const S=()=>SK.S;
  const C=()=>SK.costing, P=()=>SK.production, I=()=>SK.inventory;

  /* ---------- period ---------- */
  const pad=n=>String(n).padStart(2,'0');
  const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  function period(preset,from,to,now){
    const d=now?new Date(now):new Date(),y=d.getFullYear(),m=d.getMonth();
    if(preset==='month')return {from:ymd(new Date(y,m,1)),to:ymd(new Date(y,m+1,0)),label:'Этот месяц'};
    if(preset==='prev')return {from:ymd(new Date(y,m-1,1)),to:ymd(new Date(y,m,0)),label:'Прошлый месяц'};
    if(preset==='quarter'){const q=Math.floor(m/3)*3;return {from:ymd(new Date(y,q,1)),to:ymd(new Date(y,q+3,0)),label:'Этот квартал'}}
    if(preset==='year')return {from:`${y}-01-01`,to:`${y}-12-31`,label:'Этот год'};
    if(preset==='custom')return {from:from||'',to:to||'',label:'Свой период'};
    return {from:'',to:'',label:'Всё время'};
  }
  const inP=(date,p)=>{if(!date)return !p.from&&!p.to;const s=String(date).slice(0,10);return (!p.from||s>=p.from)&&(!p.to||s<=p.to)};

  /* ---------- helpers ---------- */
  const isCancelledOrder=o=>o.status==='Отменён';
  const lineOf=j=>{const o=P().orderOf(j);return o&&o.lines.find(l=>l.id===j.lineId)};
  const jobRevenueUAH=j=>{const o=P().orderOf(j),l=lineOf(j);return o&&l?num(l.priceUSD)*j.qty*C().orderRate(o):0};
  const zero=()=>({mat:0,labor:0,other:0,overhead:0,total:0});
  const addA=(acc,a)=>{acc.mat+=num(a.matUAH);acc.labor+=num(a.laborUAH);acc.other+=num(a.otherUAH);acc.overhead+=num(a.overheadUAH);acc.total+=num(a.totalUAH);return acc};
  const doneJobs=o=>P().jobsOf(o.id).filter(j=>j.status==='done'&&j.actual);
  /* order-level written-off materials (net of returns) not allocated to any job with a fixed actual */
  function unallocatedOrderMat(o){
    const net=-S().stockMoves.filter(x=>x.ref&&x.ref.orderId===o.id&&!x.ref.jobId).reduce((a,x)=>a+num(x.qty)*num(x.unitCostUAH),0);
