      S().orders.filter(o=>!isCancelledOrder(o)&&o.plan&&inP(o.date,p)).forEach(o=>(o.plan.lines||[]).filter(l=>l.pid===pr.id).forEach(l=>{pR+=num(l.priceUSD)*num(l.qty)*num(o.plan.rate);pC+=num(l.totalUAH);pQ+=num(l.qty)}));
      let fR=0,fC=0,fQ=0;
      P().jobs().filter(j=>j.pid===pr.id&&j.status==='done'&&j.actual&&inP(j.doneAt,p)).forEach(j=>{const o=P().orderOf(j);if(o&&isCancelledOrder(o))return;fR+=jobRevenueUAH(j);fC+=num(j.actual.totalUAH);fQ+=j.qty});
      return {pid:pr.id,name:pr.name,
        norm:{unitCost:nc,unitPrice:nr,margin:nr>0&&(pr.bom.length||pr.route.length)?(nr-nc)/nr:null},
        plan:pQ?{qty:pQ,unitCost:pC/pQ,margin:pR>0?(pR-pC)/pR:null}:null,
        fact:fQ?{qty:fQ,unitCost:fC/fQ,margin:fR>0?(fR-fC)/fR:null}:null};
    }).filter(x=>x.norm.margin!=null||x.plan||x.fact);
  }

  /* ---------- production ---------- */
  function production(p){
    const done=P().jobs().filter(j=>j.status==='done'&&j.actual&&inP(j.doneAt,p)&&!isCancelledOrder(P().orderOf(j)||{}));
    const out=new Map();done.forEach(j=>{const r=out.get(j.pid)||{pid:j.pid,name:j.name,qty:0,jobs:0,planUAH:0,factUAH:0};r.qty+=j.qty;r.jobs++;r.planUAH+=num(j.plan&&j.plan.totalUAH);r.factUAH+=num(j.actual.totalUAH);out.set(j.pid,r)});
    const ops=new Map();done.forEach(j=>(j.actual.steps||[]).forEach(s=>{const r=ops.get(s.opId)||{opId:s.opId,name:s.name,planMin:0,factMin:0,n:0};r.planMin+=num(s.planMin);r.factMin+=num(s.factMin);r.n++;ops.set(s.opId,r)}));
    const mv=new Map();
    S().stockMoves.filter(x=>x.ref&&x.ref.jobId&&inP(x.date,p)).forEach(x=>{
      const kind=x.ref.kind||(num(x.qty)<0?'over':'ret');const m=C().matById(x.mid);
      const r=mv.get(x.mid)||{mid:x.mid,name:m?m.name:'(удалён)',unit:m?m.unit:'',over:{q:0,c:0},scrap:{q:0,c:0},ret:{q:0,c:0}};
      const k=r[kind]||(r[kind]={q:0,c:0});k.q+=Math.abs(num(x.qty));k.c+=Math.abs(num(x.qty))*num(x.unitCostUAH);mv.set(x.mid,r);
    });
    const cancelled=P().jobs().filter(j=>j.status==='cancelled'&&inP(j.cancelledAt,p));
    const planMin=[...ops.values()].reduce((a,r)=>a+r.planMin,0),factMin=[...ops.values()].reduce((a,r)=>a+r.factMin,0);
    return {output:[...out.values()].sort((a,b)=>b.qty-a.qty),qty:done.reduce((a,j)=>a+j.qty,0),jobsDone:done.length,
      ops:[...ops.values()],planMin,factMin,materials:[...mv.values()],
      cancelled:{count:cancelled.length,withCost:cancelled.filter(j=>j.actual&&num(j.actual.totalUAH)>0).length,costUAH:cancelled.reduce((a,j)=>a+(j.actual?num(j.actual.totalUAH):0),0)},
      active:{queued:P().jobs().filter(j=>j.status==='queued').length,inWork:P().jobs().filter(j=>j.status==='in_work').length,
        overdue:P().jobs().filter(j=>(j.status==='queued'||j.status==='in_work')&&j.deadline&&j.deadline<today()).length},
      devUAH:done.reduce((a,j)=>a+num(j.actual.totalUAH)-num(j.plan&&j.plan.totalUAH),0),planUAH:done.reduce((a,j)=>a+num(j.plan&&j.plan.totalUAH),0)};
  }

  /* ---------- materials ---------- */
  function materials(p){
    const byType={};
    S().stockMoves.filter(x=>inP(x.date,p)).forEach(x=>{const t=byType[x.type]||(byType[x.type]={n:0,q:0,c:0});t.n++;t.c+=num(x.qty)*num(x.unitCostUAH)});
    const valueAtEnd=p.to?S().materials.reduce((a,m)=>a+I().valuateMoves(S().stockMoves.filter(x=>x.mid===m.id&&String(x.date)<=p.to)).value,0):I().stockValue();
    const purch=[];
    S().materials.forEach(m=>(m.purchases||[]).filter(pu=>inP(pu.date,p)).forEach(pu=>purch.push({mid:m.id,name:m.name,supplier:m.supplier||'—',unit:m.unit,qty:num(pu.qty),uah:I().purchaseUnitUAH(pu)*num(pu.qty)})));
    const bySup=new Map();purch.forEach(x=>{const r=bySup.get(x.supplier)||{supplier:x.supplier,uah:0,n:0};r.uah+=x.uah;r.n++;bySup.set(x.supplier,r)});
    const cons=new Map();
    S().stockMoves.filter(x=>(x.type==='issue'||x.type==='ret')&&x.ref&&x.ref.orderId&&inP(x.date,p)).forEach(x=>{const m=C().matById(x.mid);
      const r=cons.get(x.mid)||{mid:x.mid,name:m?m.name:'(удалён)',unit:m?m.unit:'',qty:0,uah:0};r.qty-=num(x.qty);r.uah-=num(x.qty)*num(x.unitCostUAH);cons.set(x.mid,r)});
    return {valueNow:I().stockValue(),valueAtEnd,byType,purchases:purch,purchTotal:purch.reduce((a,x)=>a+x.uah,0),bySupplier:[...bySup.values()].sort((a,b)=>b.uah-a.uah),
      topConsumption:[...cons.values()].filter(r=>r.qty>1e-9).sort((a,b)=>b.uah-a.uah).slice(0,10),
      low:S().materials.filter(m=>!m.archived&&C().isLow(m))};
  }

  /* ---------- orders ---------- */
  function orders(p){
    const list=S().orders.filter(o=>inP(o.date,p));
    const byStatus={};list.forEach(o=>{byStatus[o.status]=(byStatus[o.status]||0)+1});
    const live=list.filter(o=>!isCancelledOrder(o)),canc=list.filter(isCancelledOrder);
    const usd=live.reduce((a,o)=>a+C().orderTotal(o),0),uah=live.reduce((a,o)=>a+C().orderRevenueUAH(o),0);
    let profit=0;const src={fact:0,plan:0,norm:0};
    live.forEach(o=>{let cost;if(o.fact){cost=doneJobs(o).reduce((a,j)=>a+num(j.actual.totalUAH),0);src.fact++}else if(o.plan){cost=num(o.plan.totalUAH);src.plan++}else{cost=C().orderCostLive(o);src.norm++}profit+=C().orderRevenueUAH(o)-cost});
    const withDl=live.filter(o=>o.fact&&o.deadline);
    const onTime=withDl.filter(o=>String(o.fact.at).slice(0,10)<=o.deadline).length;
    const lossByOrder=new Map(losses({from:'',to:''}).orders.map(x=>[x.orderId,x.total]));
    return {count:list.length,byStatus,revenueUSD:usd,revenueUAH:uah,profitUAH:profit,profitSource:src,avgCheckUSD:live.length?usd/live.length:null,
      deadlines:{measured:withDl.length,onTime,late:withDl.length-onTime,overdueActive:live.filter(o=>SK.schema.ACTIVE.includes(o.status)&&!o.fact&&o.deadline&&o.deadline<today()).length},
      receivablesUSD:live.filter(o=>SK.schema.ACTIVE.includes(o.status)).reduce((a,o)=>a+Math.max(0,C().orderTotal(o)-num(o.paidUSD)),0),
      cancelled:{count:canc.length,amountUSD:canc.reduce((a,o)=>a+C().orderTotal(o),0),lossUAH:canc.reduce((a,o)=>a+(lossByOrder.get(o.id)||0),0)}};
  }

  return {period,inP,losses,economics,productMargins,production,materials,orders,jobRevenueUAH};
})();
</script>
<script>
/* ======== js/domain/migrate.js ======== */
/* Skripo Studio · domain/migrate.js — pure migrations. No IndexedDB / DOM here.
 *   upgrade(raw)            any known state (Sklad v1 or Studio v2) → normalized v2, {state, photos, log}
 *   importCatalog(state,…)  merges catalog cards (category, photos, description) into products
 * Photos found inline (base64 in v1) are moved out to `photos` {id: dataURL}; the store keeps them as Blobs.
 */
'use strict';
var SK = window.SK = window.SK || {};

SK.migrate = (function(){
  const {uid,num,r3,nowISO,clone,nameKey}=SK.util;
  const SC=SK.schema;

  /* Sklad v1 default product list (skripo-sklad.html → defaultState) — used for a clean install */
  const SKLAD_SEED=[['Longer','19 × 9','В наличии'],['ZipWallet','19,5 × 11','В наличии'],['ZipWallet Plus','19,5 × 11 × 5','В наличии'],
    ['Crossbody','','Под заказ'],['Messenger Bag','28 × 25','Под заказ'],['Backpack Large Leather','46 × 32 × 14','Под заказ'],
    ['Backpack Medium Leather','','В разработке'],['Backpack Large Suede','','В разработке']];

  /* Catalog v0.1/v0.2 built-in cards (app.js → initialProducts). Demo economics (cost, hours, operations,
     $12/h) are deliberately NOT here: they were never approved numbers. */
  const CATALOG_SEED=[
    {id:'longer',name:'Longer',category:'Wallets',size:'19 × 9 cm',material:'Woven leather',color:'Black',price:170,status:'AVAILABLE',
     image:'assets/longer-01.jpeg',gallery:['assets/longer-01.jpeg','assets/longer-02.jpeg'],construction:'2 отдела для купюр, 8 слотов для карт',hardware:'YKK'},
    {id:'zip-wallet',name:'Zip Wallet',category:'Wallets',size:'19.5 × 11 cm',material:'Woven leather',color:'Black',price:190,status:'AVAILABLE',
     image:'assets/zip-wallet-01.jpeg',gallery:['assets/zip-wallet-01.jpeg','assets/zip-wallet-02.jpeg'],construction:'Zip-конструкция, отделения для купюр и карт',hardware:'YKK'},
    {id:'zip-wallet-plus',name:'Zip Wallet Plus',category:'Wallets',size:'19.5 × 11 × 5 cm',material:'Woven leather',color:'Black',price:210,status:'AVAILABLE',
     image:'assets/zip-wallet-plus-01.jpeg',gallery:['assets/zip-wallet-plus-01.jpeg','assets/zip-wallet-plus-02.jpeg','assets/zip-wallet-plus-03.jpeg'],construction:'Объёмная конструкция, zip-закрытие',hardware:'YKK'}
  ];
  const CAT_MAP={Wallets:'Кошельки',Bags:'Сумки',Accessories:'Аксессуары'};
  const MAT_MAP={'Woven leather':'Плетёная кожа','Smooth leather':'Гладкая кожа'};
  const STATUS_MAP={AVAILABLE:'В наличии',DEVELOPMENT:'В разработке',ARCHIVE:'В наличии'};

  const isDataURL=s=>typeof s==='string'&&s.startsWith('data:');

  function detect(raw){
    if(!raw||typeof raw!=='object')return null;
    if(raw.v===2)return 2;
    if(Array.isArray(raw.materials)&&Array.isArray(raw.products))return 1; // Sklad v1 (v:1 or older without v)
    return null;
  }

  /* ---------- v1 (Skripo Sklad) → v2 ---------- */
  function fromV1(v1,log,photos){
    const st=SC.emptyState();
    st.settings=Object.assign(SC.defaultSettings(),v1.settings||{});
    const rate=num(st.settings.rate),at=nowISO();
    const uahOf=m=>m.cur==='USD'?num(m.price)*rate:num(m.price);

    st.materials=(v1.materials||[]).map(m=>{
      const photoIds=(m.photos||[]).map(p=>{if(isDataURL(p)){const id='ph-'+uid();photos[id]=p;return id}return null}).filter(Boolean);
      const mat={id:m.id||uid(),name:String(m.name||'').trim()||'(без названия)',cat:m.cat||'Другое',unit:m.unit||'шт',price:m.price==null?'':m.price,cur:m.cur==='USD'?'USD':'UAH',
        supplier:m.supplier||'',source:m.source||'',note:m.note||'',stock:m.stock==null?'':m.stock,minStock:m.minStock==null?'':m.minStock,inStock:m.inStock!==false,
        photoIds,purchases:(m.purchases||[]).map(p=>({id:uid(),date:p.date||'',qty:p.qty,total:p.total,cur:p.cur==='USD'?'USD':'UAH',rate:null,applied:null,legacy:true})),archived:false};
      const q=r3(num(mat.stock));
      if(q)st.stockMoves.push({id:uid(),at,date:at.slice(0,10),mid:mat.id,type:'opening',qty:q,unitCostUAH:uahOf(mat),ref:null,note:'остаток перенесён из Склада v1'});
      return mat;
    });

    st.products=(v1.products||[]).map(p=>({id:p.id||uid(),name:String(p.name||'').trim()||'(без названия)',size:p.size||'',status:p.status||'Под заказ',
      category:'',color:'',construction:'',hardware:'',materialNote:'',priceUSD:p.price==null?'':p.price,images:[],photoIds:[],
      bom:(p.comp||[]).filter(c=>c&&c.mid).map(c=>({mid:c.mid,qty:c.qty})),
      route:SK.costing.routeFromHours(p.hours),
      other:(p.other||[]).map(o=>({name:o.name||'',uah:o.uah==null?'':o.uah})),notes:p.notes||'',archived:false,origin:{sklad:true}}));

    let frozen=0,plans=0;
    st.orders=(v1.orders||[]).map(o=>{
      const hist=o.status!=='Новый'||!!o.written||o.costSnap!=null;
      if(hist)frozen++;
      const ord={id:o.id||uid(),no:o.no||null,date:o.date||'',client:o.client||'',contact:o.contact||'',channel:o.channel||'Другое',deadline:o.deadline||'',
        status:o.status||'Новый',notes:o.notes||'',
        lines:(o.lines||[]).map(l=>({id:l.id||uid(),pid:l.pid||'',qty:l.qty==null?'1':l.qty,priceUSD:l.price==null?'':l.price,note:l.note||'',subs:Object.assign({},l.subs||{})})),
        paidUSD:o.paid==null?'':o.paid,
        rateSnap:{rate,at,frozen:hist,restored:hist},
        written:o.written?Object.assign({},o.written):null,
        plan:null,fact:null};
      if(o.costSnap!=null){plans++;ord.plan={at:null,rate,hourRate:null,overheadPct:null,matUAH:null,laborUAH:null,otherUAH:null,overheadUAH:null,totalUAH:num(o.costSnap),lines:[],restored:true}}
      return ord;
    });
    st.calc=Object.assign(SC.emptyCalc(),clone(v1.calc||{}));
    log.push(`Склад v1: материалов ${st.materials.length}, изделий ${st.products.length}, заказов ${st.orders.length}, закупок ${st.materials.reduce((a,m)=>a+m.purchases.length,0)}, фото ${Object.keys(photos).length}.`);
    log.push(`Начальные остатки записаны в журнал склада: ${st.stockMoves.length} движ.`);
    if(frozen)log.push(`Курс ${rate} зафиксирован в ${frozen} заказ(ах), вышедших из статуса «Новый» (помечено «восстановлен»: исторический курс в Складе не хранился).`);
    if(plans)log.push(`Зафиксированная себестоимость перенесена как плановый снимок в ${plans} заказ(ах), без разбивки по статьям.`);
    const withHours=st.products.filter(p=>p.route.length).length;
    if(withHours)log.push(`Время работы ${withHours} изделий перенесено одной операцией «${SC.LEGACY_OP.name}».`);
    return st;
  }

  function freshInstall(log){
    const st=SC.emptyState();
    st.products=SKLAD_SEED.map(([name,size,status])=>({id:uid(),name,size,status,category:'',color:'',construction:'',hardware:'',materialNote:'',
      priceUSD:'',images:[],photoIds:[],bom:[],route:[],other:[],notes:'',archived:false,origin:{sklad:true}}));
    log.push('Данных Склада не найдено: создан стартовый список изделий Склада.');
    return st;
  }

  /* ---------- v2 normalize (fills gaps, adds missing seed operations) ---------- */
  function normalize(st){
    st.v=SC.VERSION;
    st.settings=Object.assign(SC.defaultSettings(),st.settings||{});
    ['materials','stockMoves','operations','products','orders','jobs','costItems','migrations'].forEach(k=>{if(!Array.isArray(st[k]))st[k]=[]});
    const have=new Set(st.operations.map(o=>o.id));
    SC.seedOperations().forEach(o=>{if(!have.has(o.id))st.operations.push(o)});
    st.materials.forEach(m=>{m.photoIds=m.photoIds||[];m.purchases=m.purchases||[];m.archived=!!m.archived;m.purchases.forEach(p=>{if(!p.id)p.id=uid()});
      if(m.avgCostUAH===undefined)m.avgCostUAH=SK.inventory.valuateMoves(st.stockMoves.filter(x=>x.mid===m.id)).avg});
    st.products.forEach(p=>{p.bom=p.bom||[];p.route=p.route||[];p.other=p.other||[];p.images=p.images||[];p.photoIds=p.photoIds||[];p.archived=!!p.archived;p.origin=p.origin||{};if(!Array.isArray(p.costItemsOff))p.costItemsOff=[]});
    st.operations.forEach(o=>{o.archived=!!o.archived});
    st.orders.forEach(o=>{o.lines=o.lines||[];o.lines.forEach(l=>{l.subs=l.subs||{};['color','material','params'].forEach(k=>{if(l[k]===undefined)l[k]=''})});if(o.fact===undefined)o.fact=null;if(o.plan===undefined)o.plan=null;
      /* notebook card fields (empty for older orders; `contact` keeps the messenger nick / link as before) */
      ['phone','contactOther','doneDate'].forEach(k=>{if(o[k]===undefined)o[k]=''});if(!Array.isArray(o.photoIds))o.photoIds=[];if(!Array.isArray(o.history))o.history=[]});
    st.calc=Object.assign(SC.emptyCalc(),st.calc||{});
    return st;
  }

  function upgrade(raw,opts){
    opts=opts||{};const log=[],photos={};
    const v=detect(raw);let st;
    if(v===2)st=clone(raw);
    else if(v===1){st=fromV1(raw,log,photos);st.migrations.push({from:1,to:2,at:nowISO(),source:opts.source||'sklad',log:log.slice()})}
    else st=freshInstall(log);
    normalize(st);
    return {state:st,photos,log,from:v};
  }

  /* ---------- catalog cards → products ---------- */
  function importCatalog(st,items,opts){
    opts=opts||{};const log=[];
    if(st.migrations.some(m=>m.kind==='catalog-import'))return {log:['Каталог уже импортирован ранее.']};
    const list=Array.isArray(items)&&items.length?items:CATALOG_SEED;
    const src=Array.isArray(items)&&items.length?(opts.source||'catalog localStorage'):'catalog built-in';
    let matched=0,added=0;const priceFlags=[];
    const img=p=>typeof p==='string'&&p.startsWith('assets/')?p.replace(/^assets\//,'assets/products/'):p;
    list.forEach(c=>{
      if(!c||!c.name)return;
      let p=st.products.find(x=>nameKey(x.name)===nameKey(c.name));
      const isNew=!p;
      if(isNew){p={id:uid(),name:String(c.name).trim(),size:'',status:STATUS_MAP[c.status]||'В разработке',category:'',color:'',construction:'',hardware:'',materialNote:'',
        priceUSD:'',images:[],photoIds:[],bom:[],route:[],other:[],notes:'',archived:c.status==='ARCHIVE',origin:{}};st.products.push(p);added++}
      else matched++;
      p.origin=Object.assign(p.origin||{},{catalog:c.id||true});
      if(!p.category)p.category=CAT_MAP[c.category]||c.category||'';
      if(!p.color&&c.color)p.color=c.color;
      if(!p.construction&&c.construction&&c.construction!=='Заполнить в карточке')p.construction=c.construction;
      if(!p.hardware&&c.hardware&&c.hardware!=='—')p.hardware=c.hardware;
      if(!p.materialNote&&c.material)p.materialNote=MAT_MAP[c.material]||c.material;
      if(!p.size&&c.size&&c.size!=='—')p.size=String(c.size).replace(/\s*cm\s*$/i,'').replace(/(\d)\.(\d)/g,'$1,$2');
      const gal=(c.gallery&&c.gallery.length?c.gallery:[c.image]).filter(Boolean).map(img);
      gal.forEach(g=>{if(!p.images.includes(g))p.images.push(g)});
      if(!num(p.priceUSD)&&num(c.price)){p.priceUSD=String(num(c.price));priceFlags.push(`${p.name} $${num(c.price)}`)}
    });
    log.push(`Каталог (${src}): сопоставлено ${matched}, добавлено ${added}. Перенесены категория, цвет, конструкция, фурнитура, материал, фото.`);
    if(priceFlags.length)log.push(`Цены из каталога подставлены там, где в Складе цена пустая (проверить!): ${priceFlags.join(', ')}.`);
    log.push('Не перенесено как демонстрационное: себестоимость материалов, часы и операции каталога, ставка $12/ч.');
    st.migrations.push({kind:'catalog-import',at:nowISO(),source:src,log:log.slice()});
    return {log};
  }

  return {detect,upgrade,normalize,importCatalog,CATALOG_SEED,SKLAD_SEED};
})();
</script>
<script>
/* ======== js/core/store.js ======== */
/* Skripo Studio · core/store.js — persistence.
 * IndexedDB "skripo-studio": store "kv" (key "state" → v2 state without photos), store "photos" (id → Blob).
 * First launch: reads the old Sklad DB "skripo-sklad" READ-ONLY (never created, never written) and the
 * catalog's localStorage "skripo_products", migrates both into v2. The old apps keep working untouched.
 */
'use strict';
var SK = window.SK = window.SK || {};

SK.store = (function(){
  const {$,today}=SK.util;
  const DB_NAME='skripo-studio',LEGACY_DB='skripo-sklad',CATALOG_LS='skripo_products';
  let dbp=null,saveT=null;
  const photoURLs=new Map();
  const st={memoryOnly:false,notice:null};

  function open(){
    if(dbp)return dbp;
    dbp=new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);
      r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    return dbp;
  }
  const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  async function tx(store,mode,fn){const d=await open();const t=d.transaction(store,mode);const out=fn(t.objectStore(store));
    await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});return out}

  /* old Sklad DB: open without creating it (abort the upgrade if it does not exist) */
  function readLegacySklad(){
    return new Promise(res=>{
      let r;try{r=indexedDB.open(LEGACY_DB)}catch(e){res(null);return}
      r.onupgradeneeded=e=>{try{e.target.transaction.abort()}catch(_){}};
      r.onerror=()=>res(null);r.onblocked=()=>res(null);
      r.onsuccess=()=>{const d=r.result;
        if(!d.objectStoreNames.contains('kv')){d.close();res(null);return}
        const q=d.transaction('kv').objectStore('kv').get('state');
        q.onsuccess=()=>{d.close();res(q.result||null)};q.onerror=()=>{d.close();res(null)}};
    });
  }
  function readCatalogLS(){try{const v=JSON.parse(localStorage.getItem(CATALOG_LS)||'null');return Array.isArray(v)?v:null}catch(e){return null}}

  /* ---- photos ---- */
  function dataURLtoBlob(u){const [h,b]=u.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg';
    const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
  const blobToDataURL=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b)});
  async function putPhoto(dataURL,id){
    id=id||'ph-'+SK.util.uid();const blob=dataURLtoBlob(dataURL);
    try{await tx('photos','readwrite',s=>s.put(blob,id))}catch(e){st.memoryOnly=true}
    photoURLs.set(id,URL.createObjectURL(blob));return id;
  }
  const photoURL=id=>photoURLs.get(id)||'';
  async function loadPhotos(){
    try{await tx('photos','readonly',s=>{const c=s.openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){photoURLs.set(cur.key,URL.createObjectURL(cur.value));cur.continue()}}})}catch(e){}
  }
  /* drop photos no record references (e.g. added in a form that was cancelled) */
  async function gcPhotos(){
    const used=new Set();SK.S.materials.forEach(m=>(m.photoIds||[]).forEach(i=>used.add(i)));SK.S.products.forEach(p=>(p.photoIds||[]).forEach(i=>used.add(i)));SK.S.orders.forEach(o=>(o.photoIds||[]).forEach(i=>used.add(i)));
    const drop=[...photoURLs.keys()].filter(k=>!used.has(k));
    if(!drop.length)return;
    try{await tx('photos','readwrite',s=>drop.forEach(k=>s.delete(k)))}catch(e){}
    drop.forEach(k=>{URL.revokeObjectURL(photoURLs.get(k));photoURLs.delete(k)});
  }
  async function exportPhotos(){const out={};for(const [id] of photoURLs){try{const b=await tx('photos','readonly',s=>req(s.get(id)));if(b)out[id]=await blobToDataURL(await b)}catch(e){}}return out}

  /* ---- state ---- */
  function save(){clearTimeout(saveT);saveT=setTimeout(doSave,250)}
  async function doSave(){
    try{await tx('kv','readwrite',s=>s.put(JSON.parse(JSON.stringify(SK.S)),'state'));
      const t=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
      const e=$('#savestate');if(e)e.textContent='Сохранено · '+t;
      if(SK.sync)SK.sync.dirty();
    }catch(e){st.memoryOnly=true;const el=$('#savestate');if(el)el.textContent='⚠ Не сохраняется'}
  }
  const flush=()=>{clearTimeout(saveT);return doSave()};
  /* helpers for the cloud sync (core/sync.js): device-local settings, photo bytes, replacing the state */
  const kvGet=k=>tx('kv','readonly',s=>req(s.get(k)));
  const kvSet=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));
  const photoIds=()=>[...photoURLs.keys()];
  async function photoDataURL(id){try{const b=await tx('photos','readonly',s=>req(s.get(id)));return b?await blobToDataURL(b):null}catch(e){return null}}
  async function replaceState(raw){const r=SK.migrate.upgrade(raw,{source:'облако'});SK.S=r.state;SK.S.lastMigrationNotice=null;st.notice=null;await flush()}

  async function adopt(result){
    SK.S=result.state;
    for(const [id,u] of Object.entries(result.photos||{}))await putPhoto(u,id);
  }

  async function boot(){
    let saved=null;
    try{saved=await tx('kv','readonly',s=>req(s.get('state')))}catch(e){st.memoryOnly=true}
    if(saved){
      const r=SK.migrate.upgrade(saved);await adopt(r);await loadPhotos();
    }else{
      const legacy=st.memoryOnly?null:await readLegacySklad();
      const r=SK.migrate.upgrade(legacy,{source:'IndexedDB skripo-sklad'});
      await adopt(r);
      const c=SK.migrate.importCatalog(SK.S,readCatalogLS(),{source:'localStorage skripo_products'});
      st.notice={from:r.from,log:r.log.concat(c.log),at:Date.now()};
      SK.S.lastMigrationNotice=st.notice;
      await flush();
    }
    if(SK.S.lastMigrationNotice&&!SK.S.lastMigrationNotice.dismissed)st.notice=SK.S.lastMigrationNotice;
    await gcPhotos();
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }

  async function backup(){
    const data=Object.assign({},SK.S,{photos:await exportPhotos(),exportedAt:new Date().toISOString(),app:'skripo-studio'});
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='skripo-studio-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();
    SK.S.settings.lastBackup=Date.now();save();
  }
  /* accepts a Studio v2 backup or an old Sklad v1 backup; returns summary for confirmation, then apply() */
  function parseBackup(text){
    const j=JSON.parse(text);const v=SK.migrate.detect(j);if(!v)throw new Error('not a backup');
    return {v,counts:{materials:j.materials.length,products:j.products.length,orders:(j.orders||[]).length},
      apply:async()=>{
        const photos=v===2?(j.photos||{}):{};const raw=Object.assign({},j);delete raw.photos;delete raw.exportedAt;delete raw.app;
        const r=SK.migrate.upgrade(raw,{source:'файл копии Склада'});r.photos=Object.assign({},r.photos,photos);
        try{await tx('photos','readwrite',s=>s.clear())}catch(e){}
        photoURLs.forEach(u=>URL.revokeObjectURL(u));photoURLs.clear();
        await adopt(r);
        let log=r.log;
        if(v===1){const c=SK.migrate.importCatalog(SK.S,readCatalogLS(),{source:'localStorage skripo_products'});log=log.concat(c.log)}
        if(v===1){st.notice={from:1,log,at:Date.now()};SK.S.lastMigrationNotice=st.notice}
        await flush();return log;
      }};
  }
  async function wipe(){
    SK.S=SK.migrate.upgrade(null).state;SK.S.migrations.push({kind:'wipe',at:new Date().toISOString()});
    SK.migrate.importCatalog(SK.S,readCatalogLS());
    try{await tx('photos','readwrite',s=>s.clear())}catch(e){}
    photoURLs.forEach(u=>URL.revokeObjectURL(u));photoURLs.clear();st.notice=null;await flush();
  }
  function dismissNotice(){if(SK.S.lastMigrationNotice)SK.S.lastMigrationNotice.dismissed=true;st.notice=null;save()}

  return {boot,save,flush,kvGet,kvSet,photoIds,photoDataURL,replaceState,backup,parseBackup,wipe,putPhoto,photoURL,dismissNotice,
          get memoryOnly(){return st.memoryOnly},get notice(){return st.notice}};
})();
</script>
<script>
/* ======== js/core/sync.js ======== */
/* Skripo Studio · core/sync.js — cloud copy in Google Sheets (Apps Script web app).
 * IndexedDB stays the working copy; this module mirrors it to a spreadsheet (one readable sheet per section, the full
 * record JSON in the last columns = source of truth for restore) and photos to a Drive folder.
 * Device-local settings (url, key, revision) live in IndexedDB kv "sync", never in the state or in backups.
 * Rules: remote revision == local revision → push if dirty; remote newer and nothing local changed → pull;
 * both changed (or first connect with data on both sides) → the owner decides, nothing is overwritten silently.
 */
'use strict';
var SK = window.SK = window.SK || {};

SK.sync = (function(){
  const st={cfg:null,busy:false,err:'',last:null,conflict:false,muted:false,seq:0,timer:null};
  const CH=30000;                       // chars per cell (Sheets limit is 50 000)
  const META_SHEET='Настройки (служебное)';
  const cell=v=>v==null?'':typeof v==='object'?JSON.stringify(v):v;
  const chunks=j=>{const o=[];for(let i=0;i<j.length;i+=CH)o.push(j.slice(i,i+CH));return o.length?o:['']};
  const matName=id=>{const m=((SK.S||{}).materials||[]).find(x=>x.id===id);return m?m.name:id};
  const DEFS=[
    ['materials','Материалы',['Название','Категория','Ед.','Цена','Валюта','Поставщик','Остаток','Минимум','Архив'],m=>[m.name,m.cat,m.unit,m.price,m.cur,m.supplier,m.stock,m.minStock,m.archived?'да':'']],
    ['stockMoves','Движения материалов',['Дата','Тип','Материал','Кол-во','Цена за ед., ₴','Заметка'],x=>[x.date,SK.schema.MOVE_TYPES[x.type]||x.type,matName(x.mid),x.qty,x.unitCostUAH,x.note]],
    ['operations','Операции',['Код','Название','Норматив, мин','Архив'],o=>[o.code,o.name,Array.isArray(o.normMin)?o.normMin.join('–'):'',o.archived?'да':'']],
    ['products','Изделия',['Название','Категория','Статус','Цена, $','Размер','Архив'],p=>[p.name,p.category,p.status,p.priceUSD,p.size,p.archived?'да':'']],
    ['costItems','Статьи расходов',['Название','Группа','Метод','Сумма','Валюта','Архив'],c=>[c.name,c.group,c.method,c.amount,c.cur,c.archived?'да':'']],
    ['orders','Заказы',['№','Дата','Клиент','Статус','Сумма, $','Оплачено, $','Срок'],o=>[o.no,o.date,o.client,o.status,SK.costing.orderTotal(o),o.paidUSD,o.deadline]],
    ['jobs','Задания',['Статус','Заказ'],j=>[j.status,j.orderId||(j.order&&j.order.id)||j.oid]]
  ];
  const META_KEYS=['v','settings','calc','migrations'];

  function buildPayload(){
    const S=SK.S,sheets={};
    DEFS.forEach(([key,title,head,fn])=>{
      sheets[title]={headers:head.concat(['id','json']),
        rows:(S[key]||[]).map(r=>{let c;try{c=fn(r).map(cell)}catch(e){c=head.map(()=>'')}return c.concat([r.id==null?'':String(r.id)],chunks(JSON.stringify(r)))})};
    });
    sheets[META_SHEET]={headers:['Раздел','id','json'],rows:META_KEYS.map(k=>[k,k].concat(chunks(JSON.stringify(S[k]===undefined?null:S[k]))))};
    return sheets;
  }
  function rebuild(sheets){
    const out={};
    DEFS.forEach(([key,title])=>{out[key]=(sheets[title]||[]).map(r=>JSON.parse(r[1]))});
    (sheets[META_SHEET]||[]).forEach(r=>{out[r[0]]=JSON.parse(r[1])});
    if(!out.v)out.v=SK.schema.VERSION;
    ['settings','calc'].forEach(k=>{if(!out[k])delete out[k]});
    if(!Array.isArray(out.migrations))out.migrations=[];
    return out;
  }

  /* ---- transport: JSON in a text/plain POST (no CORS preflight), Apps Script answers with JSON ---- */
  async function call(action,payload){
    const c=st.cfg,ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),90000);
    try{
      const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:c.key,action},payload||{})),redirect:'follow',signal:ctl.signal});
      let j;try{j=await r.json()}catch(e){throw new Error('Скрипт ответил не JSON: проверьте ссылку и что доступ — «Все»')}
      if(!j.ok)throw new Error(j.error==='auth'?'Неверный ключ':j.error||'Ошибка скрипта');
      return j;
    }catch(e){throw e.name==='AbortError'?new Error('Нет ответа за 90 секунд'):e}
    finally{clearTimeout(t)}
  }
  const saveCfg=()=>SK.store.kvSet('sync',st.cfg);

  /* ---- photos ---- */
  async function syncPhotos(){
    const remote=new Set((await call('photoList')).ids||[]),local=new Set(SK.store.photoIds());
    for(const id of local){if(remote.has(id))continue;
      const u=await SK.store.photoDataURL(id);if(!u)continue;
      const m=/^data:([^;]+);base64,(.*)$/.exec(u);if(!m)continue;
      await call('photoPut',{id,mime:m[1],data:m[2]})}
    let got=0;
    for(const id of remote){if(local.has(id))continue;
      const r=await call('photoGet',{id});if(r.data){await SK.store.putPhoto('data:'+r.mime+';base64,'+r.data,id);got++}}
    return got;
  }
  /* ---- push / pull ---- */
  async function doPush(force){
    const seq=st.seq,sheets=buildPayload();
    const r=await call('push',{baseRev:st.cfg.rev,force:!!force,sheets});
    if(r.conflict){st.conflict=true;return false}
    st.cfg.rev=r.rev;if(seq===st.seq)st.cfg.dirty=false;await saveCfg();
    await syncPhotos();return true;
  }
  async function doPull(rev){
    const r=await call('pull');
    st.muted=true;
    try{await SK.store.replaceState(rebuild(r.sheets))}finally{st.muted=false}
    st.cfg.rev=r.rev;st.cfg.dirty=false;await saveCfg();
    await syncPhotos();
    if(SK.app&&SK.app.PAGE)SK.app.refresh();
  }
  const hasLocalData=()=>{const S=SK.S;return !!(S&&(S.materials.length||S.orders.length||S.stockMoves.length||S.jobs.length))};

  async function run(force){
    if(!st.cfg||st.busy)return;
    if(navigator.onLine===false){st.err='Нет сети';render();return}
    st.busy=true;st.err='';render();
    try{
      const info=await call('info');
      if(force==='pull'){await doPull()}
      else if(force==='push'){await doPush(true)}
      else if(info.rev===st.cfg.rev){if(st.cfg.dirty||st.cfg.rev===0)await doPush(false);else await syncPhotos()}
      else if(info.rev>st.cfg.rev&&!st.cfg.dirty&&!(st.cfg.rev===0&&hasLocalData()))await doPull();
      else{st.conflict=true}
      if(!st.err&&!st.conflict)st.last=Date.now();
    }catch(e){st.err=e.message||String(e)}
    st.busy=false;render();
    if(st.conflict)resolveConflict();
  }
  async function resolveConflict(){
    if(st.asking)return;st.asking=true;
    try{
      const U=SK.ui;
      if(await U.askConfirm('В облаке уже есть данные, и на этом устройстве они тоже есть и различаются. Взять данные из облака? Данные на этом устройстве будут заменены.','Взять из облака','Не сейчас')){st.conflict=false;await run('pull')}
      else if(await U.askConfirm('Тогда заменить данные в облаке данными с этого устройства? (Таблица хранит свои версии и ежедневные копии.)','Заменить облако','Не сейчас')){st.conflict=false;await run('push')}
    }finally{st.asking=false}
  }

  /* ---- public ---- */
  function dirty(){
    if(!st.cfg||st.muted)return;
    st.seq++;st.cfg.dirty=true;saveCfg();render();
    if(st.cfg.auto!==false){clearTimeout(st.timer);st.timer=setTimeout(()=>run(),4000)}
  }
  async function start(){
    try{st.cfg=await SK.store.kvGet('sync')||null}catch(e){st.cfg=null}
    render();
    if(!st.cfg)return;
    window.addEventListener('online',()=>run());
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')run()});
    run();
  }
  async function connect(url,key){
    url=(url||'').trim();key=(key||'').trim();
    if(!/^https:\/\/script\.google\.com\//.test(url))throw new Error('Ссылка должна начинаться с https://script.google.com/');
    if(!key)throw new Error('Введите ключ доступа');
    st.cfg={url,key,rev:0,dirty:false,auto:true};
    try{await call('info')}catch(e){st.cfg=null;throw e}
    await saveCfg();st.err='';st.conflict=false;render();
    await run();
  }
  async function disconnect(){st.cfg=null;st.err='';st.conflict=false;try{await SK.store.kvSet('sync',null)}catch(e){}render()}
  const setAuto=v=>{if(st.cfg){st.cfg.auto=!!v;saveCfg()}};
  const status=()=>({connected:!!st.cfg,busy:st.busy,err:st.err,last:st.last,dirty:!!(st.cfg&&st.cfg.dirty),conflict:st.conflict,auto:!st.cfg||st.cfg.auto!==false,url:st.cfg&&st.cfg.url});
  function label(){
    if(!st.cfg)return '';
    if(st.busy)return 'Облако: синхронизация…';
    if(st.err)return '⚠ Облако: '+st.err;
    if(st.conflict)return '⚠ Облако: нужно решение';
    if(st.cfg.dirty)return 'Облако: ждёт отправки';
    return 'Облако: синхронизировано'+(st.last?' · '+new Date(st.last).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'');
  }
  function render(){
    const e=document.getElementById('syncstate');
    if(e){const l=label();e.textContent=l;e.className=/^⚠/.test(l)?'bad-t':''}
    const p=document.getElementById('syncpanel');   // refresh only the panel, never the whole page (typing elsewhere must not lose focus)
    if(p&&SK.syncPanelHTML&&!p.contains(document.activeElement))p.innerHTML=SK.syncPanelHTML();
  }
  return {start,connect,disconnect,dirty,syncNow:()=>run(),pull:()=>run('pull'),push:()=>run('push'),setAuto,status,label,
          _buildPayload:buildPayload,_rebuild:rebuild};
})();
</script>
<script>
/* ======== js/core/ui.js ======== */
/* Skripo Studio · core/ui.js — modal, confirm, toast, lightbox, shared HTML helpers (ported from Sklad v1) */
'use strict';
var SK = window.SK = window.SK || {};

SK.ui = (function(){
  const {$,$$,esc,num,fmt,uah,usd,qf,setPath}=SK.util;
  const S=()=>SK.S;

  function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

  function openModal(cfg){
    const el=document.createElement('div');el.className='overlay';
    el.innerHTML=`<div class="modal ${cfg.wide?'wide':''}" role="dialog"><header><h2></h2><button class="x" data-act="close" title="Закрыть">×</button></header><div class="mbody"></div><footer></footer></div>`;
    $('h2',el).textContent=cfg.title;
    const body=$('.mbody',el),foot=$('footer',el);
    const live=()=>{const L=$('#live',el);if(L&&cfg.live)L.innerHTML=cfg.live(cfg.draft)};
    const draw=()=>{
      const sc=body.scrollTop;body.innerHTML=cfg.body(cfg.draft);body.scrollTop=sc;
      foot.innerHTML=`<div>${cfg.extra?cfg.extra(cfg.draft):''}</div><div class="r"><button class="btn ghost" data-act="close">${cfg.cancel||'Отмена'}</button>${cfg.noSave?'':`<button class="btn" data-act="save">${cfg.saveLabel||'Сохранить'}</button>`}</div>`;
      live();
    };
    const close=()=>{el.remove();document.removeEventListener('keydown',onKey)};
    const onKey=e=>{if(e.key==='Escape'&&el===$$('.overlay').pop())close()};
    document.addEventListener('keydown',onKey);
    el.addEventListener('input',e=>{
      const t=e.target,f=t.dataset.f;if(!f)return;
      setPath(cfg.draft,f,t.type==='checkbox'?t.checked:t.value);
      if(cfg.onInput&&cfg.onInput(f,cfg.draft,draw)===true)draw();
      live();
    });
    el.addEventListener('change',async e=>{
      const t=e.target;
      if(t.dataset.photo!==undefined&&t.files&&t.files.length){
        for(const f of t.files){try{cfg.draft.photoIds.push(await SK.store.putPhoto(await resizeImage(f)))}catch(_){toast('Не удалось прочитать фото')}}
        draw();
      }
    });
    el.addEventListener('click',e=>{
      const b=e.target.closest('[data-act]');
      if(!b){const im=e.target.closest('[data-zoom]');if(im)viewImage(im.dataset.zoom);return}
      const act=b.dataset.act;
      if(act==='close')close();
      else if(act==='save'){if(cfg.onSave(cfg.draft,close)!==false)close()}
      else if(act==='addphoto')$('[data-photo]',el).click();
      else cfg.onAction&&cfg.onAction(act,b,cfg.draft,draw,close);
    });
    $('#modal-root').appendChild(el);draw();
    const first=$('input[type=text]',body);if(first&&!first.value)first.focus();
    return {close,draw,el};
  }
  function askConfirm(text,ok='Да',cancel='Нет'){
    return new Promise(res=>{
      const m=openModal({title:'Подтверждение',draft:{},body:()=>`<p style="margin:0;font-size:15.5px">${esc(text)}</p>`,noSave:true,cancel,
        extra:()=>`<button class="btn" data-act="yes">${esc(ok)}</button>`,onAction:(a,_b,_d,_dr,close)=>{if(a==='yes'){res(true);close()}}});
      new MutationObserver((_,o)=>{if(!document.body.contains(m.el)){o.disconnect();res(false)}}).observe($('#modal-root'),{childList:true});
    });
  }
  function info(title,text){openModal({title,draft:{},body:()=>`<p style="margin:0;font-size:15.5px">${esc(text)}</p>`,noSave:true,cancel:'Понятно'})}
  /* fullscreen viewer: viewImage(url) or viewImage([urls], startIndex). The picture fills the whole screen;
     click = zoom in/out (scroll to pan), arrows / swipe / ← → switch, × / Esc / click outside the picture closes */
  function viewImage(src,start){
    const list=Array.isArray(src)?src:[src];let i=Math.min(Math.max(+start||0,0),list.length-1),zoomed=false;
    const l=document.createElement('div');l.className='lightbox';
    const draw=()=>{l.classList.toggle('z',zoomed);l.innerHTML=`<div class="lb-sc"><img src="${esc(list[i])}" alt=""></div>${list.length>1?`<button class="lb-nav prev" data-lb="-1" aria-label="Назад">‹</button><button class="lb-nav next" data-lb="1" aria-label="Вперёд">›</button><div class="lb-count">${i+1} / ${list.length}</div>`:''}<button class="lb-x" data-lb="x" aria-label="Закрыть">×</button>`;
      if(zoomed){const sc=l.querySelector('.lb-sc');sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)/2;sc.scrollTop=(sc.scrollHeight-sc.clientHeight)/2}};
    const close=()=>{l.remove();document.removeEventListener('keydown',key,true)};
    const go=d=>{i=(i+d+list.length)%list.length;zoomed=false;draw()};
    const key=e=>{if(e.key==='Escape'){e.stopImmediatePropagation();e.preventDefault();close()}else if(list.length>1&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.stopImmediatePropagation();go(e.key==='ArrowRight'?1:-1)}};
    l.onclick=e=>{const b=e.target.closest('[data-lb]');if(b){e.stopPropagation();b.dataset.lb==='x'?close():go(+b.dataset.lb);return}
      if(e.target.tagName==='IMG'){zoomed=!zoomed;draw()}else close()};
    let x0=null;l.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
    l.addEventListener('touchend',e=>{if(x0==null||list.length<2||zoomed)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50){e.preventDefault();go(dx<0?1:-1)}});
    document.addEventListener('keydown',key,true);draw();document.body.appendChild(l);
  }
  function resizeImage(file,max=900){
    return new Promise((res,rej)=>{
      const img=new Image(),url=URL.createObjectURL(file);
      img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82))};
      img.onerror=rej;img.src=url;
    });
  }

  /* ---- html helpers ---- */
  const opts=(arr,sel)=>arr.map(a=>`<option ${a===sel?'selected':''}>${esc(a)}</option>`).join('');
  /* archived materials/products are offered only when already selected (history stays readable) */
  function matOpts(sel,blank='— выбрать материал —'){
    const C=SK.costing,mats=S().materials.filter(m=>!m.archived||m.id===sel);
    const cats=[...new Set([...SK.schema.CATS,...mats.map(m=>m.cat).filter(Boolean)])];
    let h=`<option value="">${esc(blank)}</option>`;
    cats.forEach(c=>{const ms=mats.filter(m=>(m.cat||'Другое')===c).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
      if(ms.length)h+=`<optgroup label="${esc(c)}">${ms.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.name)} (${esc(m.unit)})${m.archived?' · архив':''}</option>`).join('')}</optgroup>`});
    if(sel&&!C.matById(sel))h+=`<option value="${esc(sel)}" selected>(материал удалён)</option>`;
    return h;
  }
  const prodOpts=(sel,blank='— выбрать изделие —')=>`<option value="">${esc(blank)}</option>`+S().products.filter(p=>!p.archived||p.id===sel)
    .map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}${p.archived?' · архив':''}</option>`).join('');
  function breakdown(c,withRows){
    let h='';
    if(withRows&&c.rows.length)h+=c.rows.map(r=>`<div class="sum"><span>${esc(r.name)} · ${qf(r.qty)} ${esc(r.unit)}${r.subbed?' (замена)':''}</span><span>${r.missing?'—':uah(r.sum)}</span></div>`).join('');
    else h+=`<div class="sum"><span>Материалы</span><span>${uah(c.mat)}</span></div>`;
    h+=`<div class="sum"><span>Работа${c.hours?` · ${qf(c.hours)} ч`:''}</span><span>${uah(c.labor)}</span></div>`;
    if(c.otherSum||c.oth.length)h+=`<div class="sum"><span>Прочие расходы</span><span>${uah(c.otherSum)}</span></div>`;
    if(c.overhead)h+=`<div class="sum"><span>Накладные ${fmt(num(S().settings.overhead),0)}%</span><span>${uah(c.overhead)}</span></div>`;
    h+=`<div class="sum total"><span>Себестоимость</span><span>${uah(c.total)}</span></div>`;
    return h;
  }
  function priceLine(priceUsd,cost,rate){
    rate=rate==null?num(S().settings.rate):num(rate);
    const pu=num(priceUsd)*rate,m=SK.costing.margin(pu,cost);
    if(!num(priceUsd))return `<div class="note" style="margin-top:10px">Цена продажи не задана</div>`;
    return `<div class="sum" style="margin-top:8px"><span>Цена продажи</span><span>${usd(num(priceUsd))} ≈ ${uah(pu)}</span></div>
    <div class="sum"><span>Прибыль</span>${calculated(cost)?`<span class="${pu-cost<0?'bad-t':''}">${uah(pu-cost)}</span>`:NOT_CALC}</div>
    <div class="sum"><span>Маржа</span>${calculated(cost)?`<span class="${m!=null&&m<0?'bad-t':''}">${pct(m)}</span>`:NOT_CALC}</div>`;
  }
  /* ---- full cost (2026-11-12): A direct · workshop overhead · B per-item · C brand ---- */
  const ruleText=x=>x.method==='percent'?`${fmt(x.pct,x.pct%1?1:0)}% от цены`:x.method==='batch'?`на партию ÷ ${fmt(x.batchQty,0)} шт.`:'на изделие';
  let CUR='UAH';const setCur=c=>{CUR=c==='USD'?'USD':'UAH'};
  const mon=v=>CUR==='USD'?usd(num(v)/(num(S().settings.rate)||1)):uah(v);
  function fullBreakdown(fc){
    const q=fc.qty>1?` <span class="note">(на ${fmt(fc.qty,0)} шт.)</span>`:'';
    const line=(t,v,cls='')=>`<div class="sum ${cls}"><span>${t}</span><span>${mon(v)}</span></div>`;
    const head=t=>`<div class="sec" style="margin:12px 0 2px">${t}</div>`;
    const d=fc.direct,B=fc.items.filter(x=>x.group==='per-item'),Cb=fc.items.filter(x=>x.group==='brand');
    let h=head('А. Прямые затраты'+q);
    if(d.materials)h+=line('Материалы',d.materials);if(d.hardware)h+=line('Фурнитура',d.hardware);if(d.consumables)h+=line('Расходные материалы',d.consumables);
    h+=line(`Работа <span class="note">· ${mon(num(S().settings.hourRate))}/ч</span>`,d.labor);
    h+=line('<b>Итого прямые затраты</b>',d.total);
    if(fc.overhead)h+=line(`Накладные мастерской ${fmt(num(S().settings.overhead),0)}%`,fc.overhead);
    if(fc.individual||B.length){h+=head('Б. Дополнительные на изделие');
      if(fc.individual)h+=line('Индивидуальные расходы изделия',fc.individual);
      B.forEach(x=>h+=line(`${esc(x.name)} <span class="note">· ${ruleText(x)}</span>`,x.sumUAH))}
    if(Cb.length){h+=head('В. Распределяемые расходы бренда');Cb.forEach(x=>h+=line(`${esc(x.name)} <span class="note">· ${ruleText(x)}</span>`,x.sumUAH))}
    h+=`<div style="height:8px"></div>`+line('Себестоимость производства <span class="note">· прямые + накладные + индивидуальные</span>',fc.production);
    h+=`<div class="sum total"><span>Полная себестоимость</span><span>${calculated(fc.full)?mon(fc.full):'—'}</span></div>`;
    if(fc.needsPrice)h+=`<div class="note">Процентные статьи считаются от цены продажи — задайте цену.</div>`;
    fc.warnings.forEach(w=>h+=`<div class="note bad-t">${esc(w)}</div>`);
    return h;
  }
  /* two profits: by production cost (as before) and by full cost */
  function profitLines(revenueUAH,fc){
    const row=(label,cost)=>{const m=SK.costing.margin(revenueUAH,cost);
      return `<div class="sum"><span>${label}</span>${calculated(cost)?`<span class="${revenueUAH-cost<0?'bad-t':''}">${mon(revenueUAH-cost)} · ${pct(m)}</span>`:NOT_CALC}</div>`};
    return row('Прибыль / маржа по себестоимости производства',fc.production)+(fc.extrasUAH?row('Прибыль / маржа по полной себестоимости',fc.full):'');
  }
  function priceLineFull(priceUsd,fc,rate){
    rate=rate==null?num(S().settings.rate):num(rate);
    if(!num(priceUsd))return `<div class="note" style="margin-top:10px">Цена продажи не задана</div>`;
    const pu=num(priceUsd)*rate*(fc.qty||1);
    return `<div class="sum" style="margin-top:8px"><span>Цена продажи</span><span>${usd(num(priceUsd))} ≈ ${uah(num(priceUsd)*rate)}</span></div>`+profitLines(pu,fc);
  }
  const pct=m=>m==null?'—':fmt(m*100,0)+'%';
  /* display only: a zero cost means nothing is specified yet (no materials, labor or expenses) — not a 100 % margin */
  const calculated=cost=>num(cost)>0;
  const NOT_CALC='<span class="muted">Не рассчитано</span>';
  const marginText=(m,cost)=>calculated(cost)?pct(m):NOT_CALC;
  const empty=(t,btn)=>`<div class="empty">${t}${btn||''}</div>`;
  const field=(label,inner,cls='')=>`<label class="f ${cls}">${label}${inner}</label>`;
  const inp=(f,v,extra='')=>`<input type="text" data-f="${f}" value="${esc(v)}" ${extra}>`;
  const ninp=(f,v,extra='')=>`<input type="text" inputmode="decimal" data-f="${f}" value="${esc(v)}" ${extra}>`;
  const archTag=r=>r&&r.archived?' <span class="tag arch">Архив</span>':'';

  /* ---------- top-panel kit: tabs row + icon popovers + chips (no native selects / date fields in the bar) ---------- */
  const popWrap=(key,icon,title,body,active)=>{const open=SK.app.UI.pop===key;
    return `<div class="fwrap"><button class="ib${open||active?' on':''}" data-act="pop-toggle" data-id="${key}" title="${title}" aria-label="${title}">${icon}${active?'<i class="fdot"></i>':''}</button>${open?`<div class="fpop">${body}</div>`:''}</div>`};
  const popList=(key,opts,cur)=>`<div class="plist">${opts.map(([v,t])=>`<button class="${String(v)===String(cur)?'cur':''}" data-act="pop-pick" data-k="${key}" data-id="${esc(v)}">${esc(t)}</button>`).join('')}</div>`;
  const dateRange=(kf,kt,from,to)=>`<div class="dr"><label><span>с</span><input type="date" data-ui="${kf}" value="${esc(from)}"></label><label><span>по</span><input type="date" data-ui="${kt}" value="${esc(to)}"></label></div>`;
  const chips=list=>list.length?`<div class="chips">${list.map(([k,t])=>`<span class="chip">${esc(t)}${k?`<button data-act="pop-clear" data-id="${k}" aria-label="Снять фильтр">×</button>`:''}</span>`).join('')}</div>`:'';
  const tabsRow=(act,opts,cur,id)=>`<div class="seg cats"${id?` id="${id}"`:''}>${opts.map(([v,t])=>`<button data-act="${act}" data-id="${esc(v)}" class="${String(cur)===String(v)?'on':''}">${esc(t)}</button>`).join('')}</div>`;
  const searchBox=(flag,qkey,ph)=>{const UI=SK.app.UI;return `${UI[flag]?`<input type="search" id="srchq" placeholder="${esc(ph)}" data-ui="${qkey}" value="${esc(UI[qkey])}">`:''}<button class="ib${UI[flag]?' on':''}" data-act="srch-toggle" data-id="${flag}|${qkey}" title="Поиск" aria-label="Поиск">${IC.search}</button>`};
  /* quick periods → [from, to] as YYYY-MM-DD ('' = open end) */
  const presetRange=v=>{const t=new Date(),p=n=>String(n).padStart(2,'0'),f=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    if(v==='30'){const d=new Date(t);d.setDate(d.getDate()-30);return [f(d),'']}
    if(v==='month')return [f(new Date(t.getFullYear(),t.getMonth(),1)),''];
    if(v==='year')return [f(new Date(t.getFullYear(),0,1)),''];
    return ['',''];};

  /* shared line icons */
  const SV=d=>`<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IC={cal:SV('<rect x="3" y="4.5" width="14" height="12.5" rx="1.5"/><path d="M3 8.5h14M7 3v3M13 3v3"/>'),box:SV('<path d="M10 3l7 3.5v7L10 17l-7-3.5v-7z"/><path d="M3 6.5l7 3.5 7-3.5M10 10v7"/>'),check:SV('<path d="M4 10.5l4 4 8-9"/>'),plus:SV('<path d="M10 4v12M4 10h12"/>'),grid:SV('<rect x="3" y="3" width="6" height="6"/><rect x="11" y="3" width="6" height="6"/><rect x="3" y="11" width="6" height="6"/><rect x="11" y="11" width="6" height="6"/>'),
    list:SV('<path d="M3 5h14M3 10h14M3 15h14"/>'),
    small:SV('<rect x="3" y="3" width="3.5" height="3.5"/><rect x="8.25" y="3" width="3.5" height="3.5"/><rect x="13.5" y="3" width="3.5" height="3.5"/><rect x="3" y="8.25" width="3.5" height="3.5"/><rect x="8.25" y="8.25" width="3.5" height="3.5"/><rect x="13.5" y="8.25" width="3.5" height="3.5"/><rect x="3" y="13.5" width="3.5" height="3.5"/><rect x="8.25" y="13.5" width="3.5" height="3.5"/><rect x="13.5" y="13.5" width="3.5" height="3.5"/>'),
    large:SV('<rect x="3" y="3" width="14" height="14"/>'),
    arch:SV('<rect x="3" y="4" width="14" height="4"/><path d="M4.5 8v8h11V8M8 11.5h4"/>'),
    filt:SV('<path d="M3 5h14M3 10h14M3 15h14"/><circle cx="7" cy="5" r="1.8" fill="var(--ivory,#fff)"/><circle cx="13" cy="10" r="1.8" fill="var(--ivory,#fff)"/><circle cx="8" cy="15" r="1.8" fill="var(--ivory,#fff)"/>'),
    search:SV('<circle cx="9" cy="9" r="5"/><path d="M13 13l4 4"/>')};

  return {IC,popWrap,popList,dateRange,chips,tabsRow,searchBox,presetRange,toast,openModal,askConfirm,info,viewImage,resizeImage,opts,matOpts,prodOpts,breakdown,priceLine,fullBreakdown,setCur,profitLines,priceLineFull,pct,calculated,NOT_CALC,marginText,empty,field,inp,ninp,archTag};
})();
</script>
<script>
/* ======== js/core/router.js ======== */
/* Skripo Studio · core/router.js — page registry + hash routing.
 * Notebook navigation (owner decision 2026-11-11): exactly five menu sections — Каталог · Материалы · Процессы ·
 * Калькулятор · Заказы. Other pages stay registered and routable (opened from inside sections), but are not in the menu.
 */
'use strict';
var SK = window.SK = window.SK || {};

SK.app = (function(){
  const {$}=SK.util;
  const app={
    UI:{matQ:'',matCat:'',matOnly:false,matArch:false,matSearch:false,matFilt:false,ordQ:'',ordStatus:'',prodQ:'',prodCat:'',prodSearch:false,prodFilt:false,prodArch:false},
    EST:{src:'order',id:'',qty:'1',mode:'internal'},
    PAGE:'products',PAGES:{},META:{},LISTS:{},ACT:{}
  };
  /* opts.nav: menu position (1…5) — omitted = hidden page; opts.parent: menu item highlighted for a hidden page */
  app.register=(key,title,render,opts)=>{app.PAGES[key]=[title,render];app.META[key]=opts||{}};
  app.action=(map)=>Object.assign(app.ACT,map);
  const menu=()=>Object.keys(app.PAGES).filter(k=>app.META[k].nav).sort((a,b)=>app.META[a].nav-app.META[b].nav);
  const HOME=()=>menu()[0]||'products';
  app.renderNav=()=>{
    const on=app.META[app.PAGE].nav?app.PAGE:app.META[app.PAGE].parent;
    $('#nav').innerHTML=menu().map(k=>`<a href="#${k}" class="${k===on?'on':''}">${app.PAGES[k][0]}</a>`).join('');
    const sl=$('#settingslink');if(sl)sl.classList.toggle('on',app.PAGE==='prefs');
    if(SK.footerState)SK.footerState();
  };
  app.route=()=>{const p=(app.forced||(location.hash||'').slice(1)).split('?')[0];app.forced=null;app._last=Date.now();app.UI.pop=null;app.PAGE=app.PAGES[p]&&p!=='dash'?p:HOME();document.body.dataset.page=app.PAGE;app.renderNav();app.PAGES[app.PAGE][1]();window.scrollTo(0,0);document.dispatchEvent(new Event('sk:route'))};
  app.POP={};   // optional per-key hooks: {set(v), clear()}; default writes UI[key]
  app.action({
    'pop-toggle':id=>{app.UI.pop=app.UI.pop===id?null:id;app.refresh()},
    'pop-pick':(id,a)=>{const k=a.dataset.k,h=app.POP[k];app.UI.pop=null;h&&h.set?h.set(id):(app.UI[k]=id);app.refresh()},
    'pop-clear':id=>{const h=app.POP[id];if(h&&h.clear)h.clear();else app.UI[id]='';app.UI.pop=null;app.refresh()},
    'srch-toggle':id=>{const [fl,q]=id.split('|');app.UI[fl]=!app.UI[fl];if(!app.UI[fl])app.UI[q]='';app.refresh();if(app.UI[fl]){const e=document.getElementById('srchq');if(e)e.focus()}}
  });
  document.addEventListener('click',e=>{if(app.UI.pop&&!e.target.closest('.fwrap')&&!e.target.closest('[data-act="pop-toggle"]')){app.UI.pop=null;app.refresh()}});
  app.refresh=()=>{const y=window.scrollY;app.PAGES[app.PAGE][1]();window.scrollTo(0,y)};
  /* Navigation does not depend on the address bar: some preview panes (sandboxed frames) swallow #links, so every
     in-app link goes through app.go, which tries the hash and then routes directly. */
  app.go=p=>{
    if(location.hash==='#'+p){app.route();return}
    app.forced=p;
    try{location.hash='#'+p}catch(e){}
    app.route();   // route right away; the hashchange that follows is skipped (see onHash)
  };
  app.onHash=()=>{const p=(location.hash||'').slice(1).split('?')[0];if(p===app.PAGE&&Date.now()-(app._last||0)<400)return;app.route()};
  document.addEventListener('click',e=>{
    const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey)return;
    const p=a.getAttribute('href').slice(1);if(!p||!app.PAGES[p])return;
    e.preventDefault();app.go(p);
  });
  return app;
})();
</script>
<script>
/* ======== js/modules/dashboard.js ======== */
/* Skripo Studio · modules/dashboard.js — «Обзор» */
'use strict';
(function(){
  const {$,esc,num,fmt,uah,usd,qf,today,fdate}=SK.util;
  const U=SK.ui,C=SK.costing,SC=SK.schema,A=SK.app;
  const S=()=>SK.S;

  const orderTitle=o=>esc(o.lines.map(l=>{const p=C.prodById(l.pid);return (p?p.name:'?')+((num(l.qty)||1)>1?' ×'+qf(num(l.qty)):'')}).join(', '));
  SK.orderTitle=orderTitle;

  function migrationBanner(){
    const n=SK.store.notice;if(!n)return '';
    const title=n.from===1?'Данные перенесены из Склада':'Первый запуск Skripo Studio';
    return `<div class="banner" style="display:block"><div class="row-between"><b>${title}</b><span><button class="btn sm" data-act="backup">Скачать копию</button> <button class="btn ghost sm" data-act="dismiss-notice">Скрыть</button></span></div>
      <ul class="note" style="margin:8px 0 0;padding-left:18px">${n.log.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`;
  }

  /* stage 4: production at a glance (computed by analytics, this month) */
  function productionBlock(){
    if(!SK.production.jobs().length)return '';
    const r=SK.analytics.production(SK.analytics.period('month'));
    const dev=r.planUAH?r.devUAH/r.planUAH:null;
    return `<h2>Производство</h2><div class="stats">
      <div class="stat click" data-act="go-production"><div class="k">В работе / в очереди</div><div class="v">${r.active.inWork} / ${r.active.queued}</div><div class="s">${r.active.overdue?`<span class="bad-t">просрочено ${r.active.overdue}</span>`:'просроченных нет'}</div></div>
      <div class="stat"><div class="k">Выпуск за месяц</div><div class="v">${qf(r.qty)} шт</div><div class="s">${r.jobsDone} заданий${r.cancelled.count?` · отменено ${r.cancelled.count}`:''}</div></div>
      <div class="stat"><div class="k">Факт к плану, месяц</div><div class="v ${r.devUAH>0?'bad-t':''}">${dev==null?'—':(dev>0?'+':'')+fmt(dev*100,0)+'%'}</div><div class="s">${r.jobsDone?`${r.devUAH>0?'+':''}${uah(r.devUAH)} по завершённым`:'нет завершённых заданий'}</div></div></div>`;
  }

  function render(){
    const rate=num(S().settings.rate);
    const act=S().orders.filter(o=>SC.ACTIVE.includes(o.status));
    const toGet=act.reduce((a,o)=>a+Math.max(0,C.orderTotal(o)-num(o.paidUSD)),0);
    const done=S().orders.filter(o=>o.status==='Закрыт');
    const rev=done.reduce((a,o)=>a+C.orderTotal(o),0);
    const prof=done.reduce((a,o)=>a+C.orderProfitUAH(o),0);   // each order at its own frozen rate
    const low=S().materials.filter(m=>!m.archived&&C.isLow(m));
    const days=S().settings.lastBackup?Math.floor((Date.now()-S().settings.lastBackup)/864e5):null;
    const hasData=S().materials.length||S().orders.length||S().products.some(p=>p.bom.length);
    const warn=[migrationBanner()];
    if(SK.store.memoryOnly)warn.push(`<div class="banner"><span><b>Данные не сохраняются.</b> Браузер не даёт хранилище (приватный режим?). Откройте файл в обычном окне.</span></div>`);
    if(hasData&&!SK.store.notice&&(days==null||days>=14))warn.push(`<div class="banner"><span>${days==null?'Резервной копии ещё не было.':`Последняя резервная копия — ${days} дн. назад.`} Данные лежат в браузере, их легко потерять при очистке.</span><button class="btn sm" data-act="backup">Скачать копию</button></div>`);
    $('#main').innerHTML=`
    <div class="head"><div><h1>Обзор</h1><p class="lead">Что в работе, что заканчивается и сколько зарабатывает студия.</p></div></div>
    ${warn.join('')}
    <div class="stats">
      <div class="stat"><div class="k">Активные заказы</div><div class="v">${act.length}</div><div class="s">новые, в работе, готовы, отправлены</div></div>
      <div class="stat"><div class="k">Ждём оплаты</div><div class="v">${usd(toGet)}</div><div class="s">по активным заказам</div></div>
      <div class="stat"><div class="k">Выручка, закрытые</div><div class="v">${usd(rev)}</div><div class="s">${done.length} заказ(ов)</div></div>
      <div class="stat"><div class="k">Прибыль, закрытые</div><div class="v ${prof<0?'bad-t':''}">${uah(prof)}</div><div class="s">по курсу каждого заказа · ≈ ${usd(rate?prof/rate:0)} сегодня</div></div>
    </div>
    ${productionBlock()}
    <div class="two">
      <div><h2>Открытые заказы</h2>${act.length?`<table class="t"><tbody>${act.slice().sort((a,b)=>(a.deadline||'9').localeCompare(b.deadline||'9')).slice(0,8).map(o=>`<tr class="click" data-act="edit-order" data-id="${o.id}"><td><b>${esc(o.no||'')}</b> ${esc(o.client)}</td><td>${orderTitle(o)}</td><td class="r ${o.deadline&&o.deadline<today()?'bad-t':'muted'}">${o.deadline?'до '+fdate(o.deadline):''}</td></tr>`).join('')}</tbody></table>`:U.empty('Открытых заказов нет')}</div>
      <div><h2>Нет в наличии или заканчивается</h2>${low.length?`<table class="t"><tbody>${low.slice(0,8).map(m=>`<tr class="click" data-act="edit-mat" data-id="${m.id}"><td>${esc(m.name)}</td><td class="r">${qf(num(m.stock))} ${esc(m.unit)}</td><td class="r">${m.inStock?'<span class="tag">Мало</span>':'<span class="tag bad">Нет</span>'}</td></tr>`).join('')}</tbody></table>`:U.empty(S().materials.length?'Всё есть':'Материалы ещё не добавлены')}</div>
    </div>
    ${!S().materials.length?`<div class="panel" style="margin-top:26px"><h3>С чего начать</h3><p class="note" style="margin:8px 0 0">1. Добавьте материалы (кожа, нитки, фурнитура) с ценой. 2. Откройте изделие и задайте состав: сколько чего уходит на одну штуку. 3. Курс и базовую ставку часа поставьте в «Настройках», тогда заработает себестоимость и смета.</p></div>`:''}`;
  }
  A.register('dash','Обзор',render,{});
  A.action({'dismiss-notice':()=>{SK.store.dismissNotice();A.refresh()},'go-production':()=>A.go('production')});
})();
</script>
<script>
/* ======== js/modules/materials.js ======== */
/* Skripo Studio · modules/materials.js — «Материалы» */
'use strict';
(function(){
  const {$,esc,uid,num,fmt,qf,r3,today,fdate,clone}=SK.util;
  const U=SK.ui,C=SK.costing,I=SK.inventory,SC=SK.schema,A=SK.app;
  const S=()=>SK.S,UI=A.UI;
  const {field,inp,ninp,opts}=U;

  /* shared top row for «Склад» and «Движения»: heading + section tabs, then the icon toolbar (categories on the left, actions on the right) */
  SK.matsHead=on=>`<div class="head"><div><h1>Материалы</h1></div></div>${SK.materialsTabs(on)}`;
  function catList(){
    const act=S().materials.filter(m=>UI.matArch?m.archived:!m.archived);
    const has=new Set(act.map(m=>m.cat).filter(Boolean));
    return ['',...[...new Set([...SC.CATS,...act.map(m=>m.cat).filter(Boolean)])].filter(c=>has.has(c))];
  }
  function render(){
    const nArch=S().materials.filter(m=>m.archived).length;
    if(!nArch)UI.matArch=false;   // archive emptied while viewing it → back to the active list
    const cats=catList();if(!cats.includes(UI.matCat))UI.matCat='';
    const IC=U.IC,dot=(UI.matOnly||UI.matArch)?'<i class="fdot"></i>':'';
    $('#main').innerHTML=`
    ${SK.matsHead('materials')}
    <div class="toolbar tb-icons"><div class="seg cats" id="matcats">${cats.map(c=>`<button data-act="mat-cat" data-id="${esc(c)}" class="${UI.matCat===c?'on':''}">${esc(c||'Все')}</button>`).join('')}</div>
      <button class="ib addb" data-act="new-mat" title="Новый материал" aria-label="Новый материал">${IC.plus}</button>
      ${UI.matSearch?`<input type="search" id="matQ" placeholder="Название, поставщик…" data-ui="matQ" value="${esc(UI.matQ)}">`:''}
      <button class="ib${UI.matSearch?' on':''}" data-act="mat-search" title="Поиск" aria-label="Поиск">${IC.search}</button>
      <div class="fwrap"><button class="ib${UI.matFilt?' on':''}" data-act="mat-filt" title="Фильтры" aria-label="Фильтры">${IC.filt}${dot}</button>
      ${UI.matFilt?`<div class="fpop">
        <div class="frow"><span>В наличии</span><div class="ibar"><button class="ib${UI.matOnly?' on':''}" data-act="mat-only" title="Только в наличии" aria-label="Только в наличии">${IC.check}</button></div></div>
        ${nArch?`<div class="frow"><span>Архив</span><div class="ibar"><button class="ib${UI.matArch?' on':''}" data-act="mat-arch" title="Архив (${nArch})" aria-label="Архив (${nArch})">${IC.arch}<span class="ib-n">${nArch}</span></button></div></div>`:''}
      </div>`:''}</div></div>
    <div id="list"></div>`;
    A.LISTS.materials();
    SK.fadeScroll($('#matcats'));
  }
  A.action({
    'mat-cat':id=>{UI.matCat=id;A.refresh()},
    'mat-search':()=>{UI.matSearch=!UI.matSearch;if(!UI.matSearch)UI.matQ='';A.refresh();if(UI.matSearch){const e=document.getElementById('matQ');if(e)e.focus()}},
    'mat-filt':()=>{UI.matFilt=!UI.matFilt;A.refresh()},
    'mat-only':()=>{UI.matOnly=!UI.matOnly;A.refresh()},
    'mat-arch':()=>{UI.matArch=!UI.matArch;A.refresh()}
  });
  document.addEventListener('click',e=>{if(UI.matFilt&&A.PAGE==='materials'&&!e.target.closest('.fwrap')){UI.matFilt=false;A.refresh()}});
  /* horizontal scroll row: a soft fade on the right edge while there is more to scroll to */
  SK.fadeScroll=el=>{if(!el)return;const upd=()=>el.classList.toggle('more',el.scrollWidth-el.clientWidth-el.scrollLeft>4);el.addEventListener('scroll',upd,{passive:true});upd();
    const on=el.querySelector('.on');if(on&&el.scrollWidth>el.clientWidth)on.scrollIntoView({inline:'center',block:'nearest'});upd()};
  A.LISTS.materials=()=>{
    const q=UI.matQ.toLowerCase();
    const a=S().materials.filter(m=>(UI.matArch?m.archived:!m.archived)&&(!UI.matCat||m.cat===UI.matCat)&&(!UI.matOnly||m.inStock)&&(!q||[m.name,m.supplier,m.note,m.cat].join(' ').toLowerCase().includes(q))).sort((x,y)=>x.name.localeCompare(y.name,'ru'));
    $('#list').innerHTML=a.length?`<table class="t stack mats"><colgroup><col style="width:68px"><col><col style="width:130px"><col style="width:140px"><col style="width:150px"><col style="width:130px"><col style="width:120px"><col style="width:170px"></colgroup>
      <thead><tr><th></th><th>Материал</th><th>Категория</th><th>Поставщик</th><th class="r">Цена</th><th class="r">Учётная цена</th><th class="r">Остаток</th><th>Статус</th></tr></thead><tbody>${a.map(matRow).join('')}</tbody></table>`:
      U.empty(S().materials.length?'Ничего не найдено':'Материалов пока нет',S().materials.length?'':`<br><button class="btn" data-act="new-mat">+ Добавить первый материал</button>`);
  };
  /* «Ателье»: materials as a hairline table (row opens the editor; the stock checkbox toggles «в наличии» in place) */
  function matRow(m){
    const cur=m.cur==='USD'?'$':'₴',ph=m.photoIds[0]&&SK.store.photoURL(m.photoIds[0]),low=C.isLow(m);
    const st=!m.inStock?'<span class="tag bad">нет</span>':low&&num(m.minStock)>0?`<span class="tag bad">мало · мин. ${qf(num(m.minStock))}</span>`:'<span class="tag good">в наличии</span>';
    return `<tr class="click${m.archived?' archived':''}" data-act="edit-mat" data-id="${m.id}">
      <td>${ph?`<img class="pthumb" src="${ph}" alt="">`:'<span class="pthumb" style="display:block;background:var(--tile)"></span>'}</td>
      <td>${esc(m.name)}${U.archTag(m)}${m.note?`<div class="note">${esc(m.note)}</div>`:''}</td><td class="note">${esc((m.cat||'').toLowerCase())}</td><td class="note">${esc(m.supplier||'—')}</td>
      <td class="r">${num(m.price)?`${fmt(num(m.price),2)} ${cur} / ${esc(m.unit)}`:'<span class="muted">—</span>'}</td>
      <td class="r note">${m.avgCostUAH!=null?SK.util.uah(num(m.avgCostUAH)):'—'}</td>
      <td class="r ${low?'bad-t':''}">${qf(num(m.stock))} ${esc(m.unit)}</td>
      <td><label class="chk" data-stop><input type="checkbox" data-chg="toggle-stock" data-id="${m.id}" ${m.inStock?'checked':''}> ${st}</label></td></tr>`;
  }
  function matCard(m){
    const cur=m.cur==='USD'?'$':'₴',ph=m.photoIds[0]&&SK.store.photoURL(m.photoIds[0]);
    return `<article class="mcard${m.archived?' archived':''}" data-act="edit-mat" data-id="${m.id}">
    <div class="ph">${ph?`<img src="${ph}" alt="">`:esc((m.name||'?').slice(0,1))}</div>
    <div class="mc-b"><div class="mc-cat">${esc(m.cat||'')}${U.archTag(m)}</div><h3>${esc(m.name)}</h3><div class="mc-sup">${esc(m.supplier||'')}</div>
    <div class="mc-row"><span>${num(m.price)?`<b>${fmt(num(m.price),2)} ${cur}</b> / ${esc(m.unit)}`:'<span class="muted">цена не задана</span>'}</span>
    <span class="${C.isLow(m)?'bad-t':''}">${qf(num(m.stock))} ${esc(m.unit)}</span></div>
    <label class="chk" data-stop><input type="checkbox" data-chg="toggle-stock" data-id="${m.id}" ${m.inStock?'checked':''}> в наличии</label></div></article>`;
  }

  /* stage 2b: accounting cost (weighted average from the ledger) and the latest moves — read-only */
  function costLine(d){
    const stored=C.matById(d.id),avg=stored&&stored.avgCostUAH;
    if(avg==null)return `<div class="note">Учётная себестоимость появится после первого прихода (остаток или закупка). До этого в расчётах используется цена за ед.</div>`;
    return `<div class="note">Учётная себестоимость (средняя по складу): <b>${SK.util.uah(num(avg))}</b> / ${esc(d.unit)} — используется в расчётах изделий и заказов. Цена за ед. выше — последняя закупочная; ручная правка цены себестоимость имеющегося остатка не меняет.</div>`;
  }
  function movesBlock(d){
    const mv=I.movesOf(d.id).slice(-5).reverse();
    return `<div class="sec">Движения по складу</div>
    ${mv.length?`<table class="t mini"><tbody>${mv.map(x=>`<tr><td>${fdate(x.date)}</td><td>${esc(SC.MOVE_TYPES[x.type]||x.type)}${x.ref&&x.ref.no?' · '+esc(x.ref.no):''}</td><td class="r ${num(x.qty)<0?'bad-t':''}">${num(x.qty)>0?'+':''}${qf(num(x.qty))} ${esc(d.unit)}</td><td class="r">${x.unitCostUAH==null?'—':SK.util.uah(num(x.unitCostUAH))}</td></tr>`).join('')}</tbody></table>`:'<div class="note">Движений пока нет.</div>'}
    <div><button class="btn ghost sm" data-act="stock-of">Весь журнал по материалу</button></div>`;
  }

  function editMaterial(id){
    const isNew=!id;
    const draft=isNew?{id:uid(),name:'',cat:'Кожа',unit:'дм²',price:'',cur:'UAH',supplier:'',source:'',note:'',stock:'',minStock:'',inStock:true,photoIds:[],purchases:[],archived:false,buy:{}}:Object.assign(clone(C.matById(id)),{buy:{}});
    if(!draft.buy.date)draft.buy={date:today(),qty:'',total:'',cur:draft.cur||'UAH',upd:true};
    openForm(draft,isNew);
  }
  function openForm(draft,isNew){
    U.openModal({title:isNew?'Новый материал':'Материал',wide:true,draft,saveLabel:isNew?'Добавить':'Сохранить',
      body:d=>`
      ${d.archived?'<div class="banner"><span>Материал в архиве: не предлагается в новых составах и заказах, но сохранён в истории.</span></div>':''}
      <div class="grid g-a">${field('Название',inp('name',d.name,'placeholder="Например: Кожа Conceria, коньяк"'))}
        ${field('Категория',`<input type="text" list="cats" data-f="cat" value="${esc(d.cat)}"><datalist id="cats">${SC.CATS.map(c=>`<option>${esc(c)}`).join('')}</datalist>`)}
        ${field('Единица',`<select data-f="unit">${opts(SC.UNITS,d.unit)}</select>`)}</div>
      <div class="grid g4">${field('Цена за ед.',ninp('price',d.price))}${field('Валюта',`<select data-f="cur">${opts(['UAH','USD'],d.cur)}</select>`)}
        ${field('Остаток',ninp('stock',d.stock))}${field('Мин. остаток',ninp('minStock',d.minStock,'placeholder="для подсказки"'))}</div>
      ${costLine(d)}
      <div class="grid g2">${field('Поставщик',inp('supplier',d.supplier))}${field('Источник (ссылка или где купить)',inp('source',d.source))}</div>
      <div class="grid g2">${field('Заметка (цвет, толщина, партия)',`<textarea data-f="note">${esc(d.note)}</textarea>`)}
        <div style="display:flex;align-items:flex-end"><label class="chk"><input type="checkbox" data-f="inStock" ${d.inStock?'checked':''}> Сейчас есть в наличии</label></div></div>
      <div class="sec">Фото</div>
      <div class="thumbs">${d.photoIds.map((pid,i)=>{const u=SK.store.photoURL(pid);return `<div class="thumb" data-zoom="${u}"><img src="${u}" alt=""><button data-act="rmphoto" data-i="${i}" title="Удалить">×</button></div>`}).join('')}
        <button class="addph" data-act="addphoto">+ фото</button><input type="file" accept="image/*" multiple hidden data-photo></div>
      <div class="sec">Закупки</div>
      <div class="grid buygrid">
        ${field('Дата',`<input type="date" data-f="buy.date" value="${esc(d.buy.date)}">`)}${field('Кол-во',ninp('buy.qty',d.buy.qty))}${field('Сумма всего',ninp('buy.total',d.buy.total))}
        ${field('Валюта',`<select data-f="buy.cur">${opts(['UAH','USD'],d.buy.cur)}</select>`)}<button class="btn ghost" data-act="addbuy">Записать</button></div>
      <label class="chk"><input type="checkbox" data-f="buy.upd" ${d.buy.upd?'checked':''}> закупка обновляет цену за единицу и добавляет остаток</label>
      ${d.purchases.length?`<table class="t mini"><thead><tr><th>Дата</th><th class="r">Кол-во</th><th class="r">Сумма</th><th class="r">За ед.</th><th></th></tr></thead><tbody>${d.purchases.map((p,i)=>`<tr><td>${fdate(p.date)}</td><td class="r">${qf(num(p.qty))} ${esc(d.unit)}</td><td class="r">${fmt(num(p.total),2)} ${p.cur==='USD'?'$':'₴'}</td><td class="r">${num(p.qty)?fmt(num(p.total)/num(p.qty),2):'—'}</td><td class="r"><button class="linkbtn" data-act="rmbuy" data-i="${i}">удалить</button></td></tr>`).join('')}</tbody></table>`:'<div class="note">Закупок пока не записано.</div>'}
      ${isNew?'':movesBlock(d)}`,
      extra:d=>{
        if(isNew)return '';
        const can=I.canDelete('material',d.id).ok;
        return (d.archived?`<button class="btn ghost sm" data-act="unarchive">Вернуть из архива</button>`:`<button class="btn ghost sm" data-act="archive">В архив</button>`)+
          (can?`<button class="btn danger" data-act="del" style="margin-left:14px">Удалить</button>`:'');
      },
      onAction:async(act,b,d,draw,close)=>{
        if(act==='stock-of'){close();A.ACT['stock-of'](d.id)}
        else if(act==='rmphoto'){d.photoIds.splice(+b.dataset.i,1);draw()}
        else if(act==='rmbuy'){d.purchases.splice(+b.dataset.i,1);draw()}
        else if(act==='addbuy'){
          const q=num(d.buy.qty),t=num(d.buy.total);
          if(!q||!t){U.toast('Укажите количество и сумму');return}
          d.purchases.unshift({id:uid(),date:d.buy.date||today(),qty:q,total:t,cur:d.buy.cur,rate:d.buy.cur==='USD'?num(S().settings.rate):null,applied:!!d.buy.upd});
          if(d.buy.upd){d.price=String(Math.round(t/q*100)/100);d.cur=d.buy.cur;d.stock=String(r3(num(d.stock)+q));d.inStock=true}
          d.buy.qty='';d.buy.total='';draw();U.toast('Закупка записана, не забудьте «Сохранить»');
        }
        else if(act==='archive'||act==='unarchive'){
          I.setArchived('material',d.id,act==='archive');SK.store.save();close();A.refresh();
          U.toast(act==='archive'?'Материал в архиве':'Материал возвращён из архива');
        }
        else if(act==='del'){
          const r=I.canDelete('material',d.id);
          if(!r.ok){U.info('Удаление невозможно','Материал используется в изделиях, заказах или журнале склада. Его можно только отправить в архив.');return}
          if(await U.askConfirm('Удалить материал? Он нигде не используется.','Удалить')){I.remove('material',d.id);SK.store.save();close();A.refresh()}
        }
      },
      onSave:d=>{
        if(!d.name.trim()){U.toast('Укажите название');return false}
        const {buy,...m}=d;m.name=m.name.trim();m.cat=(m.cat||'Другое').trim();
        const i=S().materials.findIndex(x=>x.id===m.id);const prev=i>=0?clone(S().materials[i]):null;
        if(i>=0)S().materials[i]=m;else S().materials.push(m);
        I.afterMaterialSave(prev,m);
        SK.store.save();A.refresh();
      }});
  }

  /* section tabs: Склад (cards) · Движения (stock ledger page) */
  SK.materialsTabs=on=>`<div class="seg tabs">${[['materials','Склад'],['stock','Движения']].map(([k,t])=>`<a href="#${k}" class="${on===k?'on':''}">${t}</a>`).join('')}</div>`;
  A.register('materials','Материалы',render,{nav:2});
  A.action({'new-mat':()=>editMaterial(),'edit-mat':id=>editMaterial(id)});
  SK.editMaterial=editMaterial;
})();
</script>
<script>
/* ======== js/modules/stock.js ======== */
/* Skripo Studio · modules/stock.js — «Журнал склада»: all stock moves, filters, stock value (read-only) */
'use strict';
(function(){
  const {$,esc,num,fmt,uah,qf,fdate}=SK.util;
  const U=SK.ui,C=SK.costing,I=SK.inventory,SC=SK.schema,A=SK.app;
  const S=()=>SK.S,UI=A.UI;
  Object.assign(UI,{stMid:UI.stMid||'',stType:UI.stType||'',stFrom:UI.stFrom||'',stTo:UI.stTo||''});

  const refText=mv=>{
    if(!mv.ref)return '';
    if(mv.ref.orderId){const o=S().orders.find(x=>x.id===mv.ref.orderId);return `<button class="linkbtn" data-act="edit-order" data-id="${esc(mv.ref.orderId)}">${esc((o&&o.no)||mv.ref.no||'заказ')}</button>`}
    if(mv.ref.purchaseId)return 'закупка';
    return '';
  };

  function render(){
    const mats=S().materials.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru'));
    const bad=I.ledgerMismatches();
    $('#main').innerHTML=`
    ${SK.matsHead('stock')}
    ${bad.length?`<div class="banner"><span><b>Расхождение журнала и остатка:</b> ${bad.map(m=>esc(m.name)).join(', ')}. Сообщите разработчику, данные не исправляются автоматически.</span></div>`:''}
    <div class="toolbar tb-icons">${U.tabsRow('st-type',[['','Все'],...Object.entries(SC.MOVE_TYPES)],UI.stType,'sttabs')}
      ${U.popWrap('stMid',U.IC.box,'Материал',U.popList('stMid',[['','Все материалы'],...mats.map(m=>[m.id,m.name+(m.archived?' · архив':'')])],UI.stMid),!!UI.stMid)}
      ${U.popWrap('stPer',U.IC.cal,'Период',U.popList('stPer',[['all','Всё время'],['30','Последние 30 дней'],['month','Этот месяц'],['year','Этот год']],'')+`<div class="pdiv"></div>`+U.dateRange('stFrom','stTo',UI.stFrom,UI.stTo),!!(UI.stFrom||UI.stTo))}
    </div>
    <div id="chips"></div>
    <div id="list"></div>`;
    A.LISTS.stock();SK.fadeScroll($('#sttabs'));
  }
  A.LISTS.stock=()=>{
    const mm0=UI.stMid&&C.matById(UI.stMid);
    $('#chips').innerHTML=U.chips([...(mm0?[['stMid',mm0.name]]:[]),...((UI.stFrom||UI.stTo)?[['stPer',`${fdate(UI.stFrom)||'…'} — ${fdate(UI.stTo)||'…'}`]]:[])]);
    const list=S().stockMoves.filter(x=>(!UI.stMid||x.mid===UI.stMid)&&(!UI.stType||x.type===UI.stType)&&(!UI.stFrom||x.date>=UI.stFrom)&&(!UI.stTo||x.date<=UI.stTo));
    let inc=0,out=0;list.forEach(x=>{const s=num(x.qty)*num(x.unitCostUAH);if(num(x.qty)>0)inc+=s;else out-=s});
    const m=UI.stMid?C.matById(UI.stMid):null;
    const value=m?(m.avgCostUAH==null?0:Math.max(num(m.stock),0)*num(m.avgCostUAH)):I.stockValue();
    const stats=`<div class="stats" style="margin-bottom:18px">
      <div class="stat"><div class="k">Стоимость остатков</div><div class="v">${uah(value)}</div><div class="s">${m?`${qf(num(m.stock))} ${esc(m.unit)} × ${m.avgCostUAH==null?'—':uah(num(m.avgCostUAH))}`:'по средней себестоимости'}</div></div>
      <div class="stat"><div class="k">Приход</div><div class="v">${uah(inc)}</div><div class="s">в выборке</div></div>
      <div class="stat"><div class="k">Расход</div><div class="v">${uah(out)}</div><div class="s">в выборке</div></div>
      <div class="stat"><div class="k">Движений</div><div class="v">${list.length}</div><div class="s">из ${S().stockMoves.length}</div></div></div>`;
    const rows=list.slice().reverse();   // newest first
    $('#list').innerHTML=(rows.length?`<table class="t stack"><thead><tr><th>Дата</th><th>Материал</th><th>Операция</th><th class="r">Кол-во</th><th class="r">Цена за ед.</th><th class="r">Сумма</th><th>Основание</th></tr></thead><tbody>${rows.map(x=>{
      const mm=C.matById(x.mid),q=num(x.qty),sum=q*num(x.unitCostUAH);
      return `<tr><td>${fdate(x.date)}</td><td>${mm?`<button class="linkbtn" data-act="edit-mat" data-id="${mm.id}">${esc(mm.name)}</button>`:'(материал удалён)'}</td>
      <td>${esc(SC.MOVE_TYPES[x.type]||x.type)}${x.note?`<div class="note">${esc(x.note)}</div>`:''}</td>
      <td class="r ${q<0?'bad-t':'good-t'}">${q>0?'+':''}${qf(q)} ${esc(mm?mm.unit:'')}</td>
      <td class="r">${x.unitCostUAH==null?'—':fmt(num(x.unitCostUAH),2)}</td><td class="r">${x.unitCostUAH==null?'—':uah(sum)}</td><td>${refText(x)}</td></tr>`}).join('')}</tbody></table>`:U.empty('Движений нет'));
  };

  A.register('stock','Движения материалов',render,{parent:'materials'});
  A.POP.stPer={set:v=>{[UI.stFrom,UI.stTo]=U.presetRange(v)},clear:()=>{UI.stFrom='';UI.stTo=''}};
  A.action({'st-type':id=>{UI.stType=id;A.refresh()}});
  A.action({'stock-of':id=>{UI.stMid=id;UI.stType='';UI.stFrom='';UI.stTo='';A.go('stock')}});
})();
</script>
<script>
/* ======== js/modules/products.js ======== */
/* Skripo Studio · modules/products.js — «Каталог»: products, photos, specification, route, cost; order from a card */
'use strict';
(function(){
  const {$,esc,uid,num,r3,clone}=SK.util;
  const U=SK.ui,C=SK.costing,I=SK.inventory,SC=SK.schema,A=SK.app;
  const S=()=>SK.S,UI=A.UI;
  const {field,inp,ninp,opts}=U;

  if(!UI.prodView)UI.prodView='grid';
  /* photo size in the card view: 'l' large (default, 176 px) · 's' small (~112 px); remembered per browser */
  const sizeKey='skripo_catalog_size';
  if(!UI.prodSize){let v='l';try{v=localStorage.getItem(sizeKey)==='s'?'s':'l'}catch(e){}UI.prodSize=v}
