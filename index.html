  /* own price, else the recommended price rounded to $5 (same formula as before when there are no expense items) */
  function calcPrice(){
    const c=S().calc;if(num(c.price))return num(c.price);
    return calcFull(c).rec.round5||0;
  }
  SK.calc={cur,render:calcResult,load:calcLoad,price:calcPrice,cost:calcCost};

  A.register('calc','Калькулятор',render,{nav:4});
  A.action({
    'calc-cur':()=>{A.UI.calcCur=cur()==='USD'?'UAH':'USD';A.refresh()},
    'calc-add-comp':()=>{S().calc.comp.push({mid:'',qty:''});SK.store.save();A.refresh()},
    'calc-rm-comp':(_i,b)=>{S().calc.comp.splice(+b.dataset.i,1);SK.store.save();A.refresh()},
    'calc-add-other':()=>{S().calc.other.push({name:'',uah:''});SK.store.save();A.refresh()},
    'calc-rm-other':(_i,b)=>{S().calc.other.splice(+b.dataset.i,1);SK.store.save();A.refresh()},
    'calc-reset':()=>{S().calc=SK.schema.emptyCalc();SK.store.save();A.refresh()},
    'calc-est':()=>{A.EST.src='calc';A.go('estimate')},
    'calc-apply-price':()=>{const p=C.prodById(S().calc.pid);if(!p)return;const v=calcPrice();if(!v){U.toast('Нет цены');return}p.priceUSD=String(v);SK.store.save();U.toast('Цена записана: '+usd(v));A.refresh()},
    'calc-save-prod':()=>{
      const c=S().calc;
      U.openModal({title:'Сохранить как изделие',draft:{name:''},saveLabel:'Сохранить',body:d=>field('Название изделия',U.inp('name',d.name)),
        onSave:d=>{
          if(!d.name.trim()){U.toast('Укажите название');return false}
          S().products.push({id:uid(),name:d.name.trim(),size:'',status:'В разработке',category:'',color:'',construction:'',hardware:'',materialNote:'',
            priceUSD:String(calcPrice()||''),images:[],photoIds:[],bom:clone(c.comp).filter(x=>x.mid),route:C.routeFromHours(c.hours),other:clone(c.other),notes:'',archived:false,origin:{calc:true}});
          SK.store.save();U.toast('Изделие добавлено');
        }});
    }
  });
})();
</script>
<script>
/* ======== js/modules/estimate.js ======== */
/* Skripo Studio · modules/estimate.js — «Смета» (internal with cost / client version in Ukrainian) */
'use strict';
(function(){
  const {$,esc,num,fmt,uah,usd,qf,today,fdate}=SK.util;
  const U=SK.ui,C=SK.costing,A=SK.app;
  const S=()=>SK.S,EST=A.EST;

  function estData(){
    const rate=num(S().settings.rate);
    if(EST.src==='order'){
      const o=S().orders.find(x=>x.id===EST.id);if(!o)return null;
      return {no:o.no,date:o.date,client:o.client,contact:[o.phone,o.contact].filter(Boolean).join(' · '),paid:num(o.paidUSD),isOrder:true,snap:o.plan?o.plan.totalUAH:null,deadline:o.deadline,
        rate:C.orderRate(o),rateFrozen:!!(o.rateSnap&&o.rateSnap.frozen),
        items:o.lines.map(l=>{const p=C.prodById(l.pid),q=num(l.qty)||1;return {name:p?p.name:'(изделие удалено)',size:p?p.size:'',note:l.note,qty:q,price:num(l.priceUSD),cost:C.orderLineCost(l)}})};
    }
    if(EST.src==='product'){
      const p=C.prodById(EST.id);if(!p)return null;const q=num(EST.qty)||1;
      return {no:'',date:today(),client:'',rate,items:[{name:p.name,size:p.size,note:'',qty:q,price:num(p.priceUSD),cost:C.prodCost(p,q)}]};
    }
    const c=S().calc,q=num(c.qty)||1,base=c.pid?C.prodById(c.pid):null;
    return {no:'',date:today(),client:'',rate,items:[{name:base?base.name:'Расчёт',size:base?base.size:'',note:'',qty:q,price:SK.calc.price(),cost:SK.calc.cost(c,q)}]};
  }
  function render(){
    const d=estData();
    const orderSel=`<option value="">— выбрать заказ —</option>`+S().orders.slice().sort((a,b)=>(b.no||'').localeCompare(a.no||'')).map(o=>`<option value="${o.id}" ${o.id===EST.id?'selected':''}>${esc(o.no)} · ${esc(o.client)}</option>`).join('');
    $('#main').innerHTML=`
    <div class="head no-print"><div><h1>Смета</h1><p class="lead">Внутренняя смета показывает себестоимость и маржу. Версия для клиента — только изделия и цены.</p></div><span><button class="btn ghost" data-act="est-back">← Назад</button> <button class="btn ghost" data-act="est-copy">Скопировать для клиента</button> <button class="btn" data-act="print">Печать / PDF</button></span></div>
    <div class="est-ctl no-print">
      <div class="seg" id="estsrc">${[['order','Заказ'],['product','Изделие'],['calc','Калькулятор']].map(([k,t])=>`<button data-act="est-src" data-id="${k}" class="${EST.src===k?'on':''}">${t}</button>`).join('')}</div>
      ${EST.src==='order'?`<label class="f">Заказ<select data-est="id">${orderSel}</select></label>`:''}
      ${EST.src==='product'?`<label class="f">Изделие<select data-est="id">${U.prodOpts(EST.id)}</select></label><label class="f" style="min-width:90px">Шт.<input type="text" inputmode="decimal" data-est="qty" value="${esc(EST.qty)}"></label>`:''}
      <div class="seg">${[['internal','С себестоимостью'],['client','Для клиента']].map(([k,t])=>`<button data-act="est-mode" data-id="${k}" class="${EST.mode===k?'on':''}">${t}</button>`).join('')}</div>
    </div>
    <div id="estdoc">${doc(d)}</div>`;
  }
  const doc=d=>d?(EST.mode==='client'?clientDoc(d):internalDoc(d)):U.empty('Выберите заказ или изделие');
  function internalDoc(d){
    const rate=d.rate;let cost=0,rev=0;
    const blocks=d.items.map(it=>{
      const c=it.cost;cost+=c.total;rev+=it.price*it.qty;
      const rows=c.rows.map(r=>`<tr><td>${esc(r.name)}${r.subbed?' <span class="note">(замена)</span>':''}</td><td class="r">${qf(r.qty)} ${esc(r.unit)}</td><td class="r">${r.missing?'—':fmt(r.price,2)}</td><td class="r">${r.missing?'—':uah(r.sum)}</td></tr>`).join('');
      const extra=[c.labor||c.hours?`<tr><td>Работа</td><td class="r">${qf(c.hours)} ч</td><td class="r">${fmt(num(S().settings.hourRate),2)}</td><td class="r">${uah(c.labor)}</td></tr>`:'',
        ...c.oth.map(o=>`<tr><td>${esc(o.name)}</td><td class="r"></td><td class="r"></td><td class="r">${uah(o.sum)}</td></tr>`),
        c.overhead?`<tr><td>Накладные ${fmt(num(S().settings.overhead),0)}%</td><td></td><td></td><td class="r">${uah(c.overhead)}</td></tr>`:''].join('');
      const pu=it.price*it.qty*rate;
      return `<section class="blk"><h3><span style="color:var(--graphite);font-weight:600">${esc(it.name)}${it.size?' · '+esc(it.size)+' см':''}</span><span>× ${qf(it.qty)}</span></h3>${it.note?`<div class="note" style="margin:6px 0">${esc(it.note)}</div>`:''}
      <table class="t"><thead><tr><th>Статья</th><th class="r">Кол-во</th><th class="r">Цена, ₴</th><th class="r">Сумма</th></tr></thead><tbody>${rows}${extra}
      <tr><td colspan="3"><b>Себестоимость позиции</b></td><td class="r"><b>${uah(c.total)}</b></td></tr>
      <tr><td colspan="3">Цена продажи ${usd(it.price)} × ${qf(it.qty)}</td><td class="r">${usd(it.price*it.qty)} ≈ ${uah(pu)}</td></tr></tbody></table></section>`;
    }).join('');
    const pu=rev*rate,m=C.margin(pu,cost);
    return `<div class="doc">${docHead(d,'Смета · внутренняя')}${d.client?`<div style="margin-bottom:20px"><b>${esc(d.client)}</b>${d.contact?' · '+esc(d.contact):''}</div>`:''}${blocks}
    <div class="totals"><div class="sum"><span>Себестоимость итого</span><span>${uah(cost)}</span></div>${d.snap!=null&&Math.abs(d.snap-cost)>1?`<div class="sum"><span>Зафиксировано при списании</span><span>${uah(d.snap)}</span></div>`:''}
    <div class="sum"><span>Цена продажи итого</span><span>${usd(rev)} ≈ ${uah(pu)}</span></div>
    <div class="sum"><span>Прибыль</span>${U.calculated(cost)?`<span class="${pu-cost<0?'bad-t':''}">${uah(pu-cost)}</span>`:U.NOT_CALC}</div>
    <div class="sum total"><span>Маржа</span><span>${U.marginText(m,cost)}</span></div>
    ${d.isOrder?`<div class="sum" style="margin-top:8px"><span>Оплачено</span><span>${usd(d.paid)}</span></div><div class="sum"><span>Осталось получить</span><span>${usd(Math.max(0,rev-d.paid))}</span></div>`:''}</div>
    <div class="foot">${d.isOrder?(d.rateFrozen?'Курс заказа (зафиксирован)':'Курс заказа (текущий)'):'Курс'} ${fmt(rate,2)} ₴/$. Себестоимость позиций по текущим ценам материалов.</div></div>`;
  }
  function clientDoc(d){
    const rev=d.items.reduce((a,i)=>a+i.price*i.qty,0);
    return `<div class="doc">${docHead(d,'Кошторис','uk')}${d.client?`<div style="margin-bottom:20px">Клієнт: <b>${esc(d.client)}</b></div>`:''}
    <table class="t"><thead><tr><th>Виріб</th><th class="r">К-сть</th><th class="r">Ціна</th><th class="r">Сума</th></tr></thead><tbody>${d.items.map(it=>`<tr><td><b>${esc(it.name)}</b>${it.size?` <span class="note">${esc(it.size)} см</span>`:''}${it.note?`<div class="note">${esc(it.note)}</div>`:''}</td><td class="r">${qf(it.qty)}</td><td class="r">${it.price?usd(it.price):'—'}</td><td class="r">${it.price?usd(it.price*it.qty):'—'}</td></tr>`).join('')}</tbody></table>
    <div class="totals"><div class="sum total"><span>Разом</span><span>${usd(rev)}</span></div>
    ${d.isOrder&&d.paid?`<div class="sum"><span>Передоплата</span><span>${usd(d.paid)}</span></div><div class="sum"><span>До сплати</span><span>${usd(Math.max(0,rev-d.paid))}</span></div>`:''}</div>
    <div class="foot">Оплата після підтвердження замовлення.${d.deadline?` Орієнтовна дата готовності: ${fdate(d.deadline)}.`:''}</div></div>`;
  }

  /* plain-text client estimate (Ukrainian) for pasting into a DM; always the client version, whatever mode is on screen */
  function clientText(d){
    const rev=d.items.reduce((a,i)=>a+i.price*i.qty,0);
    const L=[`Кошторис${d.no?' '+d.no:''} від ${fdate(d.date)}`];
    if(d.client)L.push(`Клієнт: ${d.client}`);
    L.push('');
    d.items.forEach(it=>L.push(`${it.name}${it.size?` (${it.size} см)`:''}${it.note?`, ${it.note}`:''}: ${qf(it.qty)} × ${it.price?usd(it.price):'—'}${it.price?` = ${usd(it.price*it.qty)}`:''}`));
    L.push('',`Разом: ${usd(rev)}`);
    if(d.isOrder&&d.paid)L.push(`Передоплата: ${usd(d.paid)}`,`До сплати: ${usd(Math.max(0,rev-d.paid))}`);
    L.push('','Оплата після підтвердження замовлення.');
    if(d.deadline)L.push(`Орієнтовна дата готовності: ${fdate(d.deadline)}.`);
    return L.join('\n');
  }
  async function copyText(t){
    try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true}}catch(_){}
    try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return !!ok}catch(_){return false}
  }
  SK.estimateClientText=clientText;
  SK.renderEstimateDoc=()=>{$('#estdoc').innerHTML=doc(estData())};

  A.register('estimate','Смета',render,{});
  A.action({'est-copy':async()=>{
    const d=estData();if(!d){U.toast('Выберите заказ или изделие');return}
    const t=clientText(d);
    if(await copyText(t)){U.toast('Текст сметы скопирован');return}
    /* clipboard blocked (e.g. inside the artifact frame): show the text selected, ready for manual copy */
    U.openModal({title:'Текст сметы для клиента',draft:{},noSave:true,cancel:'Закрыть',body:()=>`<div class="note">Автокопирование здесь недоступно. Выделите текст и скопируйте (Ctrl+C / «Копировать»).</div><textarea id="esttext" readonly style="min-height:260px">${esc(t)}</textarea>`});
    setTimeout(()=>{const x=document.getElementById('esttext');if(x){x.focus();x.select()}},60);

})();

<script>
/* ======== js/modules/reports.js ======== */
/* Skripo Studio · modules/reports.js — «Отчёты»: economics · production · materials · orders (read-only views) */
'use strict';
(function(){
  const {$,esc,num,fmt,uah,usd,qf,r3,fdate}=SK.util;
  const U=SK.ui,AN=SK.analytics,SC=SK.schema,A=SK.app;
  const S=()=>SK.S,UI=A.UI;
  Object.assign(UI,{repTab:UI.repTab||'econ',repPer:UI.repPer||'month',repFrom:UI.repFrom||'',repTo:UI.repTo||''});

  const pct=U.pct;
  const NA='<span class="muted">Недостаточно данных</span>';
  const stat=(k,v,s,cls='')=>`<div class="stat"><div class="k">${k}</div><div class="v ${cls}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
  const bar=(v,max,cls='')=>`<div class="rbar"><span class="${cls}" style="width:${max>0?Math.min(100,Math.abs(v)/max*100):0}%"></span></div>`;
  const devCell=(f,p)=>{if(f==null||p==null)return '—';const d=f-p;if(Math.abs(d)<0.005)return '0';return `<span class="${d>0?'bad-t':'good-t'}">${d>0?'+':''}${uah(d)}${p?` (${d>0?'+':''}${fmt(d/p*100,0)}%)`:''}</span>`};
  const minDev=(f,p)=>{if(!p)return '—';const d=f-p;return `<span class="${d>0?'bad-t':d<0?'good-t':''}">${d>0?'+':''}${fmt(d/p*100,0)}%</span>`};
  const per=()=>AN.period(UI.repPer,UI.repFrom,UI.repTo);

  function render(){
    const tabs=[['econ','Экономика'],['prod','Производство'],['mat','Материалы'],['ord','Заказы']];
    const pers=[['month','Этот месяц'],['prev','Прошлый месяц'],['quarter','Квартал'],['year','Год'],['all','Всё время'],['custom','Свой период']];
    $('#main').innerHTML=`
    <div class="head"><div><h1>Отчёты</h1><p class="lead">Аналитика по существующим данным и историческим снимкам. Факт, план и норматив не смешиваются; отмены — отдельно.</p></div><button class="btn ghost no-print" data-act="print">Печать / PDF</button></div>
    <div class="toolbar tb-icons no-print">${U.tabsRow('rep-tab',tabs,UI.repTab,'reptabs')}
      ${U.popWrap('repPer',U.IC.cal,'Период',U.popList('repPer',pers,UI.repPer)+(UI.repPer==='custom'?`<div class="pdiv"></div>`+U.dateRange('repFrom','repTo',UI.repFrom,UI.repTo):''),false)}</div>
    <div id="chips"></div>
    <div id="list"></div>`;
    A.LISTS.reports();SK.fadeScroll($('#reptabs'));
  }
  A.POP.repPer={set:v=>{UI.repPer=v;if(v==='custom')UI.pop='repPer'}};   // «Свой период» keeps the menu open for the dates
  A.LISTS.reports=()=>{
    const p=per(),pn=({month:'Этот месяц',prev:'Прошлый месяц',quarter:'Квартал',year:'Год',all:'Всё время',custom:'Свой период'})[UI.repPer];
    $('#chips').innerHTML=U.chips([['',pn+(p.from||p.to?` · ${fdate(p.from)||'…'} — ${fdate(p.to)||'…'}`:'')]]);
    $('#list').innerHTML=({econ,prod,mat,ord})[UI.repTab](p);
  };

  /* ---------- losses block (shared) ---------- */
  function lossBlock(L){
    const t=L.total;
    if(!L.orders.length&&!L.jobs.length)return `<h2>Отмены и потери</h2>${U.empty('Потерь от отмен за период нет')}`;
    const rows=[...L.orders.map(x=>({label:`Заказ ${esc(x.no)} · ${esc(x.client)} (отменён)`,...x})),...L.jobs.map(x=>({label:`Задание ${esc(x.no)} · ${esc(x.name)}${x.orderNo?' · заказ '+esc(x.orderNo):''}${x.reason?` <span class="note">— ${esc(x.reason)}</span>`:''}`,...x}))];
    return `<h2>Отмены и потери</h2>
    <table class="t stack"><thead><tr><th></th><th class="r">Материалы</th><th class="r">Труд</th><th class="r">Прочие</th><th class="r">Накладные</th><th class="r">Потери</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r.label}</td><td class="r">${uah(r.mat)}</td><td class="r">${uah(r.labor)}</td><td class="r">${uah(r.other)}</td><td class="r">${uah(r.overhead)}</td><td class="r"><b>${uah(r.total)}</b></td></tr>`).join('')}
    <tr><td><b>Итого потерь</b></td><td class="r">${uah(t.mat)}</td><td class="r">${uah(t.labor)}</td><td class="r">${uah(t.other)}</td><td class="r">${uah(t.overhead)}</td><td class="r"><b class="bad-t">${uah(t.total)}</b></td></tr></tbody></table>
    <p class="note">Не входят в выручку, выпуск и прибыль готовой продукции. Затраты отменённого задания в отменённом заказе учтены один раз — в строке заказа.</p>`;
  }

  /* ---------- economics ---------- */
  function econ(p){
    const e=AN.economics(p),pm=AN.productMargins(p),f=e.factCost,pl=e.planCost;
    const art=[['Материалы','mat'],['Работа','labor'],['Прочие расходы','other'],['Накладные','overhead'],['Себестоимость','total']];
    const maxDev=Math.max(1,...e.devTop.map(x=>Math.abs(x.devUAH)));
    return `<div class="stats">
      ${stat('Выручка (факт)',uah(e.revenueUAH),`${e.fact.length} заказ(ов) с фактом`)}
      ${stat('Себестоимость (факт)',uah(f.total),'готовая продукция')}
      ${stat('Прибыль (факт)',uah(e.profitUAH),`маржа ${pct(e.margin)}`,e.profitUAH<0?'bad-t':'')}
      ${stat('Потери от отмен',uah(e.losses.total.total),'отдельно, см. ниже',e.losses.total.total?'bad-t':'')}
      ${stat('Результат с потерями',uah(e.profitUAH-e.losses.total.total),'прибыль − потери')}</div>
    <h2>Факт и план по статьям</h2>
    ${e.fact.length?`<table class="t"><thead><tr><th></th><th class="r">План</th><th class="r">Факт</th><th class="r">Факт − план</th></tr></thead><tbody>
      ${art.map(([t,k])=>`<tr><td>${k==='total'?'<b>'+t+'</b>':t}</td><td class="r">${e.planComparable?uah(pl[k]):'—'}</td><td class="r">${uah(f[k])}</td><td class="r">${e.planComparable?devCell(f[k],pl[k]):'—'}</td></tr>`).join('')}</tbody></table>
      <p class="note">План — снимок при списании материалов по заказу. ${e.fact.some(x=>x.restoredPlan)?'У части заказов план восстановлен при переносе без разбивки по статьям. ':''}Факт — только завершённые задания (отменённые — в «Потерях»).</p>`:U.empty('Заказов с зафиксированным фактом за период нет')}
    ${e.devTop.length?`<h2>Наибольшие отклонения факта от плана</h2><table class="t"><tbody>${e.devTop.map(x=>`<tr class="click" data-act="edit-order" data-id="${x.orderId}"><td><b>${esc(x.no)}</b> ${esc(x.client)}</td><td style="width:35%">${bar(x.devUAH,maxDev,x.devUAH>0?'bad':'good')}</td><td class="r">${devCell(x.factUAH,x.planUAH)}</td><td class="r">маржа ${pct(x.margin)}</td></tr>`).join('')}</tbody></table>`:''}
    <h2>Маржа по изделиям</h2>
    ${pm.length?`<table class="t stack"><thead><tr><th>Изделие</th><th class="r">Норматив</th><th class="r">План</th><th class="r">Факт</th><th class="r">Себест. 1 шт: план / факт</th></tr></thead><tbody>${pm.map(x=>`<tr><td><b>${esc(x.name)}</b></td>
      <td class="r">${pct(x.norm.margin)}</td><td class="r">${x.plan?`${pct(x.plan.margin)} <span class="note">· ${qf(x.plan.qty)} шт</span>`:NA}</td>
      <td class="r">${x.fact?`${pct(x.fact.margin)} <span class="note">· ${qf(x.fact.qty)} шт</span>`:NA}</td>
      <td class="r">${x.plan?uah(x.plan.unitCost):'—'} / ${x.fact?uah(x.fact.unitCost):'—'}</td></tr>`).join('')}</tbody></table>
      <p class="note">Норматив — по текущей карточке изделия и курсу. План — по снимкам заказов периода. Факт — только завершённые задания с зафиксированной себестоимостью.</p>`:U.empty('Нет изделий с ценой и составом')}
    ${e.open.length?`<h2>Заказы без факта (в работе) — оценка, не входит в итоги выше</h2><table class="t stack"><thead><tr><th>Заказ</th><th>Статус</th><th class="r">Выручка</th><th class="r">Себестоимость</th><th>Источник</th><th class="r">Прибыль (оценка)</th></tr></thead><tbody>${e.open.map(x=>`<tr class="click" data-act="edit-order" data-id="${x.orderId}"><td><b>${esc(x.no)}</b> ${esc(x.client)}</td><td>${esc(x.status)}</td><td class="r">${uah(x.revenueUAH)}</td><td class="r">${uah(x.costUAH)}</td><td>${x.source}</td><td class="r">${uah(x.profitUAH)}</td></tr>`).join('')}</tbody></table>`:''}
    ${lossBlock(e.losses)}`;
  }

  /* ---------- production ---------- */
  function prod(p){
    const r=AN.production(p),maxQ=Math.max(1,...r.output.map(x=>x.qty));
    const m=r.materials,sum=k=>m.reduce((a,x)=>a+(x[k]?x[k].c:0),0);
    return `<div class="stats">
      ${stat('Выпуск',`${qf(r.qty)} шт`,`${r.jobsDone} завершённых заданий`)}
      ${stat('Время: план / факт',`${qf(r3(r.planMin/60))} / ${qf(r3(r.factMin/60))} ч`,r.planMin?`отклонение ${minDev(r.factMin,r.planMin)}`:'')}
      ${stat('Перерасход + брак',uah(sum('over')+sum('scrap')),`возвраты ${uah(sum('ret'))}`,sum('over')+sum('scrap')?'bad-t':'')}
      ${stat('Отменено заданий',r.cancelled.count,r.cancelled.withCost?`с затратами: ${r.cancelled.withCost} · ${uah(r.cancelled.costUAH)}`:'без затрат')}
      ${stat('Сейчас в работе',r.active.inWork,`в очереди ${r.active.queued}${r.active.overdue?` · просрочено ${r.active.overdue}`:''}`,r.active.overdue?'bad-t':'')}</div>
    <h2>Выпуск по изделиям</h2>
    ${r.output.length?`<table class="t"><thead><tr><th>Изделие</th><th></th><th class="r">Шт.</th><th class="r">План заданий</th><th class="r">Факт</th><th class="r">Отклонение</th></tr></thead><tbody>${r.output.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td style="width:28%">${bar(x.qty,maxQ)}</td><td class="r">${qf(x.qty)}</td><td class="r">${uah(x.planUAH)}</td><td class="r">${uah(x.factUAH)}</td><td class="r">${devCell(x.factUAH,x.planUAH)}</td></tr>`).join('')}</tbody></table>
      <p class="note">План — норматив на момент создания задания; факт — зафиксированная себестоимость. Отменённые задания сюда не входят.</p>`:U.empty('Завершённых заданий за период нет')}
    <h2>Время по операциям</h2>
    ${r.ops.length?`<table class="t"><thead><tr><th>Операция</th><th class="r">План, ч</th><th class="r">Факт, ч</th><th class="r">Отклонение</th><th class="r">Заданий</th></tr></thead><tbody>${r.ops.sort((a,b)=>(b.factMin-b.planMin)-(a.factMin-a.planMin)).map(x=>`<tr><td>${esc(x.name)}</td><td class="r">${qf(r3(x.planMin/60))}</td><td class="r">${qf(r3(x.factMin/60))}</td><td class="r">${minDev(x.factMin,x.planMin)}</td><td class="r">${x.n}</td></tr>`).join('')}</tbody></table>`:U.empty('Нет данных о времени')}
    <h2>Перерасход, брак и возвраты по материалам</h2>
    ${m.length?`<table class="t stack"><thead><tr><th>Материал</th><th class="r">Перерасход</th><th class="r">Брак</th><th class="r">Возврат</th></tr></thead><tbody>${m.map(x=>{const c=k=>x[k]&&x[k].q?`${qf(r3(x[k].q))} ${esc(x.unit)} · ${uah(x[k].c)}`:'—';return `<tr><td>${esc(x.name)}</td><td class="r">${c('over')}</td><td class="r">${c('scrap')}</td><td class="r">${c('ret')}</td></tr>`}).join('')}</tbody></table>`:U.empty('Перерасхода, брака и возвратов за период нет')}`;
  }

  /* ---------- materials ---------- */
  function mat(p){
    const r=AN.materials(p),T=r.byType,c=k=>T[k]?T[k].c:0,n=k=>T[k]?T[k].n:0;
    const maxC=Math.max(1,...r.topConsumption.map(x=>x.uah));
    return `<div class="stats">
      ${stat('Стоимость остатков сейчас',uah(r.valueNow),'по средней себестоимости')}
      ${stat('На конец периода',uah(r.valueAtEnd),p.to?fdate(p.to):'весь журнал')}
      ${stat('Закупки',uah(r.purchTotal),`${r.purchases.length} записей`)}
      ${stat('Заканчивается',r.low.length,'материалов',r.low.length?'bad-t':'')}</div>
    <h2>Движения по типам</h2>
    <table class="t"><thead><tr><th>Операция</th><th class="r">Движений</th><th class="r">Сумма</th></tr></thead><tbody>
    ${Object.entries(SC.MOVE_TYPES).map(([k,t])=>`<tr><td>${esc(t)}</td><td class="r">${n(k)}</td><td class="r ${c(k)<0?'bad-t':''}">${n(k)?uah(c(k)):'—'}</td></tr>`).join('')}</tbody></table>
    <h2>Наибольший расход в заказы (за вычетом возвратов)</h2>
    ${r.topConsumption.length?`<table class="t"><tbody>${r.topConsumption.map(x=>`<tr><td>${esc(x.name)}</td><td style="width:30%">${bar(x.uah,maxC)}</td><td class="r">${qf(r3(x.qty))} ${esc(x.unit)}</td><td class="r">${uah(x.uah)}</td></tr>`).join('')}</tbody></table>`:U.empty('Расхода за период нет')}
    <h2>Закупки по поставщикам</h2>
    ${r.bySupplier.length?`<table class="t"><tbody>${r.bySupplier.map(x=>`<tr><td>${esc(x.supplier)}</td><td class="r">${x.n} зап.</td><td class="r">${uah(x.uah)}</td></tr>`).join('')}</tbody></table>
      <details><summary>Все закупки периода (${r.purchases.length})</summary><table class="t mini"><tbody>${r.purchases.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.supplier)}</td><td class="r">${qf(x.qty)} ${esc(x.unit)}</td><td class="r">${uah(x.uah)}</td></tr>`).join('')}</tbody></table></details>`:U.empty('Закупок за период нет')}
    ${r.low.length?`<h2>Нет в наличии или заканчивается</h2><table class="t"><tbody>${r.low.map(m=>`<tr class="click" data-act="edit-mat" data-id="${m.id}"><td>${esc(m.name)}</td><td class="r">${qf(num(m.stock))} ${esc(m.unit)}</td><td class="r">${m.minStock?'мин. '+qf(num(m.minStock)):''}</td></tr>`).join('')}</tbody></table>`:''}`;
  }

  /* ---------- orders ---------- */
  function ord(p){
    const r=AN.orders(p),d=r.deadlines,maxS=Math.max(1,...Object.values(r.byStatus));
    return `<div class="stats">
      ${stat('Заказов',r.count,`отменено ${r.cancelled.count}`)}
      ${stat('Выручка',usd(r.revenueUSD),`≈ ${uah(r.revenueUAH)} по курсам заказов`)}
      ${stat('Прибыль',uah(r.profitUAH),`факт ${r.profitSource.fact} · план ${r.profitSource.plan} · норматив ${r.profitSource.norm}`,r.profitUAH<0?'bad-t':'')}
      ${stat('Средний чек',r.avgCheckUSD==null?'—':usd(r.avgCheckUSD),'без отменённых')}
      ${stat('Ждём оплаты',usd(r.receivablesUSD),'по активным заказам (сейчас)')}</div>
    <h2>По статусам</h2>
    ${r.count?`<table class="t"><tbody>${SC.OSTAT.filter(s=>r.byStatus[s]).map(s=>`<tr><td>${esc(s)}</td><td style="width:40%">${bar(r.byStatus[s],maxS,s==='Отменён'?'bad':'')}</td><td class="r">${r.byStatus[s]}</td></tr>`).join('')}</tbody></table>`:U.empty('Заказов за период нет')}
    <h2>Сроки</h2>
    <table class="t"><tbody>
      <tr><td>Выполнено в срок</td><td class="r">${d.measured?`${d.onTime} из ${d.measured}`:NA}</td></tr>
      <tr><td>С опозданием</td><td class="r ${d.late?'bad-t':''}">${d.measured?d.late:'—'}</td></tr>
      <tr><td>Просрочено сейчас (активные)</td><td class="r ${d.overdueActive?'bad-t':''}">${d.overdueActive}</td></tr></tbody></table>
    <p class="note">«В срок» — дата фиксации фактической себестоимости не позже срока заказа (история статусов не хранится). Прибыль: по факту — только завершённые задания; без факта — по плану или нормативу.</p>
    <h2>Отмены</h2>
    <table class="t"><tbody><tr><td>Отменённых заказов</td><td class="r">${r.cancelled.count}</td></tr><tr><td>На сумму (не входит в выручку)</td><td class="r">${usd(r.cancelled.amountUSD)}</td></tr>
    <tr><td>Понесённые затраты по ним</td><td class="r ${r.cancelled.lossUAH?'bad-t':''}">${uah(r.cancelled.lossUAH)}</td></tr></tbody></table>`;
  }

  A.register('reports','Отчёты',render,{});
  A.action({'rep-tab':id=>{UI.repTab=id;A.refresh()}});
})();
</script>
<script>
/* ======== js/modules/settings.js ======== */
/* Skripo Studio · modules/settings.js — «Настройки»: rates, backup / restore, migration log */
'use strict';
(function(){
  const {$,esc,fmt}=SK.util;
  const U=SK.ui,A=SK.app;
  const S=()=>SK.S;
  const {field}=U;

  /* product categories: editable list kept in settings.productCats (falls back to the schema default) */
  SK.prodCats=()=>{const l=S().settings.productCats;return Array.isArray(l)&&l.length?l:SK.schema.PCATS.slice()};
  const setCats=l=>{S().settings.productCats=l;SK.store.save()};
  const usedBy=c=>S().products.filter(p=>p.category===c).length;
  function render(){
    const s=S().settings;
    const migs=S().migrations.slice().reverse();
    const n=SK.store.notice;
    $('#main').innerHTML=`
    <div class="head"><div><h1>Настройки</h1><p class="lead">Эти значения участвуют во всех расчётах.</p></div></div>
    ${n?`<div class="banner" style="display:block"><div class="row-between"><b>${n.from===1?'Данные перенесены из Склада':'Первый запуск Skripo Studio'}</b><span><button class="btn sm" data-act="backup">Скачать копию</button> <button class="btn ghost sm" data-act="dismiss-notice">Скрыть</button></span></div>
      <ul class="note" style="margin:8px 0 0;padding-left:18px">${n.log.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`:''}
    ${SK.store.memoryOnly?'<div class="banner"><span><b>Данные не сохраняются.</b> Браузер не даёт хранилище (приватный режим?). Откройте файл в обычном окне.</span></div>':''}
    <div class="panel" style="max-width:720px;display:flex;flex-direction:column;gap:16px">
      <div class="grid g2">${field('Курс, ₴ за $',`<input type="text" inputmode="decimal" data-set="rate" value="${esc(s.rate)}">`)}${field('Базовая ставка часа работы, ₴',`<input type="text" inputmode="decimal" data-set="hourRate" value="${esc(s.hourRate)}">`)}</div>
      <div class="grid g2">${field('Накладные, % от материалов и работы',`<input type="text" inputmode="decimal" data-set="overhead" value="${esc(s.overhead)}">`)}${field('Целевая маржа по умолчанию, %',`<input type="text" inputmode="decimal" data-set="margin" value="${esc(s.margin)}">`)}</div>
      <div class="note">Курс 41,5 стоит как заготовка, поставьте свой. Учёт ведётся в гривне: материалы в долларах переводятся по этому курсу. Цены продажи в долларах; в каждом заказе курс фиксируется, когда заказ выходит из статуса «Новый», и дальше не меняется. Работа = нормативное время операций × базовая ставка часа (пока ставка 0, работа в себестоимость не входит).</div>
    </div>
    <h2>Изделия</h2>
    <div class="panel" style="max-width:720px;display:flex;flex-direction:column;gap:12px">
      <div class="note">Создание изделий, правка состава, маршрута, цены и фото, архив. Каталог только показывает изделия.</div>
      <div><a class="btn" href="#prodmgr">Управление изделиями</a></div>
    </div>
    <h2>Процессы и расходы</h2>
    <div class="panel" style="max-width:720px;display:flex;flex-direction:column;gap:12px">
      <div class="note">Справочник технологических операций для маршрутов изделий, ставка часа, накладные мастерской и дополнительные статьи расходов.</div>
      <div><a class="btn" href="#technology">Открыть процессы</a></div>
    </div>
    <h2>Категории изделий</h2>
    <div class="panel" style="max-width:720px;display:flex;flex-direction:column;gap:10px">
      <div class="note">Категории показываются в каталоге строкой над изделиями и выбираются в карточке изделия. Порядок здесь — порядок в каталоге.</div>
      ${SK.prodCats().map((c,i,a)=>`<div class="catrow"><input type="text" value="${esc(c)}" data-catname="${i}"><span class="note">${usedBy(c)?usedBy(c)+' изд.':'пусто'}</span><button class="btn ghost sm" data-act="cat-up" data-id="${i}" ${i?'':'disabled'} title="Выше">↑</button><button class="btn ghost sm" data-act="cat-down" data-id="${i}" ${i<a.length-1?'':'disabled'} title="Ниже">↓</button><button class="btn ghost sm" data-act="cat-del" data-id="${i}" title="Удалить">×</button></div>`).join('')}
      <div class="catrow"><input type="text" id="newcat" placeholder="Новая категория"><button class="btn sm" data-act="cat-add">Добавить</button></div>
    </div>
    <h2>Облако</h2>
    <div class="panel" id="syncpanel" style="max-width:720px;display:flex;flex-direction:column;gap:12px">${SK.syncPanelHTML()}</div>
    <h2>Данные</h2>
    <div class="panel" style="max-width:720px;display:flex;flex-direction:column;gap:12px">
      <div class="note">Всё хранится в этом браузере, на этом устройстве. Резервная копия — файл JSON со всеми материалами, фото, изделиями, заказами и журналом склада. Принимаются копии Skripo Studio и старого Склада (они переносятся автоматически).</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn" data-act="backup">Скачать копию</button><button class="btn ghost" data-act="restore">Загрузить из копии</button><input type="file" accept=".json,application/json" hidden id="restorefile">
      <span class="note">${s.lastBackup?'Последняя копия: '+new Date(s.lastBackup).toLocaleString('ru-RU'):'Копий ещё не было'}</span></div>
      <div><button class="btn danger" data-act="wipe">Стереть все данные</button></div>
    </div>
    ${migs.length?`<h2>Журнал переноса данных</h2><div class="panel" style="max-width:720px">${migs.map(m=>`<div style="margin-bottom:10px"><div class="note"><b>${esc(m.kind==='catalog-import'?'Импорт каталога':m.kind==='wipe'?'Данные стёрты':`Миграция v${m.from} → v${m.to}`)}</b> · ${esc(new Date(m.at).toLocaleString('ru-RU'))}${m.source?' · '+esc(m.source):''}</div>${(m.log||[]).length?`<ul class="note" style="margin:4px 0 0;padding-left:18px">${m.log.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}</div>`).join('')}</div>`:''}`;
  }

  SK.syncPanelHTML=()=>{
    const s=SK.sync.status();
    if(!s.connected)return `<div class="note">Копия всех данных в вашей Google Таблице: отдельные листы (материалы, изделия, заказы, движения…), фото в папке на Google Диске, ежедневные копии таблицы. Работает и без сети: данные сохраняются здесь, а в облако уходят, когда оно доступно.</div>
      <div class="note">Как подключить: создайте пустую таблицу → Расширения → Apps Script → вставьте код из файла <b>apps-script.gs</b> → запустите <b>setup</b> → Развернуть как веб-приложение (доступ: «Все») → вставьте ссылку и ключ сюда. Ключ написан на листе «Доступ».</div>
      ${field('Ссылка веб-приложения',`<input type="text" id="syurl" placeholder="https://script.google.com/macros/s/…/exec">`)}
      ${field('Ключ доступа',`<input type="text" id="sykey" autocomplete="off" spellcheck="false" style="-webkit-text-security:disc">`)}
      <div><button class="btn" data-act="sync-connect">Подключить</button></div>`;
    const state=s.busy?'Синхронизация…':s.err?`<span class="bad-t">Ошибка: ${esc(s.err)}</span>`:s.conflict?'<span class="bad-t">Нужно решение: данные в облаке и здесь различаются</span>':s.dirty?'Есть изменения, ещё не отправлены':'Всё синхронизировано'+(s.last?' · '+new Date(s.last).toLocaleString('ru-RU'):'');
    return `<div class="note"><b>Подключено.</b> ${state}</div>
      <label class="chk"><input type="checkbox" data-act="sync-auto" ${s.auto?'checked':''}> Отправлять изменения автоматически</label>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="sync-now">Синхронизировать сейчас</button><button class="btn ghost" data-act="sync-pull">Загрузить из облака</button><button class="btn ghost" data-act="sync-push">Заменить облако этими данными</button><button class="btn ghost" data-act="sync-off">Отключить</button></div>`;
  };
  A.register('prefs','Настройки',render,{});
  document.addEventListener('change',e=>{   // rename a category (products that use it follow)
    const t=e.target;if(!t.dataset||t.dataset.catname===undefined)return;
    const l=SK.prodCats().slice(),i=+t.dataset.catname,old=l[i],v=t.value.trim();
    if(!v||v===old){t.value=old;return}
    if(l.some((x,j)=>j!==i&&x.toLowerCase()===v.toLowerCase())){SK.ui.toast('Такая категория уже есть');t.value=old;return}
    l[i]=v;S().products.forEach(p=>{if(p.category===old)p.category=v});setCats(l);A.refresh();
  });
  A.action({
    'sync-connect':async()=>{try{await SK.sync.connect($('#syurl').value,$('#sykey').value)}catch(e){U.toast(e.message||'Не удалось подключить')}},
    'sync-now':()=>SK.sync.syncNow(),
    'sync-auto':(_i,b)=>SK.sync.setAuto(b.checked),
    'sync-pull':async()=>{if(await U.askConfirm('Заменить данные на этом устройстве данными из облака?','Загрузить'))SK.sync.pull()},
    'sync-push':async()=>{if(await U.askConfirm('Заменить данные в облаке данными с этого устройства?','Заменить'))SK.sync.push()},
    'sync-off':async()=>{if(await U.askConfirm('Отключить облако на этом устройстве? Данные в таблице останутся.','Отключить')){await SK.sync.disconnect()}},
    'cat-add':()=>{const el=$('#newcat'),v=(el&&el.value||'').trim();if(!v)return;const l=SK.prodCats().slice();
      if(l.some(x=>x.toLowerCase()===v.toLowerCase())){U.toast('Такая категория уже есть');return}
      l.push(v);setCats(l);A.refresh()},
    'cat-up':id=>{const l=SK.prodCats().slice(),i=+id;if(i>0){[l[i-1],l[i]]=[l[i],l[i-1]];setCats(l);A.refresh()}},
    'cat-down':id=>{const l=SK.prodCats().slice(),i=+id;if(i<l.length-1){[l[i+1],l[i]]=[l[i],l[i+1]];setCats(l);A.refresh()}},
    'cat-del':async id=>{const l=SK.prodCats().slice(),i=+id,c=l[i],n=usedBy(c);
      if(n&&!await U.askConfirm(`У ${n} изд. будет снята категория «${c}». Продолжить?`,'Удалить'))return;
      S().products.forEach(p=>{if(p.category===c)p.category=''});l.splice(i,1);setCats(l.length?l:null);A.refresh()},
    backup:async()=>{await SK.store.backup();U.toast('Копия скачана');if(A.PAGE==='prefs')A.refresh();SK.footerState()},
    restore:()=>$('#restorefile').click(),
    wipe:async()=>{if(await U.askConfirm('Стереть все материалы, изделия, заказы и журнал склада? Это нельзя отменить. Сначала лучше скачать копию.','Стереть')){await SK.store.wipe();U.toast('Данные стёрты');A.route()}}
  });
  /* sidebar footer: backup age (the reminder that used to live on the dashboard) + pending migration note */
  SK.footerState=()=>{
    const el=$('#backupstate');if(!el||!SK.S)return;
    const s=S().settings,days=s.lastBackup?Math.floor((Date.now()-s.lastBackup)/864e5):null;
    const hasData=S().materials.length||S().orders.length||S().products.some(p=>p.bom.length);
    const warn=SK.store.memoryOnly||SK.store.notice||(hasData&&(days==null||days>=14));
    el.className=warn?'bad-t':'';
    el.innerHTML=SK.store.memoryOnly?'⚠ Данные не сохраняются':SK.store.notice?'Есть сообщение о переносе данных':
      days==null?(hasData?'Резервной копии ещё не было':''):`Копия ${days?days+' дн. назад':'сегодня'}`;
  };
  A.action({'dismiss-notice':()=>{SK.store.dismissNotice();A.refresh();SK.footerState()}});
  SK.settingsRestore=async file=>{
    try{
      const b=SK.store.parseBackup(await file.text());
      const kind=b.v===1?'копия старого Склада — будет перенесена в новую схему':'копия Skripo Studio';
      if(await U.askConfirm(`Заменить текущие данные копией (${kind})? В копии: материалов ${b.counts.materials}, изделий ${b.counts.products}, заказов ${b.counts.orders}.`,'Заменить')){
        await b.apply();U.toast('Данные загружены');A.go('dash');
      }
    }catch(_){U.toast('Это не файл копии Склада или Skripo Studio')}
  };
})();
</script>
<script>
/* ======== js/app.js ======== */
/* Skripo Studio · app.js — global event delegation + boot (ported from Sklad v1) */
'use strict';
(function(){
  const {$}=SK.util;
  const A=SK.app,C=SK.costing;
  const S=()=>SK.S;

  document.addEventListener('click',e=>{
    if(e.target.closest('.overlay')||e.target.closest('.lightbox'))return;
    if(e.target.closest('[data-stop]'))return;
    const a=e.target.closest('[data-act]');if(!a)return;
    const f=A.ACT[a.dataset.act];if(f){e.preventDefault();f(a.dataset.id,a)}
  });
  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.closest('.overlay'))return;
    if(t.dataset.chg==='toggle-stock'){const m=C.matById(t.dataset.id);if(m){m.inStock=t.checked;SK.store.save();if(A.PAGE==='materials')A.LISTS.materials()}}
    if(t.id==='restorefile'&&t.files[0]){const f=t.files[0];t.value='';SK.settingsRestore(f)}
  });
  document.addEventListener('input',e=>{
    const t=e.target;if(t.closest('.overlay'))return;
    if(t.dataset.ui){A.UI[t.dataset.ui]=t.type==='checkbox'?t.checked:t.value;A.LISTS[A.PAGE]&&A.LISTS[A.PAGE]();return}
    if(t.dataset.set){S().settings[t.dataset.set]=t.value===''?0:t.value;SK.store.save();if(A.PAGE==='calc')SK.calc.render();return}
    if(t.dataset.est){A.EST[t.dataset.est]=t.value;if(t.dataset.est==='id'||t.tagName==='INPUT')SK.renderEstimateDoc();return}
    if(t.dataset.root==='calc'){
      const f=t.dataset.f;let val=t.value;
      if(t.dataset.cvt&&val!==''){const cur=SK.calc.cur(),rate=SK.util.num(S().settings.rate)||1,x=SK.util.num(val),r2=v=>String(Math.round(v*100)/100);
        if(t.dataset.cvt==='uah'&&cur==='USD')val=r2(x*rate);else if(t.dataset.cvt==='usd'&&cur==='UAH')val=r2(x/rate)}
      SK.util.setPath(S().calc,f,val);
      if(f==='pid'){SK.calc.load(t.value);SK.store.save();A.refresh();return}
      if(t.dataset.reload){SK.store.save();A.refresh();return}
      SK.store.save();SK.calc.render();
    }
  });

  (async function(){
    await SK.store.boot();
    window.addEventListener('hashchange',A.onHash);
    A.route();
    if(SK.sync)SK.sync.start();
  })();
})();
</script>
</body>
