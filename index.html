  /* first picture of a product: own uploaded photo, else catalog asset */
  const cover=p=>(p.photoIds||[]).length?SK.store.photoURL(p.photoIds[0]):(p.images||[])[0]||'';
  /* catalog prefs (remembered per browser): availability marks on/off, colour of «not in stock», shared currency */
  const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
  const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
  if(UI.prodMarks==null)UI.prodMarks=lsGet('skripo_catalog_marks','1')!=='0';
  if(!UI.prodNoCol)UI.prodNoCol=lsGet('skripo_catalog_nocol','gray')==='red'?'red':'gray';
  if(!UI.calcCur)UI.calcCur=lsGet('skripo_currency','UAH')==='USD'?'USD':'UAH';
  const cardPrice=p=>{const v=num(p.priceUSD);if(!v)return '<span class="muted">без цены</span>';
    return `<span class="pr" data-act="cat-cur" title="Нажмите, чтобы сменить валюту">${UI.calcCur==='USD'?SK.util.usd(v):SK.util.uah(v*num(S().settings.rate))}</span>`};
  const IC=U.IC;
  document.addEventListener('click',e=>{if(UI.prodFilt&&A.PAGE==='products'&&!e.target.closest('.fwrap')){UI.prodFilt=false;A.refresh()}});
  const NOCAT='\u0000';
  /* category row: «Все» + categories that have products (schema order first); «Без категории» only when needed */
  function catList(){
    const act=S().products.filter(p=>UI.prodArch?p.archived:!p.archived);
    const has=new Set(act.map(p=>p.category||NOCAT));

    <div><button class="btn ghost sm" data-act="add-comp">+ Материал в состав</button> ${S().materials.length?'':'<span class="note">Сначала добавьте материалы на странице «Материалы».</span>'}</div>
    <div class="sec">Индивидуальные расходы изделия на 1 шт. (клеймо, особая упаковка…)</div>
    ${d.other.length?`<table class="t mini"><tbody>${d.other.map((o,i)=>`<tr><td><input type="text" data-f="other.${i}.name" value="${esc(o.name)}" placeholder="Название"></td><td style="width:140px"><input type="text" inputmode="decimal" data-f="other.${i}.uah" value="${esc(o.uah)}" placeholder="₴"></td><td style="width:34px"><button class="linkbtn" data-act="rm-other" data-i="${i}">✕</button></td></tr>`).join('')}</tbody></table>`:''}
    <div><button class="btn ghost sm" data-act="add-other">+ Расход</button></div>

  /* ---- technological route (stage 2) ---- */
  const T=SK.technology;
  function opOpts(sel){
    let h=`<option value="">— операция —</option>`+T.selectable(sel).map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.name)}${o.archived?' · архив':''}${o.legacy?' · перенесено':''}</option>`).join('');
    if(sel&&!C.opById(sel))h+=`<option value="${esc(sel)}" selected>(операция удалена)</option>`;
    return h;
  }
  function routeBlock(d){
    const steps=d.route||[];
    return `<div class="sec">Технологический маршрут (на 1 изделие)</div>
    ${steps.length?`<table class="t mini"><thead><tr><th style="width:30px">№</th><th>Операция</th><th style="width:110px">Время, мин</th><th style="width:120px" class="muted">Ориентир</th><th style="width:84px"></th></tr></thead><tbody>${steps.map((s,i)=>{const op=C.opById(s.opId);
      return `<tr><td class="muted">${i+1}</td><td><select data-f="route.${i}.opId">${opOpts(s.opId)}</select></td>
      <td><input type="text" inputmode="decimal" data-f="route.${i}.min" value="${esc(s.min)}"></td>
      <td class="muted">${op&&op.normMin?`${SK.util.qf(num(op.normMin[0]))}–${SK.util.qf(num(op.normMin[1]))}`:'—'}</td>
      <td class="r" style="white-space:nowrap"><button class="linkbtn" data-act="step-up" data-i="${i}" title="Выше">↑</button> <button class="linkbtn" data-act="step-down" data-i="${i}" title="Ниже">↓</button> <button class="linkbtn" data-act="rm-step" data-i="${i}" title="Убрать">✕</button></td></tr>`}).join('')}</tbody></table>`:'<div class="note">Маршрут не задан.</div>'}
    <div><button class="btn ghost sm" data-act="add-step">+ Операция в маршрут</button> <span class="note">справочник операций — в разделе «Процессы»</span></div>`;
  }
  function routeLive(d){
    const r=T.routeSummary(d.route);if(!r.steps.length)return '';
    const out=r.steps.filter(s=>s.out);
    return `<div class="sec" style="margin:0 0 6px">Маршрут: ${r.steps.length} оп. · ${SK.util.qf(r3(r.min))} мин (${SK.util.qf(r3(r.hours))} ч)</div>`+
      r.steps.map(s=>`<div class="sum"><span>${esc(s.name)} · ${SK.util.qf(s.min)} мин${s.out?' <span class="tag bad">вне ориентира</span>':''}</span><span>${SK.util.uah(s.sum)}</span></div>`).join('')+
      (out.length?`<div class="note bad-t" style="margin:6px 0 0">Время вне ориентира справочника — проверьте: ${out.map(s=>esc(s.name)).join(', ')}.</div>`:'')+
      (!r.rate?`<div class="note bad-t" style="margin:6px 0 0">Базовая ставка часа = 0: работа не входит в себестоимость.</div>`:'')+
      `<div style="height:14px"></div>`;
  }
  /* full cost (2026-11-12): production cost as before + optional expense items, two profits */
  const F=SK.fullcost;
  const fullOf=d=>F.full(C.costOf(d.bom,{route:d.route,other:d.other}),{pid:d.id,off:d.costItemsOff,priceUAH:num(d.priceUSD)*num(S().settings.rate)});
  const productLive=d=>{const fc=fullOf(d);return routeLive(d)+U.fullBreakdown(fc)+U.priceLineFull(d.priceUSD,fc)};
  /* shared expense items that apply to this product by scope; a checkbox switches one off for this product only */
  function itemsBlock(d){

  }
  const hoursText=route=>{const h=r3(C.routeHours(route));return h?String(h).replace('.',','):''};

  /* store the card (same rules as «Сохранить»); used before «Создать заказ» / «Смета» too */
  function saveDraft(d){
    if(!d.name.trim()){U.toast('Укажите название');return false}
    const p=clone(d);p.name=p.name.trim();p.bom=p.bom.filter(c=>c.mid);p.route=T.cleanRoute(p.route);delete p.hoursUI;delete p.ciOn;
    const i=S().products.findIndex(x=>x.id===p.id);if(i>=0)S().products[i]=p;else S().products.push(p);

  /* catalog view: pop-up window, photo on the left, description on the right. Click on the photo enlarges it inside
     the same window (description hides, click again to return). Read-only; editing lives in «Изделия».
     The top menu stays clickable: the dim layer starts under the header, and any menu click closes the window. */
  function viewProduct(id){
    const p=C.prodById(id);if(!p)return;
    const urls=[...(p.photoIds||[]).map(x=>SK.store.photoURL(x)),...(p.images||[])].filter(Boolean);
    const rate=num(S().settings.rate),c=C.prodCost(p),has=p.bom.some(x=>x.mid),pu=num(p.priceUSD)*rate,m=has?C.margin(pu,c.total):null;
    const rows=[['Категория',p.category],['Размер',p.size?p.size+' см':''],['Цвет',p.color],['Материал',p.materialNote],['Конструкция',p.construction],['Фурнитура',p.hardware]].filter(r=>r[1]);
    const comp=p.bom.filter(x=>x.mid).map(x=>{const mt=C.matById(x.mid);return mt?`<tr><td>${esc(mt.name)}</td><td class="r">${esc(x.qty)} ${esc(mt.unit||'')}</td></tr>`:''}).join('');
    let ev=null;
    const setOrigin=(fr,e)=>{const r=fr.getBoundingClientRect(),t=e.touches?e.touches[0]:e;fr.firstElementChild.style.transformOrigin=Math.min(100,Math.max(0,(t.clientX-r.left)/r.width*100))+'% '+Math.min(100,Math.max(0,(t.clientY-r.top)/r.height*100))+'%'};
    const mod=U.openModal({title:p.name,wide:true,draft:{cur:0,zoom:false},noSave:true,cancel:'Закрыть',
      body:d=>`<div class="pv"><div class="pv-ph">${urls.length>1?`<div class="pv-th">${urls.map((u,i)=>`<button class="${i===d.cur?'on':''}" data-act="pv-sel" data-i="${i}"><img src="${esc(u)}" alt=""></button>`).join('')}</div>`:''}
        ${urls.length?`<div class="pv-fr" data-act="pv-zoom" title="Увеличить"><img src="${esc(urls[d.cur]||urls[0])}" alt=""></div>`:`<div class="pv-none">${esc((p.name||'?').slice(0,1))}</div>`}</div>
        ${`<div class="pv-in"><div class="pv-top"><span class="tag ${p.status==='В наличии'?'good':p.status==='Под заказ'?'warn':''}">${esc(p.status)}</span>${U.archTag(p)}</div>
          <div class="pv-price">${num(p.priceUSD)?SK.util.usd(num(p.priceUSD)):'<span class="muted">без цены</span>'}</div>
          ${rows.length?`<dl class="pv-dl">${rows.map(([k,t])=>`<dt>${k}</dt><dd>${esc(t)}</dd>`).join('')}</dl>`:''}
          ${p.notes?`<p class="pv-notes">${esc(p.notes)}</p>`:''}
          ${has||c.labor||c.otherSum?`<div class="pv-cost"><div class="sum"><span>Себестоимость</span><span>${SK.util.uah(c.total)}</span></div>${m!=null?`<div class="sum"><span>Маржа</span><span class="${m<0?'bad-t':''}">${U.pct(m)}</span></div>`:''}</div>`:''}
          ${comp?`<details class="pv-comp"><summary>Состав</summary><table class="t mini"><tbody>${comp}</tbody></table></details>`:''}</div>`}</div>`,
      extra:()=>`<button class="btn ghost sm" data-act="prod-est">Смета</button>`+(p.archived?'':`<button class="btn sm" data-act="make-order" style="margin-left:8px">Создать заказ</button>`),
      onAction:(act,b,d,draw,close)=>{
        if(act==='pv-sel'){      // switch photo in place; zoom resets
          d.cur=+b.dataset.i;const root=b.closest('.pv'),fr=root.querySelector('.pv-fr');if(fr){fr.classList.remove('z');fr.title='Увеличить';fr.querySelector('img').src=urls[d.cur]}
          root.querySelectorAll('.pv-th button').forEach((x,i)=>x.classList.toggle('on',i===d.cur))}
        else if(act==='pv-zoom'){   // the photo grows inside its own frame; everything else stays put
          const on=!b.classList.contains('z');b.classList.toggle('z',on);b.title=on?'Уменьшить':'Увеличить';if(on)setOrigin(b,ev)}
        else if(act==='make-order'){close();SK.newOrderFromProduct(p.id)}
        else if(act==='prod-est'){close();A.EST.src='product';A.EST.id=p.id;A.EST.qty='1';A.go('estimate')}
      }});
    const tb=document.querySelector('.topbar');if(tb){const t=tb.getBoundingClientRect().bottom;mod.el.style.top=t+'px';mod.el.querySelector('.modal').style.maxHeight=`calc(100vh - ${t}px - 4vh)`;mod.el.style.setProperty('--t',t+'px')}
    mod.el.addEventListener('mousedown',e=>{ev=e},true);mod.el.addEventListener('touchstart',e=>{ev=e},{capture:true,passive:true});
    const pan=e=>{const fr=e.target.closest&&e.target.closest('.pv-fr.z');if(fr)setOrigin(fr,e)};
    mod.el.addEventListener('mousemove',pan);mod.el.addEventListener('touchmove',pan,{passive:true});
    /* menu must always work: the dim layer lets clicks through; a click outside the window closes it, a click on the menu also navigates */
    mod.el.style.pointerEvents='none';mod.el.querySelector('.modal').style.pointerEvents='auto';
    const off=()=>{document.removeEventListener('click',outside,true);document.removeEventListener('sk:route',onHash);obs.disconnect()};
    const onHash=()=>{off();mod.close()};
    const outside=e=>{if(!mod.el.isConnected){off();return}
      if(e.target.closest('.modal')||e.target.closest('.overlay'))return;
      off();mod.close();
      if(!e.target.closest('.topbar')){e.stopPropagation();e.preventDefault()}};
    const obs=new MutationObserver(()=>{if(!mod.el.isConnected)off()});obs.observe(document.getElementById('modal-root'),{childList:true});
    document.addEventListener('sk:route',onHash);
    setTimeout(()=>document.addEventListener('click',outside,true),0);
  }

  function editProduct(id,view){
    const isNew=!id&&!view;
    const draft=isNew?{id:uid(),name:'',size:'',status:'Под заказ',category:'',color:'',construction:'',hardware:'',materialNote:'',priceUSD:'',images:[],photoIds:[],bom:[],route:[],other:[],notes:'',archived:false,origin:{}}:clone(C.prodById(id));
    draft.hoursUI=hoursText(draft.route);draft.costItemsOff=draft.costItemsOff||[];draft.ciOn=Object.fromEntries(F.applicable(draft.id,[]).map(it=>[it.id,!draft.costItemsOff.includes(it.id)]));
    U.openModal({title:isNew?'Новое изделие':draft.name,wide:true,draft,saveLabel:isNew?'Добавить':'Сохранить',noSave:!!view,cancel:view?'Закрыть':undefined,body:view?d=>`<fieldset class="ro" disabled>${productBody(d)}</fieldset>`:productBody,live:productLive,
      onInput:(f,d)=>{
        if(f.startsWith('ciOn.')){d.costItemsOff=F.applicable(d.id,[]).filter(it=>!d.ciOn[it.id]).map(it=>it.id);return false}
        if(f==='hoursUI'&&C.hoursEditable(d.route))d.route=C.routeFromHours(d.hoursUI);
        const rm=f.match(/^route\.(\d+)\.opId$/);
        if(rm){const s=d.route[+rm[1]];s.min=T.defaultMin(C.opById(s.opId));d.hoursUI=hoursText(d.route);return true}
        return /^bom\.\d+\.mid$/.test(f);
      },
      extra:d=>{
        if(isNew)return '';
        if(view)return `<button class="btn ghost sm" data-act="prod-est">Смета</button>`+(d.archived?'':`<button class="btn sm" data-act="make-order" style="margin-left:8px">Создать заказ</button>`);
        const can=I.canDelete('product',d.id).ok;
        return (d.archived?`<button class="btn ghost sm" data-act="unarchive">Вернуть из архива</button>`:`<button class="btn ghost sm" data-act="archive">В архив</button>`)+
          (can?`<button class="btn danger" data-act="del" style="margin-left:14px">Удалить</button>`:'')+
          `<button class="btn ghost sm" data-act="dup" style="margin-left:14px">Дублировать</button>`+
          `<button class="btn ghost sm" data-act="prod-est" style="margin-left:8px">Смета</button>`+
          (d.archived?'':`<button class="btn sm" data-act="make-order" style="margin-left:8px">Создать заказ</button>`);
      },
      onAction:async(act,b,d,draw,close)=>{
        if(act==='add-comp'){d.bom.push({mid:'',qty:''});draw()}
        else if(act==='rm-comp'){d.bom.splice(+b.dataset.i,1);draw()}
        else if(act==='add-other'){d.other.push({name:'',uah:''});draw()}
        else if(act==='rm-other'){d.other.splice(+b.dataset.i,1);draw()}
        else if(act==='rmphoto'){d.photoIds.splice(+b.dataset.i,1);draw()}
        else if(act==='make-order'){if(!view&&!saveDraft(d))return;close();A.refresh();SK.newOrderFromProduct(d.id)}
        else if(act==='prod-est'){if(!view&&!saveDraft(d))return;close();A.EST.src='product';A.EST.id=d.id;A.EST.qty='1';A.go('estimate')}
        else if(act==='add-step'){T.addStep(d.route,'');draw()}
        else if(act==='rm-step'){d.route.splice(+b.dataset.i,1);d.hoursUI=hoursText(d.route);draw()}
        else if(act==='step-up'||act==='step-down'){if(T.moveStep(d.route,+b.dataset.i,act==='step-up'?-1:1))draw()}
        else if(act==='dup'){const n=clone(d);delete n.hoursUI;n.id=uid();n.name=d.name+' (копия)';n.archived=false;n.origin={copyOf:d.id};S().products.push(n);SK.store.save();close();A.refresh();setTimeout(()=>editProduct(n.id),50)}
        else if(act==='archive'||act==='unarchive'){I.setArchived('product',d.id,act==='archive');SK.store.save();close();A.refresh();U.toast(act==='archive'?'Изделие в архиве':'Изделие возвращено из архива')}
        else if(act==='del'){
          if(!I.canDelete('product',d.id).ok){U.info('Удаление невозможно','Изделие есть в заказах. Его можно только отправить в архив.');return}
          if(await U.askConfirm('Удалить изделие? Оно не встречается ни в одном заказе.','Удалить')){I.remove('product',d.id);SK.store.save();close();A.refresh()}
        }
      },
      onSave:d=>{if(!saveDraft(d))return false;A.refresh()}});
  }


  /* «Изделия» — управление данными изделий (создание, правка, архив). Не в меню: открывается из «Настроек». */
  function renderMgr(){
    const all=S().products.slice().sort((a,b)=>(a.archived?1:0)-(b.archived?1:0)||(a.category||'~').localeCompare(b.category||'~','ru')||a.name.localeCompare(b.name,'ru'));
    $('#main').innerHTML=`
    <div class="head"><div><a href="#products" class="back">← Каталог</a><h1>Изделия</h1></div><button class="ib addb" data-act="new-prod" title="Новое изделие" aria-label="Новое изделие">${U.IC.plus}</button></div>
    ${all.length?`<table class="t stack"><thead><tr><th>Изделие</th><th>Категория</th><th>Статус</th><th class="r">Цена</th></tr></thead><tbody>${all.map(p=>`<tr class="click${p.archived?' archived':''}" data-act="edit-prod" data-id="${p.id}"><td><div class="prow">${cover(p)?`<img class="pthumb" src="${esc(cover(p))}" alt="">`:''}<div><b>${esc(p.name)}</b><div class="note">${esc(p.size?p.size+' см':'')}</div></div></div></td><td>${esc(p.category)||'<span class="muted">—</span>'}</td><td><span class="tag ${p.status==='В наличии'?'good':''}">${esc(p.status)}</span>${U.archTag(p)}</td><td class="r">${num(p.priceUSD)?SK.util.usd(num(p.priceUSD)):'—'}</td></tr>`).join('')}</tbody></table>`:U.empty('Изделий пока нет')}`;
  }
  A.register('prodmgr','Изделия',renderMgr,{parent:'products'});
  A.register('products','Каталог',render,{nav:1});
  A.action({'new-prod':()=>editProduct(),'edit-prod':id=>editProduct(id),'prod-view':id=>{UI.prodView=id;A.refresh()},
    'prod-filt':()=>{UI.prodFilt=!UI.prodFilt;A.refresh()},
    'prod-marks':()=>{UI.prodMarks=!UI.prodMarks;lsSet('skripo_catalog_marks',UI.prodMarks?'1':'0');A.refresh()},
    'prod-nocol':id=>{UI.prodNoCol=id==='red'?'red':'gray';lsSet('skripo_catalog_nocol',UI.prodNoCol);A.refresh()},
    'cat-cur':()=>{UI.calcCur=UI.calcCur==='USD'?'UAH':'USD';lsSet('skripo_currency',UI.calcCur);A.refresh()},
    'cat-cur-set':id=>{UI.calcCur=id==='USD'?'USD':'UAH';lsSet('skripo_currency',UI.calcCur);A.refresh()},
    'prod-arch':()=>{UI.prodArch=!UI.prodArch;A.refresh()},
    'prod-cat':id=>{UI.prodCat=id;A.refresh()},
    'view-prod':id=>viewProduct(id),
    'prod-search':()=>{UI.prodSearch=!UI.prodSearch;if(!UI.prodSearch)UI.prodQ='';A.refresh();if(UI.prodSearch){const e=document.getElementById('prodQ');if(e)e.focus()}},
    'prod-size':id=>{UI.prodSize=id==='s'?'s':'l';try{localStorage.setItem(sizeKey,UI.prodSize)}catch(e){}A.refresh()}});
})();
</script>
<script>
/* ======== js/modules/technology.js ======== */
/* Skripo Studio · modules/technology.js — «Процессы»: operation dictionary, base rate, workshop overhead, optional expense items */
'use strict';
(function(){
  const {$,esc,num,qf}=SK.util;
  const U=SK.ui,T=SK.technology,I=SK.inventory,A=SK.app;
  const S=()=>SK.S,UI=A.UI;
  const {field,inp,ninp}=U;
  if(UI.opArch==null)UI.opArch=false;

  const range=o=>o.normMin?`${qf(num(o.normMin[0]))}–${qf(num(o.normMin[1]))} мин`:'—';

  function render(){
    const nArch=S().operations.filter(o=>o.archived).length;
    if(!nArch)UI.opArch=false;
    $('#main').innerHTML=`
    <div class="head"><div><a href="#prefs" class="back">← Настройки</a><h1>Процессы</h1><p class="lead">Справочник технологических операций. Норматив здесь — ориентир; рабочее время задаётся в маршруте каждого изделия.</p></div><button class="ib addb" data-act="new-op" title="Новая операция" aria-label="Новая операция">${U.IC.plus}</button></div>
    ${nArch?`<div class="toolbar"><label class="chk"><input type="checkbox" data-ui="opArch" ${UI.opArch?'checked':''}> архив (${nArch})</label></div>`:''}
    <div class="panel" style="margin-bottom:18px"><div class="grid g3" style="align-items:end">${field('Базовая ставка часа, ₴',`<input type="text" inputmode="decimal" data-set="hourRate" value="${esc(S().settings.hourRate)}">`)}${field('Накладные мастерской, % от материалов и работы',`<input type="text" inputmode="decimal" data-set="overhead" value="${esc(S().settings.overhead)}">`)}
      <div class="note">Стоимость операции = время по маршруту × базовая ставка. Накладные мастерской — только общие расходы мастерской (аренда, свет, инструмент); реклама, упаковка и фотосессии — отдельными статьями ниже.</div></div></div>
    <div id="list"></div>
    <div id="costitems"></div>`;
    renderCostItems();
    A.LISTS.technology();
  }
  A.LISTS.technology=()=>{
    const all=T.ordered(),regular=all.filter(o=>!o.legacy);
    const rows=all.filter(o=>UI.opArch?o.archived:!o.archived);
    $('#list').innerHTML=rows.length?`<table class="t stack"><thead><tr><th style="width:40px">№</th><th>Операция</th><th>Норматив (ориентир)</th><th class="r">В изделиях</th><th style="width:80px"></th></tr></thead><tbody>${rows.map(o=>{
      const n=T.usage(o.id).length,pos=regular.indexOf(o);
      if(o.legacy)return `<tr><td class="muted">—</td><td>${esc(o.name)} <span class="tag">служебная</span><div class="note">Время, перенесённое из Склада без разбивки. Для новых маршрутов не предлагается.</div></td><td class="muted">—</td><td class="r">${n||'—'}</td><td></td></tr>`;
      return `<tr class="click" data-act="edit-op" data-id="${o.id}"><td class="muted">${pos+1}</td><td><b>${esc(o.name)}</b>${U.archTag(o)}</td>
      <td>${range(o)}${o.preliminary?' <span class="note">· предварительный</span>':''}</td><td class="r">${n||'—'}</td>
      <td class="r" style="white-space:nowrap">${o.archived?'':`<button class="linkbtn" data-act="op-up" data-id="${o.id}" title="Выше" ${pos===0?'disabled':''}>↑</button> <button class="linkbtn" data-act="op-down" data-id="${o.id}" title="Ниже" ${pos===regular.length-1?'disabled':''}>↓</button>`}</td></tr>`}).join('')}</tbody></table>`:U.empty('Операций нет');
  };

  /* ---------- optional expense items (2026-11-12) ---------- */
  const F=SK.fullcost,SC=SK.schema;
  const money=(v,cur)=>cur==='USD'?SK.util.usd(num(v)):SK.util.uah(num(v));
  function itemRule(it){
    if(it.method==='percent')return `${qf(num(it.amount))}% от цены продажи`;
    if(it.method==='batch')return `${money(it.amount,it.cur)} на партию ÷ ${qf(num(it.batchQty))} шт. = ${money(num(it.amount)/num(it.batchQty||1),it.cur)} / шт.`;
    return `${money(it.amount,it.cur)} на изделие`;
  }
  const scopeText=it=>it.scope==='all'||!it.scope?'все изделия':it.scope.map(pid=>{const p=SK.costing.prodById(pid);return p?p.name:'?'}).join(', ');
  function renderCostItems(){
    const list=F.items().slice().sort((a,b)=>(a.archived-b.archived)||(a.group>b.group?1:a.group<b.group?-1:0)||a.name.localeCompare(b.name,'ru'));
    $('#costitems').innerHTML=`<div class="row-between" style="margin-top:30px"><h2 style="margin:0">Дополнительные расходы</h2><button class="btn ghost" data-act="new-ci">+ Статья расходов</button></div>
    <p class="note" style="margin:6px 0 12px">Необязательны. Себестоимость производства считается без них; полная себестоимость = производство + эти статьи. Каждая статья учитывается один раз на изделие; в карточке изделия её можно отключить.</p>
    ${list.length?`<table class="t stack"><thead><tr><th>Статья</th><th>Группа</th><th>Правило</th><th>Изделия</th></tr></thead><tbody>${list.map(it=>`<tr class="click${it.archived?' muted':''}" data-act="edit-ci" data-id="${it.id}">
      <td><b>${esc(it.name)}</b>${U.archTag(it)}</td><td>${esc(SC.COST_GROUPS[it.group]||'')}</td><td>${esc(itemRule(it))}</td><td>${esc(scopeText(it))}</td></tr>`).join('')}</tbody></table>`:U.empty('Статей пока нет — полная себестоимость равна себестоимости производства.')}`;
  }
  function editCostItem(id){
    const it=id?F.items().find(x=>x.id===id):null,isNew=!it;
    const draft=isNew?{id:'',name:'',group:'per-item',method:'fixed',amount:'',cur:'USD',batchQty:'',scopeAll:true,pids:{}}:
      {id:it.id,name:it.name,group:it.group,method:it.method,amount:String(it.amount),cur:it.cur,batchQty:it.batchQty==null?'':String(it.batchQty),
       scopeAll:it.scope==='all'||!it.scope,pids:Object.fromEntries((Array.isArray(it.scope)?it.scope:[]).map(p=>[p,true])),archived:it.archived};
    const opt=(o,sel)=>Object.entries(o).map(([k,t])=>`<option value="${k}" ${k===sel?'selected':''}>${esc(t)}</option>`).join('');
    U.openModal({title:isNew?'Новая статья расходов':it.name,draft,saveLabel:isNew?'Добавить':'Сохранить',
      body:d=>`${d.archived?'<div class="banner"><span>Статья в архиве: в расчётах не участвует, в зафиксированных заказах сохранена.</span></div>':''}
        ${field('Название',inp('name',d.name,'placeholder="Например: Фотосессия коллекции"'))}
        <div class="grid g2">${field('Группа',`<select data-f="group">${opt(SC.COST_GROUPS,d.group)}</select>`)}${field('Способ учёта',`<select data-f="method">${opt(SC.COST_METHODS,d.method)}</select>`)}</div>
        <div class="grid g3">${field(d.method==='percent'?'Процент от цены, %':d.method==='batch'?'Сумма на партию':'Сумма на изделие',ninp('amount',d.amount))}
          ${d.method==='percent'?'<div></div>':field('Валюта',`<select data-f="cur">${opt({USD:'USD',UAH:'UAH'},d.cur)}</select>`)}
          ${d.method==='batch'?field('Плановое количество, шт.',ninp('batchQty',d.batchQty)):'<div></div>'}</div>
        <div class="note">${d.method==='batch'?'На изделие = сумма ÷ плановое количество. Изменение количества не меняет уже зафиксированные заказы.':d.method==='percent'?'Считается от цены продажи: в заказе — от согласованной цены позиции.':'Сумма добавляется к каждому изделию.'} Суммы в USD переводятся по курсу (в заказе — по курсу заказа).</div>
        <div class="sec">Применяется к</div>
        <label class="chk"><input type="checkbox" data-f="scopeAll" ${d.scopeAll?'checked':''}> Все изделия</label>
        ${d.scopeAll?'':`<div class="grid g3">${S().products.filter(p=>!p.archived).map(p=>`<label class="chk"><input type="checkbox" data-f="pids.${p.id}" ${d.pids[p.id]?'checked':''}> ${esc(p.name)}</label>`).join('')}</div>`}`,
      onInput:f=>f==='method'||f==='scopeAll',
      extra:d=>{if(isNew)return '';const used=F.usedInSnapshots(d.id).length;
        return (d.archived?`<button class="btn ghost sm" data-act="ci-unarchive">Вернуть из архива</button>`:`<button class="btn ghost sm" data-act="ci-archive">В архив</button>`)+
          (used?`<span class="note" style="margin-left:12px">в заказах: ${used}</span>`:`<button class="btn danger" data-act="ci-del" style="margin-left:14px">Удалить</button>`)},
      onAction:async(act,b,d,draw,close)=>{
        if(act==='ci-archive'||act==='ci-unarchive'){it.archived=act==='ci-archive';SK.store.save();close();A.refresh()}
        else if(act==='ci-del'){if(await U.askConfirm('Удалить статью? Она не зафиксирована ни в одном заказе.','Удалить')){try{F.removeItem(d.id);SK.store.save();close();A.refresh()}catch(e){U.toast(e.message)}}}
      },
      onSave:d=>{const err=F.saveItem(Object.assign({},d,{scopePids:Object.keys(d.pids||{}).filter(k=>d.pids[k])}));if(err){U.toast(err);return false}SK.store.save();A.refresh()}
    });
  }

  function editOp(id){
    const op=id?S().operations.find(o=>o.id===id):null,isNew=!op;
    const draft=isNew?{id:'',name:'',minA:'',minB:'',preliminary:true}:{id:op.id,name:op.name,minA:op.normMin?String(op.normMin[0]):'',minB:op.normMin?String(op.normMin[1]):'',preliminary:!!op.preliminary,archived:op.archived};
    U.openModal({title:isNew?'Новая операция':op.name,draft,saveLabel:isNew?'Добавить':'Сохранить',
      body:d=>{
        const used=isNew?[]:T.usage(d.id);
        return `${d.archived?'<div class="banner"><span>Операция в архиве: не предлагается в новых маршрутах, но сохранена в изделиях и истории.</span></div>':''}
        ${field('Название',inp('name',d.name,'placeholder="Например: Тиснение"'))}
        <div class="grid g2">${field('Норматив от, мин',ninp('minA',d.minA))}${field('Норматив до, мин',ninp('minB',d.minB))}</div>
        <label class="chk"><input type="checkbox" data-f="preliminary" ${d.preliminary?'checked':''}> предварительный норматив (ориентир, не стандарт)</label>
        <div class="note">Норматив подставляется в маршрут изделия как стартовое значение (середина диапазона) и подсвечивает выход за пределы. Рабочее время задаётся в каждом изделии.</div>
        ${used.length?`<div class="note">Используется в изделиях: ${used.map(p=>esc(p.name)).join(', ')}.</div>`:''}`;
      },
      extra:d=>{
        if(isNew)return '';
        const can=I.canDelete('operation',d.id).ok;
        return (d.archived?`<button class="btn ghost sm" data-act="unarchive">Вернуть из архива</button>`:`<button class="btn ghost sm" data-act="archive">В архив</button>`)+
          (can?`<button class="btn danger" data-act="del" style="margin-left:14px">Удалить</button>`:'');
      },
      onAction:async(act,b,d,draw,close)=>{
        if(act==='archive'||act==='unarchive'){I.setArchived('operation',d.id,act==='archive');SK.store.save();close();A.refresh();U.toast(act==='archive'?'Операция в архиве':'Операция возвращена из архива')}
        else if(act==='del'){
          if(!I.canDelete('operation',d.id).ok){U.info('Удаление невозможно','Операция есть в маршрутах изделий. Её можно только отправить в архив.');return}
          if(await U.askConfirm('Удалить операцию? Она не используется ни в одном изделии.','Удалить')){I.remove('operation',d.id);SK.store.save();close();A.refresh()}
        }
      },
      onSave:d=>{const err=T.save(d);if(err){U.toast(err);return false}SK.store.save();A.refresh()}
    });
  }

  A.register('technology','Процессы',render,{parent:'prefs'});   // not in the menu: opened from «Настройки»
  A.action({'new-ci':()=>editCostItem(),'edit-ci':id=>editCostItem(id),'new-op':()=>editOp(),'edit-op':id=>editOp(id),
    'op-up':id=>{if(T.move(id,-1)){SK.store.save();A.LISTS.technology()}},
    'op-down':id=>{if(T.move(id,1)){SK.store.save();A.LISTS.technology()}}});
})();
</script>
<script>
/* ======== js/modules/orders.js ======== */
/* Skripo Studio · modules/orders.js — «Заказы»: client, items, money, dates, status, comments, photos, history, production */
'use strict';
(function(){
  const {$,esc,uid,num,fmt,uah,usd,qf,today,fdate,clone}=SK.util;
  const U=SK.ui,C=SK.costing,I=SK.inventory,O=SK.orders,SC=SK.schema,A=SK.app;
  const S=()=>SK.S,UI=A.UI;
  const {field,inp,opts}=U;

  function render(){
    $('#main').innerHTML=`
    <div class="head"><div><h1>Заказы</h1><p class="lead">Клиенты и изделия на заказ: параметры, стоимость, предоплата и остаток, сроки, статусы и комментарии.</p></div><button class="ib addb" data-act="new-order" title="Новый заказ" aria-label="Новый заказ">${U.IC.plus}</button></div>
    ${SK.ordersTabs('orders')}
    <div class="toolbar tb-icons">${U.tabsRow('ord-st',[['','Все'],...SC.OSTAT.map(x=>[x,x])],UI.ordStatus,'ordtabs')}${U.searchBox('ordSearch','ordQ','Клиент, номер…')}</div>
    <div id="list"></div>`;
    A.LISTS.orders();SK.fadeScroll($('#ordtabs'));
  }
  A.action({'ord-st':id=>{UI.ordStatus=id;A.refresh()}});
  A.LISTS.orders=()=>{
    const q=UI.ordQ.toLowerCase();
    const a=S().orders.filter(o=>(!UI.ordStatus||o.status===UI.ordStatus)&&(!q||[o.no,o.client,o.contact,o.phone,o.contactOther].join(' ').toLowerCase().includes(q))).sort((x,y)=>(y.date||'').localeCompare(x.date||'')||(y.no||'').localeCompare(x.no||''));
    $('#list').innerHTML=a.length?`<table class="t stack"><thead><tr><th>№</th><th>Клиент</th><th>Изделия</th><th class="r">Сумма</th><th class="r">Оплачено</th><th>Срок</th><th>Статус</th><th></th></tr></thead><tbody>${a.map(o=>{
      const t=C.orderTotal(o),over=o.deadline&&o.deadline<today()&&SC.ACTIVE.includes(o.status);
      return `<tr class="click" data-act="edit-order" data-id="${o.id}"><td><b>${esc(o.no||'')}</b><div class="note">${fdate(o.date)}</div></td><td>${esc(o.client)}<div class="note">${esc([o.phone,o.channel].filter(Boolean).join(' · '))}</div></td><td>${SK.orderTitle(o)}</td>
      <td class="r">${usd(t)}</td><td class="r ${num(o.paidUSD)>=t&&t>0?'good-t':''}">${num(o.paidUSD)?usd(num(o.paidUSD)):'—'}${t>num(o.paidUSD)&&num(o.paidUSD)?`<div class="note">остаток ${usd(t-num(o.paidUSD))}</div>`:''}</td>
      <td class="${over?'bad-t':''}">${fdate(o.deadline)}</td><td><span class="tag ${o.status==='Закрыт'?'dark':o.status==='Отменён'?'bad':''}">${o.status}</span>${o.written?'<div class="note">материалы списаны</div>':''}</td>
      <td class="r"><button class="linkbtn" data-act="est-order" data-id="${o.id}">Смета</button></td></tr>`}).join('')}</tbody></table>`:
      U.empty(S().orders.length?'Ничего не найдено':'Заказов пока нет',S().orders.length?'':`<br><button class="btn" data-act="new-order">+ Первый заказ</button>`);
  };

  function orderBody(d){
    const locked=!!d.written,dis=locked?'disabled':'';
    return `
    <div class="sec">Клиент</div>
    <div class="grid g3">${field('Имя',inp('client',d.client))}${field('Телефон',inp('phone',d.phone,'placeholder="+380…"'))}${field('Мессенджер',`<select data-f="channel">${opts(SC.CHANNELS,d.channel)}</select>`)}</div>
    <div class="grid g2">${field('Ник или ссылка в мессенджере',inp('contact',d.contact,'placeholder="@ник"'))}${field('Другие контакты',inp('contactOther',d.contactOther,'placeholder="почта, адрес доставки…"'))}</div>
    <div class="sec">Изделия</div>
    ${locked?`<div class="note">Материалы списаны: модель, количество, цена и замены материалов заблокированы. Описание позиции можно менять. Чтобы изменить состав, сначала верните материалы на склад.</div>`:''}
    <div class="lines">${d.lines.map((l,i)=>{const p=C.prodById(l.pid),comp=p?p.bom.filter(c=>c.mid):[];return `<div class="ln">
      <div class="ln-top">${field('Модель из каталога',`<select data-f="lines.${i}.pid" ${dis}>${U.prodOpts(l.pid)}</select>`)}${field('Шт.',`<input type="text" inputmode="decimal" data-f="lines.${i}.qty" value="${esc(l.qty)}" ${dis}>`)}${field('Цена за шт., $',`<input type="text" inputmode="decimal" data-f="lines.${i}.priceUSD" value="${esc(l.priceUSD)}" ${dis}>`)}${locked?'<span></span>':`<button class="btn ghost sm" data-act="rm-line" data-i="${i}" title="Убрать" style="height:38px">✕</button>`}</div>
      <div class="grid g3">${field('Цвет',inp(`lines.${i}.color`,l.color))}${field('Материал',inp(`lines.${i}.material`,l.material,'placeholder="кожа, фактура"'))}${field('Индивидуальные параметры',inp(`lines.${i}.params`,l.params,'placeholder="размер, гравировка…"'))}</div>
      ${field('Комментарий к позиции',inp(`lines.${i}.note`,l.note))}
      ${comp.length?`<details><summary>Замена материалов под заказ (другой цвет кожи и т.п.)</summary><table class="t mini"><tbody>${comp.map(c=>{const m=C.matById(c.mid);return `<tr><td style="width:40%">${esc(m?m.name:'(удалён)')}</td><td><select data-f="lines.${i}.subs.${c.mid}" ${dis}>${U.matOpts((l.subs||{})[c.mid]||'','как в составе изделия')}</select></td></tr>`}).join('')}</tbody></table></details>`:(p?'<div class="note">У изделия не задан состав, себестоимость и списание не посчитаются.</div>':'')}</div>`}).join('')}</div>
    ${locked?'':`<div><button class="btn ghost sm" data-act="add-line">+ Изделие</button></div>`}
    <div class="sec">Сроки и статус</div>
    <div class="grid g4">${field('Дата заказа',`<input type="date" data-f="date" value="${esc(d.date)}">`)}${field('Плановая готовность',`<input type="date" data-f="deadline" value="${esc(d.deadline)}">`)}
      ${field('Фактическая готовность',`<input type="date" data-f="doneDate" value="${esc(d.doneDate)}">`)}${field('Статус',`<select data-f="status">${opts(SC.OSTAT,d.status)}</select>`)}</div>
    <div class="sec">Финансы</div>
    <div class="grid g4">${field('Предоплата, $',U.ninp('paidUSD',d.paidUSD))}</div>
    <div class="panel"><div id="live"></div></div>
    ${productionSection(d)}
    <div class="sec">Комментарии и фото</div>
    ${field('Комментарии',`<textarea data-f="notes">${esc(d.notes)}</textarea>`)}
    <div class="thumbs">${(d.photoIds||[]).map((pid,i)=>{const u=SK.store.photoURL(pid);return `<div class="thumb" data-zoom="${u}"><img src="${u}" alt=""><button data-act="rmphoto" data-i="${i}" title="Удалить">×</button></div>`}).join('')}
      <button class="addph" data-act="addphoto">+ фото</button><input type="file" accept="image/*" multiple hidden data-photo></div>
    ${historyBlock(d)}`;
  }
  function historyBlock(d){
    const h=(d.history||[]).slice().reverse();if(!h.length)return '';
    const DATE_FIELDS=['date','deadline','doneDate'];
    const val=(v,f)=>v===''?'—':esc(DATE_FIELDS.includes(f)&&/^\d{4}-\d{2}-\d{2}$/.test(v)?fdate(v):v);
    return `<details><summary>История изменений (${h.length})</summary><table class="t mini"><tbody>${h.map(e=>`<tr><td style="width:130px;white-space:nowrap">${esc(new Date(e.at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}))}</td>
      <td>${e.event?esc(e.event):(e.changes||[]).map(c=>`<b>${esc(c.label)}</b>: ${val(c.from,c.field)} → ${val(c.to,c.field)}`).join('<br>')}</td></tr>`).join('')}</tbody></table></details>`;
  }
  function rateNote(d){
    const r=C.orderRate(d),rs=d.rateSnap;
    const state=rs&&rs.frozen?(rs.restored?'зафиксирован при переносе':'зафиксирован'):'текущий, зафиксируется при переходе из «Новый»';
    return `<div class="sum"><span>Курс заказа <span class="note">· ${state}</span></span><span>${fmt(r,2)} ₴/$</span></div>`;
  }
  function orderLive(d){
    const locked=!!d.written,cons=C.consumption(d);
    const needRows=[...cons.entries()].map(([mid,q])=>{const m=C.matById(mid);return {m,q,have:m?num(m.stock):0}});
    const need=needRows.length?`<div class="sec" style="margin:0 0 6px">Материалы: нужно и есть на складе</div><table class="t mini" style="margin-bottom:16px"><thead><tr><th>Материал</th><th class="r">Нужно</th><th class="r">На складе</th><th></th></tr></thead><tbody>${needRows.map(r=>{const short=!locked&&r.have<r.q;return `<tr><td>${esc(r.m.name)}</td><td class="r">${qf(r.q)} ${esc(r.m.unit)}</td><td class="r">${qf(r.have)} ${esc(r.m.unit)}</td><td class="r">${locked?'<span class="tag">списано</span>':short?`<span class="tag bad">не хватает ${qf(r.q-r.have)}</span>`:'<span class="tag good">хватает</span>'}</td></tr>`}).join('')}</tbody></table>`:'';
    const t=C.orderTotal(d),cost=C.orderCost(d),pu=t*C.orderRate(d);
    return need+`<div class="sum"><span>Сумма заказа</span><span>${usd(t)}</span></div><div class="sum"><span>Оплачено</span><span>${usd(num(d.paidUSD))}</span></div>
    <div class="sum"><span>Осталось получить</span><span>${usd(Math.max(0,t-num(d.paidUSD)))}</span></div>
    ${rateNote(d)}
    ${costLines(d,cost)}
    ${extrasLines(d,cost,pu)}`;
  }
  /* optional expense items (2026-11-12): fixed snapshot › not recorded (old snapshot) › live estimate; two profits */
  function extrasLines(d,cost,pu){
    const e=SK.fullcost.orderExtras(d),full=cost+e.extrasUAH;
    const src={snapshot:'зафиксированы при списании',estimate:'оценка, зафиксируются при списании материалов'}[e.source];
    const row=(label,c,cls='')=>{const m=C.margin(pu,c);return `<div class="sum ${cls}"><span>${label}</span>${U.calculated(c)?`<span class="${pu-c<0?'bad-t':''}">${uah(pu-c)} · ${U.pct(m)}</span>`:U.NOT_CALC}</div>`};
    let h='';
    if(e.source==='not-recorded')h+=`<div class="note" style="margin:4px 0">Дополнительные статьи расходов в этом заказе не учитывались — он зафиксирован до их введения и не пересчитывается.</div>`;
    else if(e.items.length){
      h+=`<div class="sum"><span>Дополнительные на изделие <span class="note">· ${src}</span></span><span>${uah(e.perItemItemsUAH)}</span></div>
      <div class="sum"><span>Расходы бренда <span class="note">· ${src}</span></span><span>${uah(e.brandUAH)}</span></div>
      <div class="sum"><span><b>Полная себестоимость</b></span><span><b>${U.calculated(full)?uah(full):'—'}</b></span></div>`;
    }
    h+=row(`Прибыль / маржа по себестоимости производства${d.fact?' (по факту)':''}`,cost,e.items.length?'':'total');
    if(e.items.length)h+=row('Прибыль / маржа по полной себестоимости',full,'total');
    return h;
  }
  /* which cost is shown — labels only; the value is still C.orderCost (fact → plan → norm) */
  function costLines(d,cost){
    const plan=d.plan&&d.plan.totalUAH!=null?`<div class="sum"><span>Себестоимость производства плановая <span class="note">· зафиксирована при списании</span></span><span>${uah(num(d.plan.totalUAH))}</span></div>`:'';
    if(d.fact)return plan+`<div class="sum"><span>Себестоимость производства фактическая</span><span>${uah(cost)}</span></div>`;
    if(d.plan)return plan;
    return `<div class="sum"><span>Себестоимость производства по нормативу</span>${U.calculated(cost)?`<span>${uah(cost)}</span>`:U.NOT_CALC}</div>`;
  }
  /* «Работа над заказом»: jobs + norm / plan / fact — collapsed by default, open state kept per order while the app runs */
  const prodOpen=new Set();
  function productionSection(d){
    const js=SK.production.jobsOf(d.id);
    if(!js.length&&!d.plan&&!d.fact)return '';
    return `<details class="block"${prodOpen.has(d.id)?' open':''}><summary data-act="prod-toggle">Работа над заказом${js.length?` · заданий: ${js.length}`:''}${d.fact?' · факт зафиксирован':''}</summary>${productionBlock(d)}</details>`;
  }
  /* stage 3: jobs of the order + norm / plan / fact comparison (read-only) */
  function productionBlock(d){
    const P=SK.production,js=P.jobsOf(d.id);
    if(!js.length&&!d.plan&&!d.fact)return '';
    const cmp=P.compare(d),cols=[['Норматив',cmp.norm],['План',cmp.plan],['Факт',cmp.fact]];
    const cell=(c,k)=>c&&c[k]!=null?uah(c[k]):'—';
    const devF=k=>{const f=cmp.fact,p=cmp.plan||cmp.norm;if(!f||!p||p[k]==null)return '';const dd=f[k]-p[k];return Math.abs(dd)<0.005?'0':`<span class="${dd>0?'bad-t':'good-t'}">${dd>0?'+':''}${uah(dd)}${p[k]?` (${dd>0?'+':''}${fmt(dd/p[k]*100,0)}%)`:''}</span>`};
    const rows=[['Материалы','mat'],['Работа','labor'],['Прочие расходы','other'],['Накладные','overhead'],['Себестоимость','total']];
    return `<div style="height:10px"></div>
    ${js.length?`<table class="t mini" style="margin-bottom:12px"><tbody>${js.map(j=>`<tr class="click" data-act="open-job" data-id="${j.id}"><td><b>${esc(j.no)}</b></td><td>${esc(j.name)} × ${qf(j.qty)}</td><td>${esc(P.STATUS[j.status])}</td><td class="r">${j.actual?uah(j.actual.totalUAH):'—'}</td></tr>`).join('')}</tbody></table>`:''}
    <table class="t mini"><thead><tr><th></th>${cols.map(([t])=>`<th class="r">${t}</th>`).join('')}<th class="r">Факт − план</th></tr></thead><tbody>
    ${rows.map(([t,k])=>`<tr><td>${k==='total'?'<b>'+t+'</b>':t}</td>${cols.map(([,c])=>`<td class="r">${cell(c,k)}</td>`).join('')}<td class="r">${devF(k)}</td></tr>`).join('')}
    <tr><td>Маржа</td><td class="r">${U.marginText(cmp.margin.norm,cmp.norm.total)}</td><td class="r">${cmp.plan?U.marginText(cmp.margin.plan,cmp.plan.total):'—'}</td><td class="r">${cmp.fact?U.marginText(cmp.margin.fact,cmp.fact.total):'—'}</td><td></td></tr></tbody></table>
    <div class="note">${d.fact?`Факт зафиксирован ${new Date(d.fact.at).toLocaleString('ru-RU')}${d.fact.version>1?` (версия ${d.fact.version}: ${esc(d.fact.reason||'')})`:''}; готово изделий: ${qf(d.fact.qtyDone)}. Не пересчитывается при изменении цен, курса и маршрутов.`:'Факт появится, когда все задания заказа будут закрыты.'}</div>`;
  }
  const PHONE=/^\+?[\d\s()\-]{7,}$/;
  const newLine=(pid,price)=>({id:uid(),pid:pid||'',qty:'1',priceUSD:price||'',color:'',material:'',params:'',note:'',subs:{}});
  function editOrder(id,preset){
    const isNew=!id;
    const draft=isNew?{id:uid(),no:null,date:today(),client:'',phone:'',contact:'',contactOther:'',channel:'Instagram',deadline:'',doneDate:'',status:'Новый',notes:'',
      lines:[newLine(preset&&preset.pid,preset&&preset.price)],paidUSD:'',photoIds:[],history:[],rateSnap:null,written:null,plan:null,fact:null}:clone(S().orders.find(o=>o.id===id));
    draft.photoIds=draft.photoIds||[];
    /* older orders kept a phone in «contact»: show it as the phone (saved only if the user saves) */
    if(!isNew&&!draft.phone&&PHONE.test(String(draft.contact||'').trim())){draft.phone=draft.contact.trim();draft.contact=''}
    U.openModal({title:isNew?'Новый заказ':'Заказ '+draft.no,wide:true,draft,saveLabel:isNew?'Создать':'Сохранить',body:orderBody,live:orderLive,
      onInput:(f,d)=>{
        if(f==='status'&&d.status==='Готов'&&!d.doneDate){d.doneDate=today();return true}
        const m=f.match(/^lines\.(\d+)\.pid$/);
        if(m){const p=C.prodById(d.lines[+m[1]].pid);if(p){d.lines[+m[1]].priceUSD=p.priceUSD||'';d.lines[+m[1]].subs={}}return true}
        return /\.subs\./.test(f);
      },
      extra:d=>{
        if(isNew)return '';
        const can=I.canDelete('order',d.id).ok,P=SK.production;
        const jobsBtn=d.status!=='Отменён'&&P.linesWithoutJob(d).length?`<button class="btn ghost sm" data-act="make-jobs" style="margin-left:8px">Создать задания</button>`:'';
        return (can?`<button class="btn danger" data-act="del">Удалить</button>`:'')+`<button class="btn ghost sm" data-act="est" style="margin-left:14px">Смета</button>`+
          (d.written?(P.hasFixedActual(d)?'':`<button class="btn ghost sm" data-act="unwrite" style="margin-left:8px">Вернуть материалы на склад</button>`):`<button class="btn ghost sm" data-act="write" style="margin-left:8px">Списать материалы</button>`)+jobsBtn;
      },
      onAction:async(act,b,d,draw,close)=>{
        if(act==='add-line'){d.lines.push(newLine());draw()}
        else if(act==='rmphoto'){d.photoIds.splice(+b.dataset.i,1);draw()}
        else if(act==='prod-toggle'){if(prodOpen.has(d.id))prodOpen.delete(d.id);else prodOpen.add(d.id)}
        else if(act==='rm-line'){d.lines.splice(+b.dataset.i,1);draw()}
        else if(act==='write'){
          if(!d.client.trim()){U.toast('Укажите клиента');return}
          if(!d.lines.some(l=>l.pid)){U.toast('Добавьте изделие');return}
          O.commit(d);
          const short=[...C.consumption(d).entries()].filter(([mid,q])=>num((C.matById(mid)||{}).stock)<q).length;
          if(short&&!await U.askConfirm(`На складе не хватает ${short} поз. Списать всё равно (остаток уйдёт в минус)?`,'Списать')){SK.store.save();return}
          O.writeOff(d);SK.store.save();close();A.refresh();U.toast('Материалы списаны, плановая себестоимость и курс зафиксированы');
        }
        else if(act==='unwrite'){try{O.unWriteOff(d)}catch(e){U.toast(e.message);return}O.commit(d);SK.store.save();close();A.refresh();U.toast('Материалы возвращены на склад')}
        else if(act==='make-jobs'){
          if(!d.client.trim()){U.toast('Укажите клиента');return}
          if(!d.lines.some(l=>l.pid)){U.toast('Добавьте изделие');return}
          O.commit(d);const made=SK.production.createJobs(d);SK.store.save();close();A.refresh();
          U.toast(made.length?`Создано заданий: ${made.length} (${made.map(j=>j.no).join(', ')})`:'Все позиции уже в производстве');
        }
        else if(act==='open-job'){close();SK.editJob(b.dataset.id)}
        else if(act==='est'){O.commit(d);SK.store.save();close();A.EST.src='order';A.EST.id=d.id;A.go('estimate')}
        else if(act==='del'){
          if(!I.canDelete('order',d.id).ok){U.info('Удаление невозможно','Заказ уже в истории (вышел из статуса «Новый» или по нему было списание). Используйте статус «Отменён».');return}
          if(await U.askConfirm('Удалить заказ?','Удалить')){I.remove('order',d.id);SK.store.save();close();A.refresh()}
        }
      },
      onSave:d=>{
        if(!d.client.trim()){U.toast('Укажите клиента');return false}
        if(!d.lines.some(l=>l.pid)){U.toast('Добавьте хотя бы одно изделие');return false}
        O.commit(d);SK.store.save();A.refresh();
        const needWrite=SC.WRITE_STATES.includes(d.status)&&!d.written&&C.consumption(d).size>0;
        const needBack=d.status==='Отменён'&&d.written;
        if(needWrite)setTimeout(async()=>{if(await U.askConfirm('Заказ в работе, а материалы ещё не списаны. Списать со склада сейчас?','Списать')){const o=S().orders.find(x=>x.id===d.id);O.writeOff(o);SK.store.save();A.refresh();U.toast('Материалы списаны')}},120);
        if(needBack)setTimeout(async()=>{if(await U.askConfirm('Заказ отменён. Вернуть списанные материалы на склад?','Вернуть')){const o=S().orders.find(x=>x.id===d.id);try{O.unWriteOff(o)}catch(e){U.toast(e.message);return}SK.store.save();A.refresh();U.toast('Материалы возвращены')}},120);
      }});
  }

  /* «Создать заказ» from a catalog card: model and price carried over */
  SK.newOrderFromProduct=pid=>{const p=C.prodById(pid);if(!p)return;A.go('orders');setTimeout(()=>editOrder(null,{pid,price:p.priceUSD||''}),60)};
  /* section tabs: Заказы · Задания (the production jobs page, highlighted under «Заказы» in the menu) */
  SK.ordersTabs=on=>`<div class="seg tabs">${[['orders','Заказы'],['production','Задания']].map(([k,t])=>`<a href="#${k}" class="${on===k?'on':''}">${t}</a>`).join('')}</div>`;
  A.register('orders','Заказы',render,{nav:5});
  A.action({'new-order':()=>editOrder(),'edit-order':id=>editOrder(id),'est-order':id=>{A.EST.src='order';A.EST.id=id;A.go('estimate')}});
})();
</script>
<script>
/* ======== js/modules/production.js ======== */
/* Skripo Studio · modules/production.js — «Производство»: jobs list + job card (fact time, materials, actual cost) */
'use strict';
(function(){
  const {$,esc,num,fmt,uah,qf,r3,today,fdate,clone}=SK.util;
  const U=SK.ui,C=SK.costing,P=SK.production,O=SK.orders,A=SK.app;
  const S=()=>SK.S,UI=A.UI;
  const {field,inp,ninp,opts}=U;
  Object.assign(UI,{jobView:UI.jobView||'active',jobQ:UI.jobQ||''});

  /* same shortage warning as the order card gives before a write-off */
  const shortNote=o=>{const n=[...C.consumption(o).entries()].filter(([mid,q])=>num((C.matById(mid)||{}).stock)<q).length;return n?` На складе не хватает ${n} поз.: остаток уйдёт в минус.`:''};
  const statusTag=j=>`<span class="tag ${j.status==='done'?'dark':j.status==='cancelled'?'bad':j.status==='in_work'?'good':''}">${P.STATUS[j.status]}</span>`;
  const mins=m=>`${qf(r3(num(m)))} мин`;
  const dev=(f,p)=>{if(p==null||f==null)return '';const d=f-p;if(Math.abs(d)<0.005)return '<span class="note">0</span>';const pc=p?` (${d>0?'+':''}${fmt(d/p*100,0)}%)`:'';return `<span class="${d>0?'bad-t':'good-t'}">${d>0?'+':''}${uah(d)}${pc}</span>`};

  function render(){
    const views=[['active','В очереди и в работе'],['done','Готово'],['cancelled','Отменено'],['all','Все']];
    $('#main').innerHTML=`
    <div class="head"><div><h1>Задания</h1><p class="lead">Производственные задания по заказам: этапы по маршруту, фактическое время, расход материалов и фактическая себестоимость.</p></div></div>
    ${SK.ordersTabs('production')}
    <div class="toolbar tb-icons">${U.tabsRow('job-view',views,UI.jobView,'jobtabs')}${U.searchBox('jobSearch','jobQ','Задание, заказ, изделие…')}</div>
    <div id="list"></div>
    <p class="note" style="margin-top:14px">Задания создаются в карточке заказа кнопкой «Создать задания».</p>`;
    A.LISTS.production();SK.fadeScroll($('#jobtabs'));
  }
  A.LISTS.production=()=>{
    const q=UI.jobQ.toLowerCase(),v=UI.jobView;
    const list=P.jobs().filter(j=>(v==='all'||(v==='active'?(j.status==='queued'||j.status==='in_work'):j.status===v))&&
      (!q||[j.no,j.name,(P.orderOf(j)||{}).no,(P.orderOf(j)||{}).client].join(' ').toLowerCase().includes(q)))
      .sort((a,b)=>(a.deadline||'9').localeCompare(b.deadline||'9')||a.no.localeCompare(b.no));
    $('#list').innerHTML=list.length?`<table class="t stack"><thead><tr><th>Задание</th><th>Заказ</th><th>Изделие</th><th>Срок</th><th>Этапы</th><th class="r">План / факт</th><th>Статус</th></tr></thead><tbody>${list.map(j=>{
      const o=P.orderOf(j),pr=P.progress(j),over=j.deadline&&j.deadline<today()&&(j.status==='queued'||j.status==='in_work');
      return `<tr class="click" data-act="edit-job" data-id="${j.id}"><td><b>${esc(j.no)}</b></td><td>${esc(o?o.no:'')}<div class="note">${esc(o?o.client:'')}</div></td>
      <td>${esc(j.name)} × ${qf(j.qty)}</td><td class="${over?'bad-t':''}">${fdate(j.deadline)}</td><td>${pr.total?`${pr.done} / ${pr.total}`:'<span class="muted">маршрут не задан</span>'}</td>
      <td class="r">${mins(pr.planMin)} / ${pr.factMin?mins(pr.factMin):'—'}</td><td>${statusTag(j)}${j.actual&&j.actual.version>1?' <span class="note">испр.</span>':''}</td></tr>`}).join('')}</tbody></table>`:U.empty('Заданий нет');
  };

  /* ---------- job card ---------- */
  function materialsTable(j){
    const rows=P.materialsOf(j);
    if(!rows.length)return '<div class="note">Расхода материалов по заданию пока нет. Основное списание делается в заказе и распределяется на задания по нормам.</div>';
    return `<table class="t mini"><thead><tr><th>Материал</th><th class="r">По заказу</th><th class="r">Доп. расход</th><th class="r">Возврат</th><th class="r">Итого</th><th class="r">Стоимость</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td>
      <td class="r">${r.allocQty?qf(r3(r.allocQty)):'—'}</td><td class="r">${r.extraQty?qf(r3(r.extraQty)):'—'}</td><td class="r">${r.retQty?'−'+qf(r3(r.retQty)):'—'}</td>
      <td class="r">${qf(r.qty)} ${esc(r.unit)}</td><td class="r">${uah(r.cost)}</td></tr>`).join('')}</tbody></table>`;
  }
  function moveForm(prefix){
    return `<div class="grid" style="grid-template-columns:2fr 90px 150px auto;align-items:end;gap:10px">
      ${field('Материал',`<select data-f="${prefix}.mid">${U.matOpts('')}</select>`)}${field('Кол-во',ninp(prefix+'.qty',''))}
      ${field('Вид',`<select data-f="${prefix}.kind"><option value="over">Перерасход</option><option value="scrap">Брак</option><option value="ret">Возврат на склад</option></select>`)}
      ${prefix==='mv'?'<button class="btn ghost sm" data-act="job-move" style="height:38px">Записать</button>':'<span></span>'}</div>`;
  }
  function actualTable(j){
    const a=j.actual,p=j.plan;if(!a)return '';
    const row=(t,pv,fv)=>`<tr><td>${t}</td><td class="r">${pv==null?'—':uah(pv)}</td><td class="r">${uah(fv)}</td><td class="r">${dev(fv,pv)}</td></tr>`;
    return `<div class="sec">Фактическая себестоимость ${a.status==='cancelled'?'(отменённое задание — понесённые затраты)':''} · версия ${a.version}</div>
    <table class="t mini"><thead><tr><th></th><th class="r">План задания</th><th class="r">Факт</th><th class="r">Отклонение</th></tr></thead><tbody>
    ${row('Материалы',p.matUAH,a.matUAH)}${row(`Работа · ${mins(a.minutes)} × ${uah(a.hourRate)}/ч`,p.laborUAH,a.laborUAH)}${row('Прочие расходы',p.otherUAH,a.otherUAH)}${row(`Накладные ${fmt(a.overheadPct,0)}%`,p.overheadUAH,a.overheadUAH)}
    <tr><td><b>Итого</b></td><td class="r"><b>${uah(p.totalUAH)}</b></td><td class="r"><b>${uah(a.totalUAH)}</b></td><td class="r">${dev(a.totalUAH,p.totalUAH)}</td></tr></tbody></table>
    <div class="note">Зафиксировано ${new Date(a.at).toLocaleString('ru-RU')}. Снимок не меняется при изменении цен, курса или маршрутов${a.reason?`. Причина последней корректировки: ${esc(a.reason)}`:''}.</div>
    ${(j.actualHistory||[]).length?`<details><summary>Предыдущие версии (${j.actualHistory.length})</summary><table class="t mini"><tbody>${j.actualHistory.slice().reverse().map(h=>`<tr><td>v${h.version}</td><td>${new Date(h.at).toLocaleString('ru-RU')}</td><td class="r">${uah(h.totalUAH)}</td><td>заменена: ${esc(h.reason||'')}</td></tr>`).join('')}</tbody></table></details>`:''}`;
  }
  function jobBody(d){
    const j=P.jobById(d.id),o=P.orderOf(j),editable=j.status==='in_work';
    return `
    <div class="grid g4"><div><div class="sec">Заказ</div>${esc(o?o.no+' · '+o.client:'—')}</div><div><div class="sec">Изделие</div>${esc(j.name)} × ${qf(j.qty)}</div>
      <div><div class="sec">Срок</div>${fdate(j.deadline)||'—'}</div><div><div class="sec">Статус</div>${statusTag(j)}</div></div>
    ${j.status==='cancelled'?`<div class="banner"><span>Задание отменено${j.cancelReason?': '+esc(j.cancelReason):''}. ${j.actual?'Понесённые затраты сохранены и входят в историю заказа; в готовые изделия не засчитывается.':'Затрат не было.'}</span></div>`:''}
    <div class="sec">Этапы (маршрут на момент создания задания)</div>
    ${j.steps.length?`<table class="t mini"><thead><tr><th>Операция</th><th class="r">План, мин/шт</th><th class="r">План, мин</th><th style="width:110px">Факт, мин</th><th style="width:70px">Готово</th></tr></thead><tbody>${d.steps.map((s,i)=>{const t=j.steps[i];const ov=P.overPlan({planMin:t.planMin,factMin:String(s.factMin).trim()===''?'':num(s.factMin)});
      return `<tr><td>${esc(t.name)}</td><td class="r">${qf(t.planMinUnit)}</td><td class="r">${qf(t.planMin)}</td>
      <td>${editable?`<input type="text" inputmode="decimal" data-f="steps.${i}.factMin" value="${esc(s.factMin)}" placeholder="${esc(qf(t.planMin))}" ${ov?'style="border-color:var(--danger)"':''}>`:`<span class="${ov?'bad-t':''}">${String(t.factMin)===''?'—':qf(t.factMin)}</span>`}</td>
      <td>${editable?`<input type="checkbox" data-f="steps.${i}.done" ${s.done?'checked':''}>`:(t.done?'✓':'')}</td></tr>`}).join('')}</tbody></table>
      <div class="note">Факт ≥ плана на ${fmt((P.OVER-1)*100,0)}% подсвечивается. Пустой факт при завершении = план.</div>`:'<div class="note">У изделия не было маршрута на момент создания задания: фактическое время не учитывается.</div>'}
    <div class="sec">Материалы задания</div>
    ${materialsTable(j)}
    ${editable?moveForm('mv'):''}
    ${actualTable(j)}`;
  }
  function editJob(id){
    const j=P.jobById(id);if(!j)return;
    const draft={id:j.id,steps:j.steps.map(s=>({factMin:s.factMin,done:s.done})),mv:{mid:'',qty:'',kind:'over'}};
    U.openModal({title:`Задание ${j.no}`,wide:true,draft,noSave:j.status!=='in_work',saveLabel:'Сохранить факт',cancel:j.status==='in_work'?'Отмена':'Закрыть',body:jobBody,
      onInput:f=>/\.done$/.test(f),
      extra:()=>{
        const b=[];
        if(j.status==='queued')b.push(`<button class="btn sm" data-act="job-start">Взять в работу</button>`);
        if(j.status==='in_work')b.push(`<button class="btn sm" data-act="job-finish">Завершить</button>`);
        if(j.status==='queued'||j.status==='in_work')b.push(`<button class="btn ghost sm" data-act="job-cancel">Отменить задание</button>`);
        if(P.isUntouched(j))b.push(`<button class="btn danger" data-act="job-del">Удалить</button>`);
        if(j.actual)b.push(`<button class="btn ghost sm" data-act="job-correct">Корректировка</button>`);
        const o=P.orderOf(j);if(o)b.push(`<button class="btn ghost sm" data-act="job-order">Заказ ${esc(o.no)}</button>`);
        return b.join(' ');
      },
      onAction:async(act,b,d,draw,close)=>{
        try{
          if(act==='job-start'){
            P.start(j);SK.store.save();
            const o=P.orderOf(j);
            if(o&&o.status==='Новый'&&await U.askConfirm(`Задание в работе. Перевести заказ ${o.no} в «В работе»? Курс заказа зафиксируется.`,'Перевести')){O.setStatus(o,'В работе');SK.store.save()}
            if(o&&!o.written&&C.consumption(o).size>0&&await U.askConfirm('Материалы по заказу ещё не списаны. Списать со склада сейчас?'+shortNote(o),'Списать')){O.writeOff(o);SK.store.save()}
            close();editJob(j.id);A.refresh();
          }
          else if(act==='job-move'){P.saveSteps(j,d.steps);P.materialMove(j,d.mv);SK.store.save();d.mv={mid:'',qty:'',kind:'over'};draw();U.toast('Записано в журнал склада')}
          else if(act==='job-finish'){
            P.saveSteps(j,d.steps);
            const c=P.canFinish(j);
            if(!c.ok){
              const o=P.orderOf(j);
              if(c.needWrite&&o&&await U.askConfirm(c.reason+'. Списать материалы по заказу сейчас?'+shortNote(o),'Списать')){O.writeOff(o);SK.store.save()}else{SK.store.save();U.toast(c.reason);return}
            }
            if(!await U.askConfirm('Завершить задание? Фактическая себестоимость будет зафиксирована и дальше меняется только через корректировку.','Завершить'))return;
            const fixed=P.finish(j);SK.store.save();
            const o=P.orderOf(j);
            if(fixed&&o&&(o.status==='В работе'||o.status==='Новый')&&await U.askConfirm(`Все задания заказа ${o.no} закрыты, фактическая себестоимость заказа зафиксирована. Перевести заказ в «Готов»?`,'Перевести')){O.setStatus(o,'Готов');SK.store.save()}
            close();editJob(j.id);A.refresh();U.toast('Задание завершено');
          }
          else if(act==='job-cancel'){
            if(P.isUntouched(j)){if(await U.askConfirm('Отменить задание? Затрат по нему нет.','Отменить')){P.cancel(j,'');SK.store.save();close();A.refresh()}return}
            close();cancelForm(j);
          }
          else if(act==='job-del'){if(await U.askConfirm('Удалить задание? Затрат по нему нет.','Удалить')){P.remove(j);SK.store.save();close();A.refresh()}}
          else if(act==='job-correct'){close();correctForm(j)}
          else if(act==='job-order'){close();A.ACT['edit-order'](j.orderId)}
        }catch(e){U.toast(e.message)}
      },
      onSave:d=>{try{P.saveSteps(j,d.steps);SK.store.save();A.refresh();U.toast('Факт сохранён')}catch(e){U.toast(e.message);return false}}
    });
  }
  function cancelForm(j){
    U.openModal({title:`Отмена ${j.no}`,draft:{reason:''},saveLabel:'Отменить задание',
      body:d=>`<div class="note">По заданию уже есть затраты (время или материалы). Они будут зафиксированы как понесённая себестоимость и останутся в истории заказа; задание не засчитывается в готовые изделия.</div>${field('Причина отмены',inp('reason',d.reason))}`,
      onSave:d=>{try{P.cancel(j,d.reason);SK.store.save();A.refresh();U.toast('Задание отменено, затраты зафиксированы')}catch(e){U.toast(e.message);return false}}});
  }
  function correctForm(j){
    const draft={reason:'',steps:j.steps.map(s=>({factMin:s.factMin,done:s.done})),cm:{mid:'',qty:'',kind:'ret'}};
    U.openModal({title:`Корректировка ${j.no}`,wide:true,draft,saveLabel:'Сохранить новую версию',
      body:d=>`<div class="note">Текущая версия (v${j.actual.version}, ${uah(j.actual.totalUAH)}) сохранится в истории. Новая версия считается по исправленному времени и журналу склада${P.orderOf(j)&&P.orderOf(j).fact?'; фактическая себестоимость заказа тоже получит новую версию':''}.</div>
      ${j.steps.length?`<table class="t mini"><thead><tr><th>Операция</th><th class="r">План, мин</th><th style="width:120px">Факт, мин</th></tr></thead><tbody>${j.steps.map((t,i)=>`<tr><td>${esc(t.name)}</td><td class="r">${qf(t.planMin)}</td><td><input type="text" inputmode="decimal" data-f="steps.${i}.factMin" value="${esc(d.steps[i].factMin)}"></td></tr>`).join('')}</tbody></table>`:''}
      <div class="sec">Материал (необязательно): возврат остатка, доп. расход или брак</div>${moveForm('cm')}
      ${field('Причина корректировки',inp('reason',d.reason,'placeholder="обязательно"'))}`,
      onSave:d=>{try{P.correct(j,{steps:d.steps,move:d.cm,reason:d.reason});SK.store.save();A.refresh();U.toast('Новая версия себестоимости сохранена')}catch(e){U.toast(e.message);return false}}});
  }

  SK.editJob=editJob;
  A.register('production','Производство',render,{parent:'orders'});
  A.action({'edit-job':id=>editJob(id),'job-view':id=>{UI.jobView=id;A.refresh()}});
})();
</script>
<script>
/* ======== js/modules/calc.js ======== */
/* Skripo Studio · modules/calc.js — «Калькулятор» (draft lives in S.calc, Sklad v1 shape: comp + hours) */
'use strict';
(function(){
  const {$,esc,uid,num,fmt,uah,usd,qf,r3,clone}=SK.util;
  const U=SK.ui,C=SK.costing,A=SK.app;
  const S=()=>SK.S;
  const {field}=U;
  const calcCost=(c,qty)=>C.costOf(c.comp,{route:C.routeFromHours(c.hours),other:c.other,qty});

  const cur=()=>A.UI.calcCur==='USD'?'USD':'UAH';
  const rateN=()=>num(S().settings.rate)||1;
  const money=v=>cur()==='USD'?usd(v/rateN()):uah(v);
  const r2=v=>String(Math.round(v*100)/100).replace('.',',');
  const sym=()=>cur()==='USD'?'$':'₴';
  function render(){
    const c=S().calc,usdM=cur()==='USD';
    const compRows=c.comp.map((x,i)=>{const m=C.matById(x.mid);
      return `<div class="rc-row rc-comp"><select data-root="calc" data-f="comp.${i}.mid" data-reload="1">${U.matOpts(x.mid)}</select>
      <input type="text" inputmode="decimal" data-root="calc" data-f="comp.${i}.qty" value="${esc(x.qty)}" aria-label="Количество">
      <span class="rc-mul">${esc(m?m.unit:'')} ×</span><span class="rc-unit">${m?money(C.matUAH(m)):'—'}</span>
      <span class="rc-sum" data-rs="c${i}"></span><button class="rc-x" data-act="calc-rm-comp" data-i="${i}" aria-label="Убрать">×</button></div>`}).join('');
    const othRows=c.other.map((o,i)=>`<div class="rc-row rc-oth"><input type="text" data-root="calc" data-f="other.${i}.name" value="${esc(o.name)}" placeholder="Название">
      <input type="text" inputmode="decimal" data-root="calc" data-cvt="uah" data-f="other.${i}.uah" value="${esc(usdM&&o.uah!==''?r2(num(o.uah)/rateN()):o.uah)}" placeholder="${sym()}" aria-label="Сумма">
      <span class="rc-mul">${sym()}</span><button class="rc-x" data-act="calc-rm-other" data-i="${i}" aria-label="Убрать">×</button></div>`).join('');
    const ownShown=c.price===''?'':(usdM?c.price:r2(num(c.price)*rateN()));
    $('#main').innerHTML=`
    <div class="rc">
    <div class="rc-top"><h1>Калькулятор</h1><button class="rc-cur" data-act="calc-cur" title="Валюта: ${usdM?'доллар':'гривна'}. Нажмите, чтобы переключить" aria-label="Валюта: ${usdM?'доллар':'гривна'}. Нажмите, чтобы переключить">${usdM?'USD':'UAH'}</button></div>
    <div class="rc-sheet">
      <div class="rc-base">${field('За основу',`<select data-root="calc" data-f="pid" data-reload="1">${U.prodOpts(c.pid,'— с нуля —')}</select>`)}${field('Кол-во, шт.',`<input type="text" inputmode="decimal" data-root="calc" data-f="qty" value="${esc(c.qty)}">`)}${field('Курс, ₴ за $',`<input type="text" inputmode="decimal" data-set="rate" value="${esc(S().settings.rate)}">`)}</div>
      <div class="rc-blk"><div class="rc-lbl">Состав (на 1 шт.)</div>${compRows||'<div class="note">Пусто. Добавьте материалы.</div>'}<button class="btn ghost sm" data-act="calc-add-comp">+ Материал</button></div>
      <div class="rc-blk"><div class="rc-lbl">Работа</div>
        <div class="rc-row rc-work"><input type="text" inputmode="decimal" data-root="calc" data-f="hours" value="${esc(c.hours)}" aria-label="Часов на 1 шт."><span class="rc-mul">ч ×</span><span class="rc-unit">${money(num(S().settings.hourRate))}/ч</span><span class="rc-sum" data-rs="w"></span><span></span></div>
        <div class="note">Ставка часа — в «Процессах».</div></div>
      <div class="rc-blk"><div class="rc-lbl">Расходы</div>${othRows}<button class="btn ghost sm" data-act="calc-add-other">+ Расход</button></div>
      <div class="rc-blk rc-price"><div class="rc-lbl">Цена</div>
        <div class="rc-two">${field('Целевая маржа, %',`<input type="text" inputmode="decimal" data-root="calc" data-f="margin" value="${esc(c.margin)}" placeholder="${fmt(num(S().settings.margin),0)}">`)}${field(`Своя цена, ${sym()}`,`<input type="text" inputmode="decimal" data-root="calc" data-cvt="usd" data-f="price" value="${esc(ownShown)}" placeholder="проверить маржу">`)}</div></div>
      <div id="calcres"></div>
      <div><button class="btn ghost sm" data-act="calc-reset">Очистить</button></div>
    </div></div>`;
    calcResult();
  }
  const targetMargin=c=>c.margin!==''?num(c.margin):num(S().settings.margin);
  /* full cost of 1 unit (2026-11-12): production cost unchanged + optional expense items.
     Items of the base product (its switches respected); «с нуля» → only items for all products.
     % items are taken from the own price, otherwise from the recommended price. */
  function calcFull(c){
    const rate=num(S().settings.rate),base=c.pid?C.prodById(c.pid):null,one=calcCost(c);
    const ctx={pid:base?base.id:null,off:base?base.costItemsOff:[],rate};
    const tm=targetMargin(c);
    const rec=SK.fullcost.recommended(SK.fullcost.full(one,Object.assign({priceUAH:0},ctx)),tm,rate);
    const priceUAH=num(c.price)?num(c.price)*rate:rec.exactUAH;
    return {one,rec,fc:SK.fullcost.full(one,Object.assign({priceUAH},ctx)),rate,base,tm};
  }
  function calcResult(){
    const c=S().calc,qty=num(c.qty)||1;
    const {one,rec,fc,rate,base,tm}=calcFull(c),all=calcCost(c,qty);
    const own=num(c.price),ownU=own*rate;
    const short=all.rows.filter(r=>!r.missing&&num((C.matById(r.mid)||{}).stock)<r.qty);
    c.comp.forEach((x,i)=>{const el=document.querySelector(`[data-rs="c${i}"]`);if(el){const m=C.matById(x.mid);el.textContent=m?money(num(x.qty)*C.matUAH(m)):'—'}});
    const wEl=document.querySelector('[data-rs="w"]');if(wEl)wEl.textContent=money(one.labor);
    U.setCur(cur());
    let h='';
    try{
    h+=`<div class="rc-tot"><div class="rc-line"><span>Себестоимость производства</span><b>${money(fc.production)}</b></div>`;
    if(fc.extrasUAH)h+=`<div class="rc-line"><span>Полная себестоимость</span><b>${money(fc.full)}</b></div>`;
    if(qty!==1)h+=`<div class="rc-line rc-muted"><span>На ${qf(qty)} шт. — производство / полная</span><span>${money(fc.production*qty)} / ${money(fc.full*qty)}</span></div>`;
    h+=`<details class="rc-det"><summary>Из чего складывается</summary>${U.fullBreakdown(fc)}</details>`;
    if(!num(S().settings.hourRate)&&num(c.hours))h+=`<div class="note bad-t" style="margin-top:8px">Базовая ставка часа в «Процессах» = 0, работа не учтена в себестоимости.</div>`;
    h+=`<div class="rc-pricebox"><span>Цена при марже ${fmt(tm,0)}%</span>${rec.invalid?`<div class="note bad-t">Маржа + процентные статьи ≥ 100% — цену подобрать нельзя.</div>`:`<b class="rc-big">${money(rec.exactUAH)}</b>`}</div>`;
    if(!rec.invalid)h+=`<div class="rc-alt">${cur()==='USD'?`≈ ${uah(rec.exactUAH)}`:`≈ ${usd(rec.exactUSD)}`} · округлённо до $5: <b>${rec.round5?usd(rec.round5):'—'}</b></div>`;
    h+='</div>';
    if(own){h+=`<div class="rc-own"><h3>Ваша цена ${money(ownU)}</h3>${U.profitLines(ownU,fc)}
    <div class="sum"><span>Наценка к себестоимости производства</span><span>${fc.production?fmt((ownU/fc.production-1)*100,0)+'%':'—'}</span></div></div>`}
    if(base&&num(base.priceUSD)){const m=C.margin(num(base.priceUSD)*rate,fc.production);h+=`<div class="note" style="margin-top:10px">Текущая цена «${esc(base.name)}»: ${money(num(base.priceUSD)*rate)}, маржа по себестоимости производства ${m==null?'—':fmt(m*100,0)+'%'}.</div>`}
    }finally{U.setCur('UAH')}
    if(short.length)h+=`<div class="note bad-t" style="margin-top:12px">Не хватает на складе на ${qf(qty)} шт.: ${short.map(r=>esc(r.name)).join(', ')}</div>`;
    h+=`<div class="rc-btns"><button class="btn" data-act="calc-save-prod">Сохранить как изделие</button>${base?`<button class="btn ghost" data-act="calc-apply-price">Записать цену в «${esc(base.name)}»</button>`:''}<button class="btn ghost" data-act="calc-est">Смета</button></div>`;
    $('#calcres').innerHTML=h;
  }
  function calcLoad(pid){
    const p=C.prodById(pid);
    if(p){const c=S().calc;c.comp=clone(p.bom);const h=r3(C.routeHours(p.route));c.hours=h?String(h).replace('.',','):'';c.other=clone(p.other);c.price=p.priceUSD||''}
  }
  /* own price, else the recommended price rounded to $5 (same formula as before when there are no expense items) */
  function calcPrice(){
    const c=S().calc;if(num(c.price))return num(c.price);
    return calcFull(c).rec.round5||0;
  }
  SK.calc={cur,render:calcResult,load:calcLoad,price:calcPrice,cost:calcCost};

  A.register('calc','Калькулятор',render,{nav:4});
  A.action({
    'calc-cur':()=>{A.UI.calcCur=cur()==='USD'?'UAH':'USD';try{localStorage.setItem('skripo_currency',A.UI.calcCur)}catch(e){}A.refresh()},
    'calc-add-comp':()=>{S().calc.comp.push({mid:'',qty:''});SK.store.save();A.refresh()},
    'calc-rm-comp':(_i,b)=>{S().calc.comp.splice(+b.dataset.i,1);SK.store.save();A.refresh()},
    'calc-add-other':()=>{S().calc.other.push({name:'',uah:''});SK.store.save();A.refresh()},
    'calc-rm-other':(_i,b)=>{S().calc.other.splice(+b.dataset.i,1);SK.store.save();A.refresh()},
    'calc-reset':()=>{S().calc=SK.schema.emptyCalc();SK.store.save();A.refresh()},
    'calc-est':()=>{A.EST.src='calc';A.go('estimate')},
    'calc-apply-price':()=>{const p=C.prodById(S().calc.pid);if(!p)return;const v=calcPrice();if(!v){U.toast('Нет цены');return}p.priceUSD=String(v);SK.store.save();U.toast('Цена записана: '+usd(v));A.refresh()},
    'calc-save-prod':()=>{
      const c=S().calc;
      U.openModal({title:'Сохранить как изделие',draft:{name:''},saveLabel:'Сохранить',body:d=>field('Название изделия',U.inp('name',d.name)),
        onSave:d=>{
          if(!d.name.trim()){U.toast('Укажите название');return false}
          S().products.push({id:uid(),name:d.name.trim(),size:'',status:'В разработке',category:'',color:'',construction:'',hardware:'',materialNote:'',
            priceUSD:String(calcPrice()||''),images:[],photoIds:[],bom:clone(c.comp).filter(x=>x.mid),route:C.routeFromHours(c.hours),other:clone(c.other),notes:'',archived:false,origin:{calc:true}});
          SK.store.save();U.toast('Изделие добавлено');
        }});
    }
  });
})();
</script>
<script>
/* ======== js/modules/estimate.js ======== */
/* Skripo Studio · modules/estimate.js — «Смета» (internal with cost / client version in Ukrainian) */
'use strict';
(function(){
  const {$,esc,num,fmt,uah,usd,qf,today,fdate}=SK.util;
  const U=SK.ui,C=SK.costing,A=SK.app;
  const S=()=>SK.S,EST=A.EST;

  function estData(){
    const rate=num(S().settings.rate);
    if(EST.src==='order'){
      const o=S().orders.find(x=>x.id===EST.id);if(!o)return null;
      return {no:o.no,date:o.date,client:o.client,contact:[o.phone,o.contact].filter(Boolean).join(' · '),paid:num(o.paidUSD),isOrder:true,snap:o.plan?o.plan.totalUAH:null,deadline:o.deadline,
        rate:C.orderRate(o),rateFrozen:!!(o.rateSnap&&o.rateSnap.frozen),
        items:o.lines.map(l=>{const p=C.prodById(l.pid),q=num(l.qty)||1;return {name:p?p.name:'(изделие удалено)',size:p?p.size:'',note:l.note,qty:q,price:num(l.priceUSD),cost:C.orderLineCost(l)}})};
    }
    if(EST.src==='product'){
      const p=C.prodById(EST.id);if(!p)return null;const q=num(EST.qty)||1;
      return {no:'',date:today(),client:'',rate,items:[{name:p.name,size:p.size,note:'',qty:q,price:num(p.priceUSD),cost:C.prodCost(p,q)}]};
    }
    const c=S().calc,q=num(c.qty)||1,base=c.pid?C.prodById(c.pid):null;
    return {no:'',date:today(),client:'',rate,items:[{name:base?base.name:'Расчёт',size:base?base.size:'',note:'',qty:q,price:SK.calc.price(),cost:SK.calc.cost(c,q)}]};
  }
  function render(){
    const d=estData();
    const orderSel=`<option value="">— выбрать заказ —</option>`+S().orders.slice().sort((a,b)=>(b.no||'').localeCompare(a.no||'')).map(o=>`<option value="${o.id}" ${o.id===EST.id?'selected':''}>${esc(o.no)} · ${esc(o.client)}</option>`).join('');
    $('#main').innerHTML=`
    <div class="head no-print"><div><h1>Смета</h1><p class="lead">Внутренняя смета показывает себестоимость и маржу. Версия для клиента — только изделия и цены.</p></div><span><button class="btn ghost" data-act="est-back">← Назад</button> <button class="btn ghost" data-act="est-copy">Скопировать для клиента</button> <button class="btn" data-act="print">Печать / PDF</button></span></div>
    <div class="est-ctl no-print">
      <div class="seg" id="estsrc">${[['order','Заказ'],['product','Изделие'],['calc','Калькулятор']].map(([k,t])=>`<button data-act="est-src" data-id="${k}" class="${EST.src===k?'on':''}">${t}</button>`).join('')}</div>
      ${EST.src==='order'?`<label class="f">Заказ<select data-est="id">${orderSel}</select></label>`:''}
      ${EST.src==='product'?`<label class="f">Изделие<select data-est="id">${U.prodOpts(EST.id)}</select></label><label class="f" style="min-width:90px">Шт.<input type="text" inputmode="decimal" data-est="qty" value="${esc(EST.qty)}"></label>`:''}
      <div class="seg">${[['internal','С себестоимостью'],['client','Для клиента']].map(([k,t])=>`<button data-act="est-mode" data-id="${k}" class="${EST.mode===k?'on':''}">${t}</button>`).join('')}</div>
    </div>
    <div id="estdoc">${doc(d)}</div>`;
  }
  const doc=d=>d?(EST.mode==='client'?clientDoc(d):internalDoc(d)):U.empty('Выберите заказ или изделие');
  function internalDoc(d){
    const rate=d.rate;let cost=0,rev=0;
    const blocks=d.items.map(it=>{
      const c=it.cost;cost+=c.total;rev+=it.price*it.qty;
      const rows=c.rows.map(r=>`<tr><td>${esc(r.name)}${r.subbed?' <span class="note">(замена)</span>':''}</td><td class="r">${qf(r.qty)} ${esc(r.unit)}</td><td class="r">${r.missing?'—':fmt(r.price,2)}</td><td class="r">${r.missing?'—':uah(r.sum)}</td></tr>`).join('');
      const extra=[c.labor||c.hours?`<tr><td>Работа</td><td class="r">${qf(c.hours)} ч</td><td class="r">${fmt(num(S().settings.hourRate),2)}</td><td class="r">${uah(c.labor)}</td></tr>`:'',
        ...c.oth.map(o=>`<tr><td>${esc(o.name)}</td><td class="r"></td><td class="r"></td><td class="r">${uah(o.sum)}</td></tr>`),
        c.overhead?`<tr><td>Накладные ${fmt(num(S().settings.overhead),0)}%</td><td></td><td></td><td class="r">${uah(c.overhead)}</td></tr>`:''].join('');
      const pu=it.price*it.qty*rate;
      return `<section class="blk"><h3><span style="color:var(--graphite);font-weight:600">${esc(it.name)}${it.size?' · '+esc(it.size)+' см':''}</span><span>× ${qf(it.qty)}</span></h3>${it.note?`<div class="note" style="margin:6px 0">${esc(it.note)}</div>`:''}
      <table class="t"><thead><tr><th>Статья</th><th class="r">Кол-во</th><th class="r">Цена, ₴</th><th class="r">Сумма</th></tr></thead><tbody>${rows}${extra}
      <tr><td colspan="3"><b>Себестоимость позиции</b></td><td class="r"><b>${uah(c.total)}</b></td></tr>
      <tr><td colspan="3">Цена продажи ${usd(it.price)} × ${qf(it.qty)}</td><td class="r">${usd(it.price*it.qty)} ≈ ${uah(pu)}</td></tr></tbody></table></section>`;
    }).join('');
    const pu=rev*rate,m=C.margin(pu,cost);
    return `<div class="doc">${docHead(d,'Смета · внутренняя')}${d.client?`<div style="margin-bottom:20px"><b>${esc(d.client)}</b>${d.contact?' · '+esc(d.contact):''}</div>`:''}${blocks}
    <div class="totals"><div class="sum"><span>Себестоимость итого</span><span>${uah(cost)}</span></div>${d.snap!=null&&Math.abs(d.snap-cost)>1?`<div class="sum"><span>Зафиксировано при списании</span><span>${uah(d.snap)}</span></div>`:''}
    <div class="sum"><span>Цена продажи итого</span><span>${usd(rev)} ≈ ${uah(pu)}</span></div>
    <div class="sum"><span>Прибыль</span>${U.calculated(cost)?`<span class="${pu-cost<0?'bad-t':''}">${uah(pu-cost)}</span>`:U.NOT_CALC}</div>
    <div class="sum total"><span>Маржа</span><span>${U.marginText(m,cost)}</span></div>
    ${d.isOrder?`<div class="sum" style="margin-top:8px"><span>Оплачено</span><span>${usd(d.paid)}</span></div><div class="sum"><span>Осталось получить</span><span>${usd(Math.max(0,rev-d.paid))}</span></div>`:''}</div>
    <div class="foot">${d.isOrder?(d.rateFrozen?'Курс заказа (зафиксирован)':'Курс заказа (текущий)'):'Курс'} ${fmt(rate,2)} ₴/$. Себестоимость позиций по текущим ценам материалов.</div></div>`;
  }
  function clientDoc(d){
    const rev=d.items.reduce((a,i)=>a+i.price*i.qty,0);
    return `<div class="doc">${docHead(d,'Кошторис','uk')}${d.client?`<div style="margin-bottom:20px">Клієнт: <b>${esc(d.client)}</b></div>`:''}
    <table class="t"><thead><tr><th>Виріб</th><th class="r">К-сть</th><th class="r">Ціна</th><th class="r">Сума</th></tr></thead><tbody>${d.items.map(it=>`<tr><td><b>${esc(it.name)}</b>${it.size?` <span class="note">${esc(it.size)} см</span>`:''}${it.note?`<div class="note">${esc(it.note)}</div>`:''}</td><td class="r">${qf(it.qty)}</td><td class="r">${it.price?usd(it.price):'—'}</td><td class="r">${it.price?usd(it.price*it.qty):'—'}</td></tr>`).join('')}</tbody></table>
    <div class="totals"><div class="sum total"><span>Разом</span><span>${usd(rev)}</span></div>
    ${d.isOrder&&d.paid?`<div class="sum"><span>Передоплата</span><span>${usd(d.paid)}</span></div><div class="sum"><span>До сплати</span><span>${usd(Math.max(0,rev-d.paid))}</span></div>`:''}</div>
    <div class="foot">Оплата після підтвердження замовлення.${d.deadline?` Орієнтовна дата готовності: ${fdate(d.deadline)}.`:''}</div></div>`;
  }
